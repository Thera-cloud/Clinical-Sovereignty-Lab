# =============================================================================
# LITTLE NATE / SOVEREIGN SANCTUARY — Hardened Redis Configuration
# =============================================================================
# Security layers:
#   1. Password authentication (requirepass)
#   2. Dangerous command restriction (rename-command)
#   3. Memory limit with eviction policy
#   4. Protected mode enabled
#
# Network note: bind 0.0.0.0 is safe here because in production the container
# has NO host port mapping — Docker's network namespace ensures Redis is only
# reachable from other containers on nate_network. In dev, the host port is
# bound to 127.0.0.1 only.
# =============================================================================

# ── Network ──────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 300
tcp-keepalive 60

# ── Authentication ───────────────────────────────────────────────────────────
# Password is injected via environment variable in docker-compose.
# For redis.conf, we use a placeholder — override at container start via
# --requirepass flag, or set the actual password here for production.
# The compose command appends --requirepass ${REDIS_PASSWORD} at runtime.

# ── Persistence ──────────────────────────────────────────────────────────────
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# ── Memory Management ────────────────────────────────────────────────────────
maxmemory 256mb
maxmemory-policy volatile-lru

# ── Disable Dangerous Commands ───────────────────────────────────────────────
# These commands are never used by the application (which only needs
# XADD, XREADGROUP, XGROUP, XINFO, PING, SCAN, SUBSCRIBE, PUBLISH).
# Renaming to "" effectively disables them.
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG NATE_CONFIG_0x9B2F
rename-command DEBUG ""
rename-command KEYS ""
rename-command SHUTDOWN NATE_SHUTDOWN_0x7E3A

# Note: SHUTDOWN is renamed rather than disabled so we can still gracefully
# stop Redis via the renamed command if needed. The random suffix prevents
# accidental use.

# ── Logging ──────────────────────────────────────────────────────────────────
loglevel notice
