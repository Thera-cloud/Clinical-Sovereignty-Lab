services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    # Pin to specific minor version for reproducibility; update deliberately
    image: postgres:15.10-alpine
    container_name: nate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-little_nate}
      POSTGRES_USER: ${POSTGRES_USER:-nate_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    # No ports exposed — only reachable by backend/bridge via nate_network (postgres:5432)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nate_admin} -d ${POSTGRES_DB:-little_nate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - data_network

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    # Pin to specific minor version for reproducibility; update deliberately
    image: redis:7.4-alpine
    container_name: nate_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:?Redis password required}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    # No ports exposed — only reachable by backend/bridge via data_network (redis:6379)
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - data_network

  # ---------------------------------------------------------------------------
  # Backend API Server (FastAPI) — bind to localhost; Nginx terminates TLS
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nate_backend
    restart: unless-stopped
    env_file:
      - .env
    # CRITICAL: These override .env values with Docker-internal hostnames.
    # .env contains LAN IPs (10.0.0.81) unreachable inside the container network.
    # Do NOT remove — see learned-integration-patterns rule #14.
    environment:
      - DATABASE_URL=postgresql://nate_app:${NATE_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-little_nate}
      - POSTGRES_USER=nate_app
      - POSTGRES_PASSWORD=${NATE_APP_DB_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
      - SANDBOX_URL=http://10.13.13.4:9090
      - SANDBOX_HMAC_KEY=${SANDBOX_HMAC_KEY:-}
      - ENVIRONMENT=production
      - DEBUG=false
      # Cloudflare R2 (zero-egress object storage)
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_DEFAULT_BUCKET=${R2_DEFAULT_BUCKET:-nate-vault}
      - R2_WARM_BUCKET=${R2_WARM_BUCKET:-nate-warm-memory}
      - R2_COLD_BUCKET=${R2_COLD_BUCKET:-nate-cold-archive}
      - R2_HERITAGE_BUCKET=${R2_HERITAGE_BUCKET:-nate-heritage-vault}
      # Backblaze B2 (cold archive — 60% cheaper, Object Lock WORM)
      - B2_APPLICATION_KEY_ID=${B2_APPLICATION_KEY_ID:-}
      - B2_APPLICATION_KEY=${B2_APPLICATION_KEY:-}
      - B2_S3_ENDPOINT=${B2_S3_ENDPOINT:-}
      - B2_REGION=${B2_REGION:-us-east-005}
      - B2_DEFAULT_BUCKET=${B2_DEFAULT_BUCKET:-nate-cold-archive}
      - B2_HERITAGE_BUCKET=${B2_HERITAGE_BUCKET:-nate-heritage-vault}
      - B2_COLD_BUCKET=${B2_COLD_BUCKET:-nate-cold-archive}
      - B2_HERITAGE_LOCK_YEARS=${B2_HERITAGE_LOCK_YEARS:-7}
      - B2_PUBLIC_URL=${B2_PUBLIC_URL:-}
      # Azure Whisper STT + Edge TTS (cheap voice path)
      - AZURE_WHISPER_ENDPOINT=${AZURE_WHISPER_ENDPOINT:-}
      - AZURE_WHISPER_DEPLOYMENT=${AZURE_WHISPER_DEPLOYMENT:-nate-whisper}
      - AZURE_WHISPER_API_VERSION=${AZURE_WHISPER_API_VERSION:-2024-06-01}
      - EDGE_TTS_VOICE=${EDGE_TTS_VOICE:-en-US-GuyNeural}
      # Cloudflare Workers AI
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro    # Mount source code so scp+restart picks up changes
      - ./data/backend:/app/data
      - ./data/bridge:/app/bridge_data:ro  # Bridge metrics (PMB, Nevedal state) for dashboard read
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          memory: 768M
    networks:
      - data_network
      - app_network

  # ---------------------------------------------------------------------------
  # WebSocket Bridge Server — bind to localhost; Nginx upgrades to WSS
  # ---------------------------------------------------------------------------
  bridge:
    build:
      context: ./backend
      dockerfile: Dockerfile.bridge
    container_name: nate_bridge
    restart: unless-stopped
    env_file:
      - .env
    # CRITICAL: These override .env values with Docker-internal hostnames.
    # Do NOT remove — see learned-integration-patterns rule #14.
    environment:
      - DATABASE_URL=postgresql://nate_app:${NATE_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-little_nate}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=nate_app
      - POSTGRES_PASSWORD=${NATE_APP_DB_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-little_nate}
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    ports:
      - "127.0.0.1:${WEBSOCKET_PORT:-8765}:8765"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro    # Mount source code so scp+restart picks up changes
      - ./data/bridge:/app/data
      # Read backend scheduling + Zoom join_url without duplicating stores
      - ./data/backend:/app/backend_data:ro
      - bridge_logs:/app/logs
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8765)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          memory: 768M
    networks:
      - data_network
      - app_network

  # ---------------------------------------------------------------------------
  # Admin Console (React) — served by Nginx in production
  # ---------------------------------------------------------------------------
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: nate_admin
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=https://api.sovereignsanctuary.net
      - REACT_APP_API_BASE_URL=https://api.sovereignsanctuary.net
      - REACT_APP_WS_URL=wss://api.sovereignsanctuary.net/ws
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3000}:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - app_network

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy — TLS termination + routing
  # ---------------------------------------------------------------------------
  nginx:
    # Pin to specific minor version for reproducibility; update deliberately
    image: nginx:1.27-alpine
    container_name: nate_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./mobile/build/web:/var/www/flutter-web:ro        # Flutter client/coach portal
      - ./dashboard:/var/www/dashboard:ro                  # Admin command portal
      - /var/www/certbot:/var/www/certbot:ro               # ACME challenges
    depends_on:
      backend:
        condition: service_healthy
      bridge:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  bridge_logs:
    driver: local

networks:
  data_network:
    driver: bridge
    internal: true
  app_network:
    driver: bridge
