# =============================================================================
# CLINICAL SOVEREIGNTY LAB / LITTLE NATE
# Docker Compose - Complete Development Stack
# =============================================================================
# Usage:
#   docker compose up -d              # Start all services
#   docker compose up -d postgres     # Start just database
#   docker compose logs -f backend    # View backend logs
#   docker compose down               # Stop all services
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: nate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-little_nate}
      POSTGRES_USER: ${POSTGRES_USER:-nate_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nate_admin} -d ${POSTGRES_DB:-little_nate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nate_network

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nate_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:?Redis password required}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nate_network

  # ---------------------------------------------------------------------------
  # Backend API Server (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nate_backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nate_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-little_nate}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "127.0.0.1:${SERVER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nate_network
      - hunt_command

  # ---------------------------------------------------------------------------
  # WebSocket Bridge Server
  # ---------------------------------------------------------------------------
  bridge:
    build:
      context: ./backend
      dockerfile: Dockerfile.bridge
    container_name: nate_bridge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nate_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-little_nate}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATA_DIR=/app/data
    ports:
      - "127.0.0.1:${WEBSOCKET_PORT:-8765}:8765"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro
      - ./data/bridge:/app/data
      - bridge_logs:/app/logs
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8765)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nate_network

  # ---------------------------------------------------------------------------
  # Admin Console (React)
  # ---------------------------------------------------------------------------
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: nate_admin
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://${SERVER_HOST:-10.0.0.81}:${SERVER_PORT:-8000}
      - REACT_APP_API_BASE_URL=http://${SERVER_HOST:-10.0.0.81}:${SERVER_PORT:-8000}
      - REACT_APP_WS_URL=ws://${SERVER_HOST:-10.0.0.81}:${WEBSOCKET_PORT:-8765}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3000}:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nate_network

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (Production)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nate_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - bridge
      - admin
    networks:
      - nate_network
    profiles:
      - production

  # ---------------------------------------------------------------------------
  # Detonation Sandbox (Layer 6 — Isolated)
  # Local dev only. Production uses dedicated VPS at 10.13.13.4 (178.128.178.15)
  # ---------------------------------------------------------------------------
  detonation:
    build:
      context: ./backend
      dockerfile: Dockerfile.sandbox
    container_name: nate_detonation
    restart: unless-stopped
    tmpfs:
      - /tmp:size=512m
      - /dev/shm:size=256m
    environment:
      - SANDBOX_MODE=true
      - SANDBOX_HMAC_KEY=${SANDBOX_HMAC_KEY:-}
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    networks:
      hunt_network:
      hunt_command:
        ipv4_address: 172.30.0.2
    mem_limit: 2g
    cpus: 1.5
    dns:
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles:
      - security

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  bridge_data:
    driver: local
  bridge_logs:
    driver: local
  nginx_logs:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  nate_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  hunt_network:
    # Layer 6: Isolated network for detonation sandbox + VPN egress
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
  hunt_command:
    # Layer 6: API-only bridge between backend and sandbox (no internet)
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
