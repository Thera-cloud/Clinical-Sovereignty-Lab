name = "nate-cron-worker"
main = "worker.js"
compatibility_date = "2026-03-01"

[[analytics_engine_datasets]]
binding = "ANALYTICS_AE"
dataset = "sovereign_events_ae"

# Cron Triggers — no HTTP routes needed
[triggers]
crons = [
  "*/5 * * * *",   # Every 5 min: combined heartbeat + immune sentinel (1 KV write)
  "0 * * * *",     # Every hour: crystal pre-warming + D1 sync + stale cache purge
]

[[r2_buckets]]
binding = "CRYSTAL_STORE"
bucket_name = "nate-vault"

[[kv_namespaces]]
binding = "SUMMON_CACHE"
id = "9e7c13aca09d489faa5ce30b87333aaa"

[[d1_databases]]
binding = "D1_HOT"
database_name = "nate-hot"
database_id = "8dcd53ad-a6fb-49f4-8ca9-5a5843489cd0"

[[d1_databases]]
binding = "D1_SANDBOX"
database_name = "cli-chamberofsecrets"
database_id = "bedabdd5-ab9d-4a56-b29d-362f1c345ada"

[[vectorize]]
binding = "WISDOM_INDEX"
index_name = "nate-wisdom"

[[vectorize]]
binding = "CODE_SEARCH_INDEX"
index_name = "nate-code-search"

[ai]
binding = "AI"

[vars]
SOVEREIGN_API = "https://api.sovereignsanctuary.net"
