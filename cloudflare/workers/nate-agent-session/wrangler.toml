name = "nate-agent-session"
main = "worker.js"
compatibility_date = "2026-03-01"

[durable_objects]
bindings = [
  { name = "AGENT_SESSION", class_name = "SovereignAgentSession" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SovereignAgentSession"]

[[r2_buckets]]
binding = "PLAN_STORE"
bucket_name = "nate-vault"

[[kv_namespaces]]
binding = "AUTH_CACHE"
id = "9e7c13aca09d489faa5ce30b87333aaa"

[[analytics_engine_datasets]]
binding = "ANALYTICS_AE"
dataset = "sovereign_events_ae"

[vars]
SOVEREIGN_API = "https://api.sovereignsanctuary.net"
