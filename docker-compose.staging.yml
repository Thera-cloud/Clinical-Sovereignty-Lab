# QUANTUM-CRYSTAL-ARCH: Agentic bake — second backend on :8011, little_nate_staging DB.
# NOTE: 8001 is already bound by host nginx on GREEN (unrelated vhost) — do not reuse it.
# Use with prod compose: docker compose -f docker-compose.prod.yml -f docker-compose.staging.yml up -d staging_backend
# Production bridge/API traffic unchanged; flags here affect staging_backend only.

services:
  staging_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nate_staging_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nate_admin}:${POSTGRES_PASSWORD}@postgres:5432/little_nate_staging
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-nate_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=little_nate_staging
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATA_DIR=/app/data
      - BRIDGE_DATA_DIR=/app/bridge_data
      - STAGING_PUBLIC_API_BASE=${STAGING_PUBLIC_API_BASE:-http://127.0.0.1:8011}
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=staging
      # Staging must never publish to live LinkedIn/X (shares OAuth tokens from .env)
      - ENABLE_SKYEYE_SESSIONS=false
      - ENABLE_SKYEYE=false
      - ENABLE_LINKEDIN_COACH_PORTAL_CAMPAIGN=false
      - ENABLE_SKYEYE_LINKEDIN_IMAGES=false
      # Staging shares SendGrid with prod — never email support@ / CEO from bake traffic
      - ENABLE_CEO_INBOX_EXTERNAL_NOTIFY=false
      # Digest / marketing outbound also off on bake (prod owns those)
      - ENABLE_PUBLIC_TRIAL_DIGEST=false
      - DEBUG=false
      - WEB_CONCURRENCY=1
      - NODE_COLOR=green
      - VOICE_EMOTION_FORCE_LIBROSA=${VOICE_EMOTION_FORCE_LIBROSA:-1}
      - ENABLE_CRYSTAL_GRAPH=${STAGING_ENABLE_CRYSTAL_GRAPH:-false}
      - ENABLE_PROACTIVE_TOUCH_POLICY=${STAGING_ENABLE_PROACTIVE_TOUCH_POLICY:-false}
      - ENABLE_PROACTIVE_COMMITMENTS=${STAGING_ENABLE_PROACTIVE_COMMITMENTS:-false}
      - ENABLE_NATE_TOOL_EXECUTOR=${STAGING_ENABLE_NATE_TOOL_EXECUTOR:-false}
      - ENABLE_NATE_SESSION_NEGOTIATION=${STAGING_ENABLE_NATE_SESSION_NEGOTIATION:-false}
      - ENABLE_THERAPEUTIC_PLANS=${STAGING_ENABLE_THERAPEUTIC_PLANS:-false}
      - ENABLE_SELF_MONITOR_AGENT=${STAGING_ENABLE_SELF_MONITOR_AGENT:-false}
      - ENABLE_SELF_MONITOR_COACH_ALERT=${STAGING_ENABLE_SELF_MONITOR_COACH_ALERT:-false}
      - ENABLE_SELF_MONITOR_TOUCH=${STAGING_ENABLE_SELF_MONITOR_TOUCH:-false}
      - ENABLE_SYMBOLIC_EXTRACTION=${STAGING_ENABLE_SYMBOLIC_EXTRACTION:-false}
      - ENABLE_SYMBOLIC_VERIFIER=${STAGING_ENABLE_SYMBOLIC_VERIFIER:-false}
      - ENABLE_FORWARD_REASONING=${STAGING_ENABLE_FORWARD_REASONING:-false}
      - ENABLE_SIX_QUOTIENT_BATTERY=${STAGING_ENABLE_SIX_QUOTIENT_BATTERY:-true}
      - ENABLE_SIX_QUOTIENT_LIVING_BATTERY=${STAGING_ENABLE_SIX_QUOTIENT_LIVING_BATTERY:-true}
      - ENABLE_SIX_QUOTIENT_MULTI_TURN=${STAGING_ENABLE_SIX_QUOTIENT_MULTI_TURN:-true}
      - ENABLE_SIX_QUOTIENT_STANDARDS_INDEX=${STAGING_ENABLE_SIX_QUOTIENT_STANDARDS_INDEX:-true}
      - ENABLE_SIX_QUOTIENT_SCENARIO_GEN=${STAGING_ENABLE_SIX_QUOTIENT_SCENARIO_GEN:-false}
      - SIX_QUOTIENT_BATTERY_ENV=staging
      - SIX_QUOTIENT_BATTERY_LIVE_WS=${STAGING_SIX_QUOTIENT_BATTERY_LIVE_WS:-false}
      - SIX_QUOTIENT_BRIDGE_WS_URL=${STAGING_SIX_QUOTIENT_BRIDGE_WS_URL:-ws://staging_bridge:8765/ws}
      # Live WS battery login (matches LoginAuditor TEST_ACCOUNTS)
      - TEST_USERNAME=${TEST_USERNAME:-audit_client}
      - TEST_PASSWORD=${TEST_PASSWORD:-AuditClient2026!}
      - AUDIT_CLIENT_PASSWORD=${AUDIT_CLIENT_PASSWORD:-AuditClient2026!}
    ports:
      - "127.0.0.1:8011:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/scripts:/app/scripts:ro
      - ./backend/tests:/app/tests:ro
      - ./data/backend_staging:/app/data
      - ./data/bridge_staging:/app/bridge_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 4G
        reservations:
          memory: 512M
    networks:
      - nate_network

  # QUANTUM-CRYSTAL-ARCH — staging bridge for six-quotient battery / chat-path bake
  # Port 8766 host → 8765 container. DB = little_nate_staging (not production).
  staging_bridge:
    build:
      context: ./backend
      dockerfile: Dockerfile.bridge
    container_name: nate_staging_bridge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nate_admin}:${POSTGRES_PASSWORD}@postgres:5432/little_nate_staging
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-nate_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=little_nate_staging
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=staging
      - ENABLE_SIX_QUOTIENT_BATTERY=${STAGING_ENABLE_SIX_QUOTIENT_BATTERY:-true}
      - ENABLE_SIX_QUOTIENT_LIVING_BATTERY=${STAGING_ENABLE_SIX_QUOTIENT_LIVING_BATTERY:-true}
      - ENABLE_SIX_QUOTIENT_MULTI_TURN=${STAGING_ENABLE_SIX_QUOTIENT_MULTI_TURN:-true}
      - ENABLE_SIX_QUOTIENT_STANDARDS_INDEX=${STAGING_ENABLE_SIX_QUOTIENT_STANDARDS_INDEX:-true}
      - ENABLE_SIX_QUOTIENT_SCENARIO_GEN=${STAGING_ENABLE_SIX_QUOTIENT_SCENARIO_GEN:-false}
      - ENABLE_ASK_NATE_SYMBOLIC=${STAGING_ENABLE_ASK_NATE_SYMBOLIC:-false}
      - ENABLE_FORWARD_REASONING=${STAGING_ENABLE_FORWARD_REASONING:-false}
      # QUANTUM-CRYSTAL-ARCH — Track A/B soak flags (staging only; prod stays false)
      - ENABLE_PROACTIVE_TOUCH_POLICY=${STAGING_ENABLE_PROACTIVE_TOUCH_POLICY:-false}
      - ENABLE_PROACTIVE_COMMITMENTS=${STAGING_ENABLE_PROACTIVE_COMMITMENTS:-false}
      - ENABLE_NATE_TOOL_EXECUTOR=${STAGING_ENABLE_NATE_TOOL_EXECUTOR:-false}
      - ENABLE_THERAPEUTIC_PLANS=${STAGING_ENABLE_THERAPEUTIC_PLANS:-false}
      - ENABLE_SELF_MONITOR_AGENT=${STAGING_ENABLE_SELF_MONITOR_AGENT:-false}
      - ENABLE_SELF_MONITOR_COACH_ALERT=${STAGING_ENABLE_SELF_MONITOR_COACH_ALERT:-false}
      - ENABLE_SELF_MONITOR_TOUCH=${STAGING_ENABLE_SELF_MONITOR_TOUCH:-false}
      - ENABLE_NATE_SESSION_NEGOTIATION=${STAGING_ENABLE_NATE_SESSION_NEGOTIATION:-false}
      # QUANTUM-CRYSTAL-ARCH — Track C Phase 5a (staging only; verifier stays false)
      - ENABLE_SYMBOLIC_EXTRACTION=${STAGING_ENABLE_SYMBOLIC_EXTRACTION:-false}
      - ENABLE_SYMBOLIC_VERIFIER=${STAGING_ENABLE_SYMBOLIC_VERIFIER:-false}
      - CLI_TASK_BUS_ENABLED=false
      - PUBLIC_TRIAL_ENABLED=false
    # Host 8766 is owned by nginx lb-health-monitors → prod bridge; use 8767 for staging.
    ports:
      - "127.0.0.1:8767:8765"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro
      - ./data/bridge_staging:/app/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          memory: 256M
    networks:
      - nate_network
