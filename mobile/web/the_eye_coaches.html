<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Command | The Eye - Coach Performance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #0A0A0A; --bg-card: #111111; --bg-elevated: #1A1A1A;
            --gold: #FFD700; --gold-dim: rgba(255, 215, 0, 0.2);
            --red-critical: #FF3B3B; --red-dim: rgba(255, 59, 59, 0.15);
            --cyan: #00D4FF; --cyan-dim: rgba(0, 212, 255, 0.1);
            --green: #00FF88; --green-dim: rgba(0, 255, 136, 0.1);
            --orange: #FF9500; --purple: #9D4EDD; --purple-dim: rgba(157, 78, 221, 0.15);
            --text-primary: #FFFFFF; --text-secondary: #888888; --border: #252525;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; }
        
        .header { background: linear-gradient(180deg, #1A1A10 0%, #0A0A0A 100%); border-bottom: 1px solid var(--gold-dim); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--gold), #FF8C00); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .logo-text { font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: 2px; }
        .page-title { font-size: 14px; color: var(--text-secondary); }
        
        .btn { padding: 10px 20px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; display: inline-block; }
        .btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
        
        .sub-nav { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; gap: 24px; }
        .sub-nav-item { padding: 14px 0; font-size: 12px; color: var(--text-secondary); border-bottom: 2px solid transparent; cursor: pointer; }
        .sub-nav-item.active { color: var(--gold); border-bottom-color: var(--gold); }
        
        .main-content { padding: 24px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .card-body { padding: 20px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { padding: 20px; background: var(--bg-elevated); border-radius: 12px; text-align: center; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--gold); }
        .stat-label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; margin-top: 8px; }
        
        .coach-grid { display: grid; gap: 16px; }
        .coach-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .coach-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .coach-name { font-size: 16px; font-weight: 600; }
        .coach-email { font-size: 11px; color: var(--text-secondary); }
        .coach-status { padding: 4px 12px; border-radius: 12px; font-size: 10px; font-weight: 600; }
        .status-active { background: var(--green-dim); color: var(--green); }
        .status-inactive { background: var(--red-dim); color: var(--red-critical); }
        
        .coach-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 16px; }
        .metric { text-align: center; }
        .metric-value { font-size: 20px; font-weight: 600; color: var(--gold); }
        .metric-label { font-size: 10px; color: var(--text-secondary); margin-top: 4px; }
        
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">👁️</div>
            <div>
                <div class="logo-text">THE EYE</div>
                <div class="page-title">Coach Performance Analytics</div>
            </
        </div>
        <a href="the_eye.html" class="btn btn-secondary">← Back to The Eye</a>
    </header>

    <nav class="sub-nav">
        <div class="sub-nav-item" onclick="window.location.href='the_eye.html'" style="cursor: pointer;">Overview</div>
        <div class="sub-nav-item active">Coaches</div>
        <div class="sub-nav-item" onclick="window.location.href='the_eye_tokens.html'">Tokens</div>
        <div class="sub-nav-item" onclick="window.location.href='the_eye_monitor.html'">Live Monitor</div>
        <div class="sub-nav-item" onclick="window.location.href='the_eye_crisis.html'">Crisis</div>
        <div class="sub-nav-item" onclick="window.location.href='the_eye_community.html'">Community</div>
    </nav>

    <main class="main-content">
        <div id="stats" class="stats-grid"></div>
        <div class="card">
            <div class="card-header">
                <div class="card-title">👨‍⚕️ Active Coaches</div>
            </div>
            <div class="card-body">
                <div id="coachesoach-grid">
                    <div class="loading">Connecting to server...</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Check auth
        if (!sessionStorage.getItem("username")) {
            window.location.href = "index.html";
        }

        const username = sessionStorage.getItem("username");
        const password = sessionStorage.getItem("password") || "admin123"; // Default for testing
        const profile = JSON.parse(sessionStorage.getItem("profile") || "{}");
        
        if (profile.role !== "ADMIN") {
            alert("Admin access required");
            window.location.href = "command.html";
        }

        const ws = new WebSocket("wss://api.sovereignsanctuary.net/ws");
        let authenticated = false;

        ws.onopen = function() {
            console.log("WebSocket opened, authenticating...");
            // Authenticate first!
            ws.send(JSON.stringify({
                type: "login_request",
                username: username,
                password: password,
                expected_role: "ADMIN",
                hardware_id: profile.hardware_id || "WEB_ADMIN"
            }));
        };

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            console.log("Received:", data);
            
            if (data.type === "login_success" || data.type === "auth_success") {
                console.log("✅ Authenticated!");
                authenticated = true;
                // Now request data
                ws.send(JSON.stringify({type: "admin_get_stats"}));
            }
            
            if (data.type === "admin_stats") {
                displayStats(data.stats);
                ws.send(JSON.stringify({type: "admin_get_users"}));
            }
            
            if (data.type === "admin_users") {
                const coaches = data.users.filter(u => u.role === "COACH");
                displayCoaches(coaches);
            }
        };

        function displayats(stats) {
            document.getElementById("stats").innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${stats.total_coaches || 0}</div>
                    <div class="stat-label">Total Coaches</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.coaches_active_today || 0}</div>
                    <div class="stat-label">Active Today</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.total_clients || 0}</div>
                    <div class="stat-label">Total Clients</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.sessions_today || 0}</div>
                    <div class="stat-label">Sessions Today</div>
                </div>
            `;
        }

        function displayCoaches(coaches) {
            if (coaches.length === 0) {
                document.getElementById("coaches").innerHTML = '<div class="loading">No coaches found in system</div>';
                return;
            }

            document.getElementById("coaches").innerHTML = coaches.map(coach => `
                <div class="coach-card">
                    <div class="coach-header">
                        <div>
                            <div class="coach-name">${coach.name || 'Unnamed Coach'}</div>
                            <div class="coach-email">${coach.email || 'No email'}</div>
                        </div>
                        <span class="coach-status ${coach.subscription_status === 'active' ? 'status-active' : 'status-inactive'}">
                            ${coach.subscription_status || 'inactive'}
                        </span>
                    </div>
                    <div class="coach-metrics">
                        <div class="metric">
                            <div class="metric-value">${coach.client_count || 0}</div>
                            <div class="metric-label">Clients</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">${coach.total_sessions || 0}</div>
                            <div class="metric-label">Sessions</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">${coach.tier || 'STANDARD'}</div>
                            <div class="metric-label">Tier</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">${coach.joined_date ? new Date(coach.joined_date).toLocaleDateString() : 'N/A'}</div>
                            <div class="metric-label">Joined</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
