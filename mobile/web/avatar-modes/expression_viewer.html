<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Little Nate — Expression Viewer</title>
<meta http-equiv="Content-Security-Policy"
      content="connect-src 'self'; script-src 'self' 'unsafe-inline';" />
<style>
  html,body{margin:0;height:100%;background:#050505;overflow:hidden;
            font-family:'DM Sans',system-ui,sans-serif}
  #c{width:100%;height:100%;display:block}
  #panel{display:none;position:fixed;right:10px;top:10px;background:#111c;border:1px solid #C9A96233;
         border-radius:10px;padding:10px 14px;color:#C9A962;font-size:12px;
         backdrop-filter:blur(6px);max-width:240px;max-height:90vh;overflow:auto;z-index:2}
  #panel .hide{position:absolute;top:4px;right:8px;cursor:pointer;color:#888}
  #panel .btns{display:flex;flex-wrap:wrap;gap:2px;margin-top:8px}
  #status{position:fixed;left:10px;bottom:10px;color:#C9A96266;font-size:11px;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel"><span class="hide" onclick="panel.style.display='none'">×</span>
  <b>v1.3 meshes</b>
  <div class="btns" id="exprBtns"></div>
</div>
<div id="status">loading…</div>

<script type="importmap">
{"imports":{
  "three":"./vendor/three.module.js",
  "three/addons/":"./vendor/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/** Original Blender Little Nate (Feb 2026). Not the Jul 29 trimesh / morph bakes. */
const EXPR_FILE = {
  neutral:     'mininate_neutral.glb',
  attentive:   'mininate_neutral.glb',
  thoughtful:  'mininate_neutral.glb',
  sad:         'mininate_sad.glb',
  frustrated:  'mininate_sad.glb',
  proud:       'mininate_sad.glb',
  warm:        'mininate_empathetic.glb',
  empathetic:  'mininate_empathetic.glb',
  calming:     'mininate_empathetic.glb',
  validating:  'mininate_empathetic.glb',
  curious:     'mininate_empathetic.glb',
  encouraging: 'mininate_empathetic.glb',
};
const THERAPY_KEYS = Object.keys(EXPR_FILE);
const DEBUG = new URLSearchParams(location.search).has('debug');
const status = document.getElementById('status');
const panel = document.getElementById('panel');
if (DEBUG) panel.style.display = 'block';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x050505);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.05));
const key = new THREE.DirectionalLight(0xfff2dd, 1.55); key.position.set(1.4, 2.2, 2.4);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aacc, 0.35); fill.position.set(-2, 1, -1);
scene.add(fill);

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const loader = new GLTFLoader();
const cache = {};
let root = null;
let framed = false;
let current = null;
let voiceState = 'idle';
let readySent = false;

function frameObject(obj){
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  obj.position.sub(center);
  const faceY = size.y * 0.18;
  const dist = Math.max(size.x, size.y, size.z) / (2 * Math.tan(camera.fov * Math.PI / 360));
  camera.position.set(0, faceY, dist * 1.05);
  camera.lookAt(0, faceY * 0.35, 0);
}

const canon = n => String(n).toLowerCase().replace(/^(mininate|test)[\s_]*/, '').trim();

function fileFor(name){
  name = canon(name);
  return EXPR_FILE[name] || EXPR_FILE.neutral;
}

function showScene(gltf){
  if (root) scene.remove(root);
  root = gltf.scene;
  scene.add(root);
  if (!framed){
    frameObject(root);
    framed = true;
  } else {
    const box = new THREE.Box3().setFromObject(root);
    const center = box.getCenter(new THREE.Vector3());
    root.position.sub(center);
  }
}

function loadFile(file, done){
  if (cache[file]){ done(cache[file]); return; }
  loader.load('./' + file, (gltf)=>{
    cache[file] = gltf;
    done(gltf);
  }, undefined, (err)=>{
    status.textContent = 'LOAD ERROR: ' + err;
    parent.postMessage({type:'spline_error', message:String(err)}, '*');
  });
}

function setExpression(name){
  name = canon(name);
  if (!(name in EXPR_FILE)) name = 'neutral';
  const file = fileFor(name);
  if (name === current && cache[file]) return;
  current = name;
  loadFile(file, (gltf)=>{
    showScene(gltf);
    if (!readySent){
      readySent = true;
      status.textContent = DEBUG ? ('ready — ' + file) : '';
      parent.postMessage({type:'spline_ready', expressions: THERAPY_KEYS, morphs: []}, '*');
      if (DEBUG) buildDebugUi();
    }
  });
}

function setVoiceState(state){
  voiceState = String(state || 'idle').toLowerCase();
}

function tick(){
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

['mininate_empathetic.glb', 'mininate_sad.glb'].forEach(f => loadFile(f, ()=>{}));
setExpression('neutral');

addEventListener('message', (e)=>{
  const d = e.data || {};
  if (d.type === 'setExpression' && typeof d.expression === 'string')
    setExpression(d.expression);
  if (d.type === 'setVoiceState' && typeof d.state === 'string')
    setVoiceState(d.state);
});

function buildDebugUi(){
  const exprBtns = document.getElementById('exprBtns');
  exprBtns.innerHTML = '';
  THERAPY_KEYS.forEach(n=>{
    const b = document.createElement('button');
    b.textContent = n;
    b.style.cssText =
      'margin:2px;background:#222;color:#C9A962;border:1px solid #C9A96244;'+
      'border-radius:6px;padding:2px 8px;cursor:pointer;font-size:11px';
    b.onclick = ()=> setExpression(n);
    exprBtns.appendChild(b);
  });
}
</script>
</body>
</html>
