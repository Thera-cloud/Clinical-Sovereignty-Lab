<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Little Nate — Studio Portrait</title>
<meta http-equiv="Content-Security-Policy"
      content="connect-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self'" />
<style>
  html,body{margin:0;height:100%;background:#0A0A0A;overflow:hidden}
  #stage{position:absolute;inset:0}
  #stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
             object-position:center 22%;opacity:0;transition:opacity .18s linear}
  #stage img.on{opacity:1}
  #status{position:fixed;left:10px;bottom:8px;color:#C9A96266;font-size:11px;
          font-family:DM Sans,system-ui,sans-serif;z-index:2}
</style>
</head>
<body>
<div id="stage"></div>
<div id="status">loading…</div>
<script>
(function(){
  var PLATES = {
    neutral:     'plates/exp_01_neutral.png',
    attentive:   'plates/exp_01_neutral.png',
    thoughtful:  'plates/exp_02_blink.png',
    sad:         'plates/exp_02_blink.png',
    frustrated:  'plates/exp_06_brow_up.png',
    proud:       'plates/exp_05_smile_right.png',
    warm:        'plates/exp_05_smile_right.png',
    empathetic:  'plates/exp_04_smile_left.png',
    calming:     'plates/exp_04_smile_left.png',
    validating:  'plates/exp_05_smile_right.png',
    curious:     'plates/exp_06_brow_up.png',
    encouraging: 'plates/exp_05_smile_right.png'
  };
  var VOICE = {
    speaking:  'plates/exp_03_jawopen.png',
    listening: 'plates/exp_06_brow_up.png',
    idle:      null
  };
  var KEYS = Object.keys(PLATES);
  var stage = document.getElementById('stage');
  var status = document.getElementById('status');
  var imgs = {};
  var current = 'neutral';
  var voiceState = 'idle';
  var shown = null;
  var blinkTimer = null;

  function plateFor(){
    if (voiceState === 'speaking') return VOICE.speaking;
    if (voiceState === 'listening') return VOICE.listening;
    return PLATES[current] || PLATES.neutral;
  }

  function show(src){
    if (!src || shown === src) return;
    var next = imgs[src];
    if (!next) return;
    Object.keys(imgs).forEach(function(k){ imgs[k].classList.toggle('on', k === src); });
    shown = src;
  }

  function apply(){ show(plateFor()); }

  function setExpression(name){
    name = String(name || 'neutral').toLowerCase();
    if (!(name in PLATES)) name = 'neutral';
    current = name;
    apply();
  }

  function setVoiceState(state){
    voiceState = String(state || 'idle').toLowerCase();
    apply();
    armBlink();
  }

  function armBlink(){
    if (blinkTimer) clearTimeout(blinkTimer);
    if (voiceState !== 'idle') return;
    blinkTimer = setTimeout(function(){
      if (voiceState !== 'idle') return;
      show('plates/exp_02_blink.png');
      setTimeout(function(){ if (voiceState === 'idle') apply(); armBlink(); }, 160);
    }, 4200 + Math.floor(Math.random() * 2200));
  }

  var files = ['plates/exp_01_neutral.png','plates/exp_02_blink.png','plates/exp_03_jawopen.png',
               'plates/exp_04_smile_left.png','plates/exp_05_smile_right.png','plates/exp_06_brow_up.png'];
  var left = files.length;
  files.forEach(function(src){
    var img = document.createElement('img');
    img.alt = 'Little Nate';
    img.src = src;
    img.onload = function(){
      left -= 1;
      if (!left){
        status.textContent = '';
        apply();
        armBlink();
        parent.postMessage({type:'spline_ready', expressions: KEYS, morphs: []}, '*');
      }
    };
    img.onerror = function(){
      status.textContent = 'LOAD ERROR: ' + src;
      parent.postMessage({type:'spline_error', message: src}, '*');
    };
    stage.appendChild(img);
    imgs[src] = img;
  });

  addEventListener('message', function(e){
    var d = e.data || {};
    if (d.type === 'setExpression' && typeof d.expression === 'string') setExpression(d.expression);
    if (d.type === 'setVoiceState' && typeof d.state === 'string') setVoiceState(d.state);
  });
})();
</script>
</body>
</html>
