<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Little Nate — Studio Portrait</title>
<meta http-equiv="Content-Security-Policy"
      content="connect-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self'" />
<style>
  html,body{margin:0;height:100%;background:#0A0A0A;overflow:hidden}
  #stage{position:absolute;inset:0}
  #stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
             object-position:center 22%;opacity:0;transition:opacity .22s ease}
  #stage img.on{opacity:1}
  #stage img.jaw{z-index:2;opacity:0;transition:opacity .04s linear;pointer-events:none}
  #status{position:fixed;left:10px;bottom:8px;color:#C9A96266;font:11px DM Sans,system-ui,sans-serif;z-index:3}
</style>
</head>
<body>
<div id="stage"></div>
<div id="status">loading…</div>
<script>
(function(){
  var PLATES = {
    neutral:     'plates/exp_01_neutral.png',
    attentive:   'plates/exp_01_neutral.png',
    thoughtful:  'plates/exp_02_blink.png',
    sad:         'plates/exp_02_blink.png',
    frustrated:  'plates/exp_06_brow_up.png',
    proud:       'plates/exp_05_smile_right.png',
    warm:        'plates/exp_05_smile_right.png',
    empathetic:  'plates/exp_04_smile_left.png',
    calming:     'plates/exp_04_smile_left.png',
    validating:  'plates/exp_05_smile_right.png',
    curious:     'plates/exp_06_brow_up.png',
    encouraging: 'plates/exp_05_smile_right.png'
  };
  var JAW = 'plates/exp_03_jaw_mouth.png';
  var LISTEN = 'plates/exp_06_brow_up.png';
  var KEYS = Object.keys(PLATES);
  var stage = document.getElementById('stage');
  var status = document.getElementById('status');
  var imgs = {};
  var current = 'neutral';
  var voiceState = 'idle';
  var shown = null;
  var blinkTimer = null;
  var talkRaf = null;
  var talkT0 = 0;

  function restPlate(){
    if (voiceState === 'speaking') return PLATES.neutral;
    if (voiceState === 'listening') return LISTEN;
    return PLATES[current] || PLATES.neutral;
  }

  function show(src){
    if (!src) return;
    Object.keys(imgs).forEach(function(k){
      if (k === JAW) return;
      imgs[k].classList.toggle('on', k === src);
    });
    shown = src;
  }

  function apply(){ show(restPlate()); }

  function setJawMix(amt){
    var jaw = imgs[JAW];
    if (!jaw) return;
    jaw.style.opacity = String(Math.max(0, Math.min(1, amt)));
  }

  function stopTalk(){
    if (talkRaf) { cancelAnimationFrame(talkRaf); talkRaf = null; }
    setJawMix(0);
  }

  function armTalk(){
    stopTalk();
    if (voiceState !== 'speaking') return;
    talkT0 = performance.now();
    var phase = 0;
    var last = talkT0;
    var shutUntil = 0;
    function tick(now){
      if (voiceState !== 'speaking') { setJawMix(0); return; }
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (now < shutUntil) { setJawMix(0); talkRaf = requestAnimationFrame(tick); return; }
      var t = (now - talkT0) / 1000;
      var hz = 2.2 + 0.35 * Math.sin(t * 0.9);
      phase += hz * dt;
      if (phase >= 1) {
        phase -= 1;
        if (Math.random() < 0.18) shutUntil = now + 90 + Math.random() * 220;
      }
      setJawMix(phase < 0.42 ? 1 : 0);
      talkRaf = requestAnimationFrame(tick);
    }
    talkRaf = requestAnimationFrame(tick);
  }

  function setExpression(name){
    name = String(name || 'neutral').toLowerCase();
    if (!(name in PLATES)) name = 'neutral';
    current = name;
    apply();
  }

  function setVoiceState(state){
    voiceState = String(state || 'idle').toLowerCase();
    if (voiceState === 'speaking') {
      if (blinkTimer) clearTimeout(blinkTimer);
      apply();
      armTalk();
      return;
    }
    stopTalk();
    apply();
    armBlink();
  }

  function armBlink(){
    if (blinkTimer) clearTimeout(blinkTimer);
    if (voiceState !== 'idle') return;
    blinkTimer = setTimeout(function(){
      if (voiceState !== 'idle') return;
      show('plates/exp_02_blink.png');
      setTimeout(function(){ if (voiceState === 'idle') apply(); armBlink(); }, 160);
    }, 4200 + Math.floor(Math.random() * 2200));
  }

  var files = ['plates/exp_01_neutral.png','plates/exp_02_blink.png','plates/exp_03_jaw_mouth.png',
               'plates/exp_04_smile_left.png','plates/exp_05_smile_right.png','plates/exp_06_brow_up.png'];
  var left = files.length;
  files.forEach(function(src){
    var img = document.createElement('img');
    img.alt = 'Little Nate';
    img.src = src;
    if (src === JAW) img.className = 'jaw';
    img.onload = function(){
      left -= 1;
      if (!left){
        status.textContent = '';
        apply();
        armBlink();
        parent.postMessage({type:'spline_ready', expressions: KEYS, morphs: []}, '*');
      }
    };
    img.onerror = function(){
      status.textContent = 'LOAD ERROR: ' + src;
      parent.postMessage({type:'spline_error', message: src}, '*');
    };
    stage.appendChild(img);
    imgs[src] = img;
  });

  addEventListener('message', function(e){
    var d = e.data || {};
    if (d.type === 'setExpression' && typeof d.expression === 'string') setExpression(d.expression);
    if (d.type === 'setVoiceState' && typeof d.state === 'string') setVoiceState(d.state);
  });
})();
</script>
</body>
</html>
