<!DOCTYPE html>
<html>
<head><title>Simple Test</title></head>
<body style="background: #0a0a0a; color: #00ff88; font-family: monospace; padding: 40px;">
    <h1>Simple Test Page</h1>
    <button onclick="alert('Button works!'); testIt();" style="padding: 20px; font-size: 18px; cursor: pointer;">
        Click Me
    </button>
    <div id="output"></div>
    
    <script>
    function testIt() {
        document.getElementById('output').innerHTML = '<p>JavaScript is working!</p>';
        
        // Set session
        sessionStorage.setItem('username', 'admin1');
        sessionStorage.setItem('password', 'admin123');
        sessionStorage.setItem('profile', JSON.stringify({role: 'ADMIN', name: 'Admin User', hardware_id: 'ADMIN_001'}));
        
        document.getElementById('output').innerHTML += '<p>Session set! Going to The Eye in 2 seconds...</p>';
        
        setTimeout(function() {
            window.location.href = 'the_eye.html';
        }, 2000);
    }
    </script>
</body>
</html>
