<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Command | The Eye - Token Analytics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #0A0A0A; --bg-card: #111111; --bg-elevated: #1A1A1A;
            --gold: #FFD700; --gold-dim: rgba(255, 215, 0, 0.2);
            --red-critical: #FF3B3B; --red-dim: rgba(255, 59, 59, 0.15);
            --cyan: #00D4FF; --cyan-dim: rgba(0, 212, 255, 0.1);
            --green: #00FF88; --green-dim: rgba(0, 255, 136, 0.1);
            --orange: #FF9500; --purple: #9D4EDD;
            --text-primary: #FFFFFF; --text-secondary: #888888; --border: #252525;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; }
        
        .header { background: linear-gradient(180deg, #1A1A10 0%, #0A0A0A 100%); border-bottom: 1px solid var(--gold-dim); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--gold), #FF8C00); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .logo-text { font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: 2px; }
        .page-title { font-size: 14px; color: var(--text-secondary); }
        
        .btn { padding: 10px 20px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; display: inline-block; }
        .btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
        
        .sub-nav { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; gap: 24px; }
        .sub-nav-item { padding: 14px 0; font-size: 12px; color: var(--text-secondary); border-bottom: 2px solid transparent; cursor: pointer; }
        .sub-nav-item.active { color: var(--gold); border-bottom-color: var(--gold); }
        
        .main-content { padding: 24px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .card-title { font-size: 14px; font-weight: 600; }
        .card-body { padding: 20px; }
        
        .token-overview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .token-stat { padding: 24px; background: var(--bg-elevated); border-radius: 12px; text-align: center; border: 1px solid var(--border); }
        .token-value { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
        .token-value.green { color: var(--green); }
        .token-value.orange { color: var(--orange); }
        .token-value.red { color: var(--red-critical); }
        .token-value.cyan { color: var(--cyan); }
        .token-label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; }
        
        .budget-section { margin-bottom: 20px; }
        .budget-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .budget-bar { height: 32px; background: var(--bg-dark); border-radius: 16px; overflow: hidden; position: relative; }
        .budget-fill { height: 100%; display: flex; align-items: center; justify-content: flex-end; padding-right: 16px; font-size: 12px; font-weight: 600; transition: width 0.5s; }
        .budget-fill.safe { background: linear-gradient(90deg, var(--green), #00CC6A); }
        .budget-fill.warning { background: linear-gradient(90deg, var(--gold), var(--orange)); }
        .budget-fill.danger { background: linear-gradient(90deg, var(--orange), var(--red-critical)); }
        
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">👁️</div>
            <div>
                <div class="logo-text">THE EYE</div>
                <div class="page-title">Token Usage & Spending</div>
            </div>
        </div>
        <a href="the_eye.html" class="btn btn-secondary">← Back to The Eye</a>
    </header>

    <nav class="sub-nav">
        <div class="sub-nav-item" onclick="window.location.href='the_eye.html'" style="cursor: pointer;">Overview</div>
        <div class="sub-nav-item" onclick="window.location.href='the_eye_coaches.html'">Coaches</div>
        <div class="sub-nav-item active">Tokens</div>
        <div class="sub-nav-item" onclick="window.location.href='the_eye_monitor.html'">Live Monitor</div>
        <div class="sub-nav-item" onclick="window.location.href='the_eyes.html'">Crisis</div>
        <div class="sub-nav-item" onclick="window.location.href='the_eye_community.html'">Community</div>
    </nav>

    <main class="main-content">
        <div id="token-overview" class="token-overview">
            <div class="loading">Loading token data...</div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">💰 Monthly Budget</div>
            </div>
            <div class="card-body">
                <div id="budget-display"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">📊 Platform Token Usage</div>
            </div>
            <div class="card-body">
                <div id="platform-usage"></div>
            </div>
        </div>
    </main>

    <script>
        if (!sessionStorage.getItem("username")) {
            window.location.href = "index.html";
        }

        const profile = JSON.parse(sessionStorage.getItem("profile") || "{}");
        if (profile.role !== "ADMIN") {
            alert("Admin access required");
            window.location.href = "command.html";
        }

        // Allow override via ?ws=ws(s)://... to match other pages.
        const params = new URLSearchParams(window.location.search);
        const wsUrl = params.get("ws") || "wss://api.sovereignsanctuary.net/ws";
        const ws = new WebSocket(wsUrl);

        ws.onopen = function() {
            console.log("Connected to bridge server");
            ws.send(JSON.stringify({type: "admin_get_stats"}));
        };

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            console.log("Received:", data);
            
            if (data.type === "admin_stats") {
                displayTokenOverview(data.stats);
                displayBudget(data.stats);
                displayPlatformUsage(data.stats);
            }
        };

        function displayTokenOverview(stats) {
            const tokensUsedToday = stats.tokens_used_today || 0;
            const tokensUsedMonth = stats.tokens_used_month || 0;
            const totalRevenue = stats.total_revenue || 0;
            const avgTokensPerSession = Math.round((stats.total_tokens_used || 0) / (stats.total_sessions || 1));

            document.getElementById("token-overview").innerHTML = `
                <div class="token-stat">
                    <div class="token-value cyan">${tokensUsedToday.toLocaleString()}</div>
                    <div class="token-label">Tokens Today</div>
                </div>
                <div class="token-stat">
                    <div class="token-value orange">${tokensUsedMonth.toLocaleString()}</div>
                    <div class="token-label">Tokens This Month</div>
                </div>
                <div class="token-stat">
                    <div class="token-value green">$${totalRevenue.toLocaleString()}</div>
                    <div class="token-label">Total Revenue</div>
                </div>
                <div class="token-stat">
                    <div class="token-value">${avgTokensPerSession}</div>
                    <div class="token-label">Avg Tokens/Session</div>
                </div>
            `;
        }

        function displayBudget(stats) {
            const budget = 500000;
            const used = stats.tokens_used_month || 0;
            const percent = Math.min((used / budget) * 100, 100);
            const status = percent < 70 ? 'safe' : percent < 90 ? 'warning' : 'danger';

            document.getElementById("budget-display").innerHTML = `
                <div class="budget-section">
                    <div class="budget-header">
                        <span style="font-size: 13px; font-weight: 600;">Monthly Token Budget</span>
                        <span style="font-size: 13px;">${used.toLocaleString()} / ${budget.toLocaleString()}</span>
                    </div>
                    <div class="budget-bar">
                        <div class="budget-fill ${status}" style="width: ${percent}%">${percent.toFixed(1)}%</div>
                    </div>
                </div>
            `;
        }

        function displayPlatformUsage(stats) {
            document.getElementById("platform-usage").innerHTML = `
                <div style="font-size: 13px; color: var(--text-secondary);">
                    Total platform token consumption: ${(stats.total_tokens_used || 0).toLocaleString()} tokens
                </div>
            `;
        }
    </script>
</body>
</html>
