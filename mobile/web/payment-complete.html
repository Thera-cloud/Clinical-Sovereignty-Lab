<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Complete — Sovereign Sanctuary</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; color: #E8D5A3; font-family: 'DM Sans', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
  .card { max-width: 420px; padding: 48px 32px; }
  .icon { font-size: 64px; margin-bottom: 24px; color: #4ADE80; }
  h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 28px; color: #C9A962; margin-bottom: 12px; }
  p { font-size: 16px; color: #888; line-height: 1.5; margin-bottom: 16px; }
  .subtle { font-size: 13px; color: #555; margin-bottom: 24px; }
  a.btn { display: inline-block; padding: 12px 22px; background: #C9A962; color: #050505;
    text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#10003;</div>
  <h1 id="title">Card Saved</h1>
  <p id="lead">Your payment method was saved. Return to Schedule to book your session.</p>
  <p class="subtle" id="hint">If booking still asks for a card, tap <strong>Refresh</strong> on the payment banner.</p>
  <a class="btn" id="continue" href="https://app.sovereignsanctuary.net/?card_setup=complete">Continue to app</a>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search || '');
  var isSignup = !!(params.get('session_id'));
  var host = (location.hostname || '').toLowerCase();
  var dest;
  var delay = 1600;
  if (isSignup) {
    dest = 'https://app.sovereignsanctuary.net/?registration=success';
    if (host.indexOf('coach.') === 0) {
      dest = 'https://coach.sovereignsanctuary.net/?registration=success';
    }
    document.title = 'Account Ready — Sovereign Sanctuary';
    var t = document.getElementById('title');
    var lead = document.getElementById('lead');
    var hint = document.getElementById('hint');
    var btn = document.getElementById('continue');
    if (t) t.textContent = "You're in";
    if (lead) lead.textContent = 'Payment received. Sign in with the username you just created to finish onboarding and book.';
    if (hint) hint.textContent = 'If login says the account is not ready, wait 15 seconds and try again — the payment is still being recorded.';
    if (btn) { btn.textContent = 'Sign in'; btn.href = dest; }
    delay = 4000;
  } else {
    dest = 'https://app.sovereignsanctuary.net/?card_setup=complete';
    if (host.indexOf('coach.') === 0) {
      dest = 'https://coach.sovereignsanctuary.net/?card_setup=complete';
    }
    var link = document.getElementById('continue');
    if (link) link.href = dest;
  }
  setTimeout(function () { location.replace(dest); }, delay);
})();
</script>
</body>
</html>
