<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisdom Editor | Night School</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #0A0A0A; --bg-card: #111111; --bg-elevated: #1A1A1A;
            --gold: #FFD700; --gold-dim: rgba(255, 215, 0, 0.2);
            --red: #FF3B3B; --red-dim: rgba(255, 59, 59, 0.15);
            --cyan: #00D4FF; --cyan-dim: rgba(0, 212, 255, 0.1);
            --green: #00FF88; --green-dim: rgba(0, 255, 136, 0.1);
            --orange: #FF9500; --purple: #9D4EDD; --purple-dim: rgba(157, 78, 221, 0.15);
            --text-primary: #FFFFFF; --text-secondary: #888888; --border: #252525;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header */
        .header { background: linear-gradient(180deg, #1A1A10 0%, #0A0A0A 100%); border-bottom: 1px solid var(--gold-dim); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--gold), #FF8C00); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .logo-text { font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: 2px; }
        .page-title { font-size: 13px; color: var(--text-secondary); }
        
        /* Buttons */
        .btn { padding: 10px 16px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
        .btn-primary { background: var(--green); color: black; }
        .btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid rgba(255,59,59,0.3); }
        
        /* Toolbar */
        .toolbar { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .toolbar-group { display: flex; gap: 6px; padding-right: 16px; border-right: 1px solid var(--border); margin-right: 16px; }
        .toolbar-group:last-child { border-right: none; margin-right: 0; padding-right: 0; }
        .tool-btn { padding: 8px 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px; font-size: 11px; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .tool-btn:hover { border-color: var(--purple); color: var(--purple); }
        .tool-btn.active { background: var(--purple-dim); border-color: var(--purple); color: var(--purple); }
        .search-box { padding: 8px 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-size: 12px; width: 220px; }
        .search-box:focus { outline: none; border-color: var(--cyan); }
        
        /* Main Layout */
        .main-layout { flex: 1; display: grid; grid-template-columns: 260px 1fr; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { background: var(--bg-card); border-right: 1px solid var(--border); overflow-y: auto; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
        .sidebar-title { font-size: 12px; font-weight: 600; margin-bottom: 8px; }
        .sidebar-stats { font-size: 11px; color: var(--text-secondary); }
        .category-list { padding: 8px 0; }
        .category-item { padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid transparent; font-size: 12px; transition: all 0.2s; }
        .category-item:hover { background: var(--bg-elevated); }
        .category-item.active { background: var(--purple-dim); border-left-color: var(--purple); }
        .category-name { display: flex; align-items: center; gap: 8px; }
        .category-count { font-size: 10px; background: var(--bg-dark); padding: 2px 8px; border-radius: 10px; color: var(--text-secondary); }
        
        /* Editor Section */
        .editor-section { display: flex; flex-direction: column; overflow: hidden; }
        .editor-header { padding: 12px 20px; background: var(--bg-elevated); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .editor-title { font-size: 14px; font-weight: 600; }
        .editor-info { font-size: 11px; color: var(--text-secondary); }
        .editor-container { flex: 1; overflow: auto; padding: 20px; }
        
        /* Entry Cards */
        .entries-grid { display: flex; flex-direction: column; gap: 12px; }
        .entry-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: all 0.2s; }
        .entry-card:hover { border-color: var(--purple); }
        .entry-card.selected { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0,212,255,0.2); }
        .entry-header { padding: 12px 16px; background: var(--bg-elevated); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .entry-header:hover { background: var(--bg-dark); }
        .entry-left { display: flex; align-items: center; gap: 12px; }
        .entry-id { font-size: 10px; color: var(--text-secondary); font-family: monospace; background: var(--bg-dark); padding: 2px 8px; border-radius: 4px; }
        .entry-source { font-size: 11px; color: var(--cyan); }
        .entry-right { display: flex; align-items: center; gap: 10px; }
        .entry-category { padding: 3px 10px; background: var(--purple-dim); color: var(--purple); border-radius: 10px; font-size: 10px; }
        .entry-confidence { font-size: 10px; color: var(--text-secondary); }
        .entry-confidence.high { color: var(--green); }
        .entry-confidence.medium { color: var(--orange); }
        .entry-confidence.low { color: var(--red); }
        .entry-body { padding: 16px; display: none; border-top: 1px solid var(--border); }
        .entry-body.expanded { display: block; }
        .entry-content { font-size: 13px; line-height: 1.7; padding: 14px; background: var(--bg-dark); border-radius: 8px; border-left: 3px solid var(--cyan); margin-bottom: 12px; }
        .entry-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
        .meta-item { padding: 10px; background: var(--bg-elevated); border-radius: 6px; }
        .meta-label { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 4px; }
        .meta-value { font-size: 12px; font-weight: 500; }
        .entry-actions { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border); }
        .entry-btn { padding: 8px 14px; border-radius: 6px; font-size: 11px; cursor: pointer; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-secondary); transition: all 0.2s; }
        .entry-btn:hover { border-color: var(--purple); color: var(--purple); }
        .entry-btn.delete { color: var(--red); }
        .entry-btn.delete:hover { border-color: var(--red); background: var(--red-dim); }
        
        /* Status Bar */
        .status-bar { background: var(--bg-card); border-top: 1px solid var(--border); padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-secondary); }
        .status-indicator { display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-dot.saved { background: var(--green); }
        .status-dot.modified { background: var(--orange); animation: pulse 1.5s infinite; }
        .status-dot.error { background: var(--red); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 550px; max-width: 90%; }
        .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .modal-field { margin-bottom: 16px; }
        .modal-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; display: block; }
        .modal-input { width: 100%; padding: 10px 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-size: 13px; }
        .modal-input:focus { outline: none; border-color: var(--cyan); }
        .modal-textarea { width: 100%; padding: 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-size: 13px; min-height: 120px; resize: vertical; line-height: 1.6; }
        .modal-select { width: 100%; padding: 10px 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-size: 13px; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        
        /* Toast */
        .toast { position: fixed; bottom: 60px; right: 20px; padding: 12px 20px; border-radius: 8px; font-size: 13px; z-index: 1000; animation: slideIn 0.3s ease; }
        .toast.success { background: var(--green); color: black; }
        .toast.error { background: var(--red); color: white; }
        .toast.info { background: var(--purple); color: white; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        /* Loading */
        .loading { text-align: center; padding: 60px; }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--purple); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Empty State */
        .empty-state { text-align: center; padding: 60px; color: var(--text-secondary); }
        .empty-state .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">👑</div>
            <div>
                <div class="logo-text">SOVEREIGN COMMAND</div>
                <div class="page-title">Night School Director — Wisdom Editor</div>
            </div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" onclick="saveChanges()">💾 Save Changes</button>
            <button class="btn btn-secondary" onclick="revertChanges()">↩ Revert</button>
            <a href="night_school.html" class="btn btn-secondary">← Back to Night School</a>
        </div>
    </header>
    
    <!-- TOOLBAR -->
    <div class="toolbar">
        <div class="toolbar-group">
            <button class="tool-btn" onclick="loadWisdom()">📥 Reload</button>
            <button class="tool-btn" onclick="exportWisdom()">📤 Export JSON</button>
            <button class="tool-btn" onclick="createSnapshot()">📸 Snapshot</button>
        </div>
        <div class="toolbar-group">
            <button class="tool-btn" onclick="openAddModal()">➕ Add Entry</button>
            <button class="tool-btn" onclick="deleteSelected()">🗑️ Delete</button>
        </div>
        <div class="toolbar-group">
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search wisdom entries..." oninput="searchEntries(this.value)">
        </div>
        <div class="toolbar-group" style="border-right: none; margin-left: auto;">
            <span style="font-size: 11px; color: var(--text-secondary);" id="connectionStatus">Connecting...</span>
        </div>
    </div>
    
    <!-- MAIN LAYOUT -->
    <div class="main-layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">📂 Categories</div>
                <div class="sidebar-stats" id="sidebarStats">Loading...</div>
            </div>
            <div class="category-list" id="categoryList">
                <!-- Categories loaded dynamically -->
            </div>
        </div>
        
        <!-- Editor -->
        <div class="editor-section">
            <div class="editor-header">
                <span class="editor-title" id="editorTitle">All Entries</span>
                <span class="editor-info" id="entryCount">Loading...</span>
            </div>
            <div class="editor-container" id="editorContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading wisdom entries...</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- STATUS BAR -->
    <div class="status-bar">
        <div class="status-indicator">
            <span class="status-dot saved" id="statusDot"></span>
            <span id="statusText">Ready</span>
        </div>
        <div>
            <span id="versionInfo">v16.4 • Last modified: --</span>
        </div>
    </div>
    
    <!-- ADD ENTRY MODAL -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-title">➕ Add Wisdom Entry</div>
            <div class="modal-field">
                <label class="modal-label">Category</label>
                <select class="modal-select" id="newCategory">
                    <option value="general">General</option>
                    <option value="crisis_intervention">Crisis Intervention</option>
                    <option value="cbt_techniques">CBT Techniques</option>
                    <option value="communication">Communication</option>
                    <option value="boundaries">Boundaries</option>
                    <option value="anxiety">Anxiety</option>
                    <option value="depression">Depression</option>
                    <option value="trauma">Trauma</option>
                    <option value="relationships">Relationships</option>
                    <option value="workplace">Workplace</option>
                    <option value="family_dynamics">Family Dynamics</option>
                    <option value="sleep">Sleep</option>
                    <option value="mindfulness">Mindfulness</option>
                </select>
            </div>
            <div class="modal-field">
                <label class="modal-label">Source</label>
                <input type="text" class="modal-input" id="newSource" placeholder="e.g., admin_manual_entry">
            </div>
            <div class="modal-field">
                <label class="modal-label">Content</label>
                <textarea class="modal-textarea" id="newContent" placeholder="Enter the wisdom content that Nate should learn..."></textarea>
            </div>
            <div class="modal-field">
                <label class="modal-label">Confidence (0.0 - 1.0)</label>
                <input type="number" class="modal-input" id="newConfidence" value="0.85" min="0" max="1" step="0.05">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmAddEntry()">Add Entry</button>
            </div>
        </div>
    </div>
    
    <!-- EDIT ENTRY MODAL -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-title">✏️ Edit Entry #<span id="editEntryId"></span></div>
            <div class="modal-field">
                <label class="modal-label">Content</label>
                <textarea class="modal-textarea" id="editContent"></textarea>
            </div>
            <div class="modal-field">
                <label class="modal-label">Confidence</label>
                <input type="number" class="modal-input" id="editConfidence" min="0" max="1" step="0.05">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmEditEntry()">Save Changes</button>
            </div>
        </div>
    </div>
    
    <script>
        // === STATE ===
        var wisdom = { entries: [], version: "16.4", total_entries: 0, last_modified: null };
        var originalWisdom = null;
        var isModified = false;
        var selectedEntry = null;
        var currentCategory = "all";
        var searchQuery = "";
        var ws = null;
        var editingEntryId = null;
        
        // === INIT ===
        function init() {
            // Credential check
            if (!sessionStorage.getItem("username")) {
                window.location.href = "index.html";
                return;
            }
            
            // Role check
            var profile = JSON.parse(sessionStorage.getItem("profile") || "{}");
            if (profile.role !== "ADMIN") {
                alert("Night School is admin-only.");
                window.location.href = "command.html";
                return;
            }
            
            // Check for highlight param
            var urlParams = new URLSearchParams(window.location.search);
            var highlight = urlParams.get('highlight');
            if (highlight) {
                selectedEntry = highlight;
            }
            
            connectWebSocket();
        }
        
        // === WEBSOCKET ===
        function connectWebSocket() {
            document.getElementById("connectionStatus").textContent = "Connecting...";
            
            ws = new WebSocket("wss://api.sovereignsanctuary.net/ws");
            
            ws.onopen = function() {
                console.log("[Wisdom] WebSocket connected");
                document.getElementById("connectionStatus").textContent = "● Connected";
                document.getElementById("connectionStatus").style.color = "var(--green)";
                
                // Request wisdom data
                ws.send(JSON.stringify({
                    type: "get_night_school_wisdom"
                }));
            };
            
            ws.onmessage = function(event) {
                var data = JSON.parse(event.data);
                handleMessage(data);
            };
            
            ws.onclose = function() {
                console.log("[Wisdom] WebSocket closed");
                document.getElementById("connectionStatus").textContent = "● Disconnected";
                document.getElementById("connectionStatus").style.color = "var(--red)";
                setTimeout(connectWebSocket, 3000);
            };
        }
        
        function handleMessage(data) {
            switch (data.type) {
                case "night_school_wisdom":
                    wisdom = data.data || data;
                    if (!wisdom.entries) wisdom.entries = [];
                    originalWisdom = JSON.parse(JSON.stringify(wisdom));
                    renderAll();
                    setStatus("saved", "Loaded " + wisdom.entries.length + " entries");
                    break;
                    
                case "wisdom_saved":
                    setStatus("saved", "All changes saved");
                    showToast("Wisdom saved successfully!", "success");
                    originalWisdom = JSON.parse(JSON.stringify(wisdom));
                    isModified = false;
                    break;
                    
                case "wisdom_entry_added":
                    showToast("Entry #" + data.entry_id + " added", "success");
                    break;
                    
                case "wisdom_entry_deleted":
                    showToast("Entry deleted", "info");
                    break;
                    
                case "snapshot_created":
                    showToast("Snapshot created: " + data.name, "success");
                    break;
                    
                case "error":
                    setStatus("error", data.message || "An error occurred");
                    showToast(data.message || "An error occurred", "error");
                    break;
            }
        }
        
        // === RENDERING ===
        function renderAll() {
            renderCategories();
            renderEntries();
            updateVersionInfo();
        }
        
        function renderCategories() {
            // Count entries by category
            var counts = {};
            var total = wisdom.entries.length;
            
            wisdom.entries.forEach(function(e) {
                var cat = e.category || "general";
                counts[cat] = (counts[cat] || 0) + 1;
            });
            
            var container = document.getElementById("categoryList");
            var html = '';
            
            // All entries
            html += '<div class="category-item' + (currentCategory === 'all' ? ' active' : '') + '" onclick="filterByCategory(\'all\')">';
            html += '<span class="category-name">📋 All Entries</span>';
            html += '<span class="category-count">' + total + '</span>';
            html += '</div>';
            
            // Category list
            var categories = [
                { key: "crisis_intervention", icon: "🚨", label: "Crisis Intervention" },
                { key: "cbt_techniques", icon: "🧠", label: "CBT Techniques" },
                { key: "communication", icon: "💬", label: "Communication" },
                { key: "boundaries", icon: "🛡️", label: "Boundaries" },
                { key: "anxiety", icon: "😰", label: "Anxiety" },
                { key: "depression", icon: "🌧️", label: "Depression" },
                { key: "trauma", icon: "💔", label: "Trauma" },
                { key: "relationships", icon: "❤️", label: "Relationships" },
                { key: "workplace", icon: "💼", label: "Workplace" },
                { key: "family_dynamics", icon: "👨‍👩‍👧", label: "Family Dynamics" },
                { key: "sleep", icon: "😴", label: "Sleep" },
                { key: "mindfulness", icon: "🧘", label: "Mindfulness" },
                { key: "general", icon: "📝", label: "General" }
            ];
            
            categories.forEach(function(c) {
                var count = counts[c.key] || 0;
                if (count > 0) {
                    html += '<div class="category-item' + (currentCategory === c.key ? ' active' : '') + '" onclick="filterByCategory(\'' + c.key + '\')">';
                    html += '<span class="category-name">' + c.icon + ' ' + c.label + '</span>';
                    html += '<span class="category-count">' + count + '</span>';
                    html += '</div>';
                }
            });
            
            container.innerHTML = html;
            document.getElementById("sidebarStats").textContent = total + " entries • " + Object.keys(counts).length + " categories";
        }
        
        function renderEntries() {
            var filtered = wisdom.entries;
            
            // Filter by category
            if (currentCategory !== "all") {
                filtered = filtered.filter(function(e) { return e.category === currentCategory; });
            }
            
            // Filter by search
            if (searchQuery) {
                var q = searchQuery.toLowerCase();
                filtered = filtered.filter(function(e) {
                    return (e.content && e.content.toLowerCase().includes(q)) ||
                           (e.source && e.source.toLowerCase().includes(q)) ||
                           (e.category && e.category.toLowerCase().includes(q));
                });
            }
            
            var container = document.getElementById("editorContainer");
            document.getElementById("entryCount").textContent = filtered.length + " entries";
            document.getElementById("editorTitle").textContent = currentCategory === "all" ? "All Entries" : formatCategory(currentCategory);
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><h3>No entries found</h3><p>Try adjusting your search or filter.</p></div>';
                return;
            }
            
            var html = '<div class="entries-grid">';
            
            for (var i = 0; i < filtered.length; i++) {
                var e = filtered[i];
                var isSelected = selectedEntry === e.id || selectedEntry === String(e.id);
                var confClass = e.confidence >= 0.9 ? 'high' : e.confidence >= 0.7 ? 'medium' : 'low';
                
                html += '<div class="entry-card' + (isSelected ? ' selected' : '') + '" data-id="' + e.id + '">';
                html += '<div class="entry-header" onclick="toggleEntry(' + e.id + ')">';
                html += '<div class="entry-left">';
                html += '<span class="entry-id">#' + e.id + '</span>';
                html += '<span class="entry-source">' + escapeHtml(e.source || 'unknown') + '</span>';
                html += '</div>';
                html += '<div class="entry-right">';
                html += '<span class="entry-category">' + escapeHtml(e.category || 'general') + '</span>';
                html += '<span class="entry-confidence ' + confClass + '">' + ((e.confidence || 0) * 100).toFixed(0) + '% conf</span>';
                html += '</div>';
                html += '</div>';
                
                html += '<div class="entry-body' + (isSelected ? ' expanded' : '') + '" id="entry-body-' + e.id + '">';
                html += '<div class="entry-content">' + escapeHtml(e.content || '') + '</div>';
                html += '<div class="entry-meta">';
                html += '<div class="meta-item"><div class="meta-label">Category</div><div class="meta-value">' + formatCategory(e.category) + '</div></div>';
                html += '<div class="meta-item"><div class="meta-label">Source</div><div class="meta-value">' + escapeHtml(e.source || 'unknown') + '</div></div>';
                html += '<div class="meta-item"><div class="meta-label">Approved</div><div class="meta-value">' + (e.approved ? '✓ Yes' : '✗ No') + '</div></div>';
                html += '</div>';
                html += '<div class="entry-actions">';
                html += '<button class="entry-btn" onclick="editEntry(' + e.id + ')">✏️ Edit</button>';
                html += '<button class="entry-btn" onclick="duplicateEntry(' + e.id + ')">📋 Duplicate</button>';
                html += '<button class="entry-btn delete" onclick="deleteEntry(' + e.id + ')">🗑️ Delete</button>';
                html += '</div>';
                html += '</div>';
                html += '</div>';
            }
            
            html += '</div>';
            container.innerHTML = html;
            
            // Scroll to selected if highlight param
            if (selectedEntry) {
                var el = document.querySelector('.entry-card.selected');
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
        
        function updateVersionInfo() {
            var info = "v" + (wisdom.version || "16.4");
            if (wisdom.last_modified) {
                info += " • Last modified: " + new Date(wisdom.last_modified).toLocaleString();
            }
            document.getElementById("versionInfo").textContent = info;
        }
        
        // === ACTIONS ===
        function filterByCategory(cat) {
            currentCategory = cat;
            renderCategories();
            renderEntries();
        }
        
        function searchEntries(query) {
            searchQuery = query;
            renderEntries();
        }
        
        function toggleEntry(id) {
            var body = document.getElementById("entry-body-" + id);
            var card = body.parentElement;
            
            if (body.classList.contains("expanded")) {
                body.classList.remove("expanded");
                card.classList.remove("selected");
                selectedEntry = null;
            } else {
                // Collapse others
                document.querySelectorAll(".entry-body.expanded").forEach(function(b) { b.classList.remove("expanded"); });
                document.querySelectorAll(".entry-card.selected").forEach(function(c) { c.classList.remove("selected"); });
                
                body.classList.add("expanded");
                card.classList.add("selected");
                selectedEntry = id;
            }
        }
        
        function openAddModal() {
            document.getElementById("newCategory").value = "general";
            document.getElementById("newSource").value = "admin_manual_entry";
            document.getElementById("newContent").value = "";
            document.getElementById("newConfidence").value = "0.85";
            document.getElementById("addModal").classList.add("active");
        }
        
        function closeAddModal() {
            document.getElementById("addModal").classList.remove("active");
        }
        
        function confirmAddEntry() {
            var category = document.getElementById("newCategory").value;
            var source = document.getElementById("newSource").value || "admin_manual_entry";
            var content = document.getElementById("newContent").value;
            var confidence = parseFloat(document.getElementById("newConfidence").value) || 0.85;
            
            if (!content.trim()) {
                alert("Please enter content for the entry.");
                return;
            }
            
            var newId = Math.max.apply(null, wisdom.entries.map(function(e) { return e.id || 0; }).concat([0])) + 1;
            
            var newEntry = {
                id: newId,
                category: category,
                source: source,
                content: content,
                confidence: confidence,
                approved: true,
                timestamp: new Date().toISOString()
            };
            
            wisdom.entries.unshift(newEntry);
            
            // Send to backend
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "add_wisdom_entry",
                    entry: newEntry
                }));
            }
            
            setModified();
            closeAddModal();
            renderAll();
            showToast("Entry #" + newId + " added", "success");
        }
        
        function editEntry(id) {
            var entry = wisdom.entries.find(function(e) { return e.id === id; });
            if (!entry) return;
            
            editingEntryId = id;
            document.getElementById("editEntryId").textContent = id;
            document.getElementById("editContent").value = entry.content || "";
            document.getElementById("editConfidence").value = entry.confidence || 0.85;
            document.getElementById("editModal").classList.add("active");
        }
        
        function closeEditModal() {
            editingEntryId = null;
            document.getElementById("editModal").classList.remove("active");
        }
        
        function confirmEditEntry() {
            if (!editingEntryId) return;
            
            var newContent = document.getElementById("editContent").value;
            var newConfidence = parseFloat(document.getElementById("editConfidence").value) || 0.85;
            
            var entry = wisdom.entries.find(function(e) { return e.id === editingEntryId; });
            if (entry) {
                entry.content = newContent;
                entry.confidence = newConfidence;
                
                // Send to backend
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "update_wisdom_entry",
                        entry_id: editingEntryId,
                        content: newContent,
                        confidence: newConfidence
                    }));
                }
                
                setModified();
                renderEntries();
                showToast("Entry #" + editingEntryId + " updated", "success");
            }
            
            closeEditModal();
        }
        
        function duplicateEntry(id) {
            var entry = wisdom.entries.find(function(e) { return e.id === id; });
            if (!entry) return;
            
            var newId = Math.max.apply(null, wisdom.entries.map(function(e) { return e.id || 0; })) + 1;
            
            var newEntry = {
                id: newId,
                category: entry.category,
                source: entry.source + "_copy",
                content: entry.content,
                confidence: entry.confidence,
                approved: true,
                timestamp: new Date().toISOString()
            };
            
            wisdom.entries.unshift(newEntry);
            setModified();
            renderAll();
            showToast("Entry duplicated as #" + newId, "success");
        }
        
        function deleteEntry(id) {
            if (!confirm("Delete entry #" + id + "? This cannot be undone.")) return;
            
            wisdom.entries = wisdom.entries.filter(function(e) { return e.id !== id; });
            
            // Send to backend
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "delete_wisdom_entry",
                    entry_id: id
                }));
            }
            
            setModified();
            renderAll();
            showToast("Entry #" + id + " deleted", "info");
        }
        
        function deleteSelected() {
            if (!selectedEntry) {
                alert("No entry selected. Click on an entry to select it first.");
                return;
            }
            deleteEntry(selectedEntry);
        }
        
        function saveChanges() {
            if (!isModified) {
                showToast("No changes to save", "info");
                return;
            }
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "save_wisdom",
                    wisdom: wisdom
                }));
                setStatus("saved", "Saving...");
            } else {
                // Offline mode
                setStatus("saved", "Saved locally (offline)");
                isModified = false;
                showToast("Changes saved locally", "info");
            }
        }
        
        function revertChanges() {
            if (!isModified) {
                showToast("No changes to revert", "info");
                return;
            }
            
            if (!confirm("Revert all unsaved changes?")) return;
            
            wisdom = JSON.parse(JSON.stringify(originalWisdom));
            isModified = false;
            setStatus("saved", "Changes reverted");
            renderAll();
            showToast("Changes reverted", "info");
        }
        
        function loadWisdom() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "get_night_school_wisdom"
                }));
                showToast("Reloading wisdom...", "info");
            }
        }
        
        function exportWisdom() {
            var json = JSON.stringify(wisdom, null, 2);
            var blob = new Blob([json], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'little_nate_wisdom_' + new Date().toISOString().slice(0,10) + '.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast("Wisdom exported", "success");
        }
        
        function createSnapshot() {
            var name = prompt("Snapshot name:", "pre-edit-" + new Date().toISOString().slice(0,10));
            if (!name) return;
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "create_wisdom_snapshot",
                    name: name
                }));
            }
            
            showToast("Snapshot '" + name + "' created", "success");
        }
        
        // === HELPERS ===
        function setModified() {
            isModified = true;
            setStatus("modified", "Unsaved changes");
        }
        
        function setStatus(state, text) {
            var dot = document.getElementById("statusDot");
            var statusText = document.getElementById("statusText");
            
            dot.className = "status-dot " + state;
            statusText.textContent = text;
        }
        
        function formatCategory(cat) {
            if (!cat) return "General";
            return cat.split('_').map(function(w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showToast(message, type) {
            var toast = document.createElement("div");
            toast.className = "toast " + (type || "info");
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(function() { toast.remove(); }, 3000);
        }
        
        // === MOCK DATA ===
        function loadMockData() {
            wisdom = {
                version: "16.4",
                total_entries: 847,
                last_modified: new Date().toISOString(),
                entries: [
                    { id: 847, category: "crisis_intervention", source: "coach_hope_session_notes", content: "When user mentions '988' or crisis keywords, immediately shift to safety protocol. Validate feelings first, then assess immediate risk.", confidence: 0.95, approved: true },
                    { id: 846, category: "cbt_techniques", source: "curriculum_cbt_2026.pdf", content: "The 3-breath grounding technique: Guide user through 3 deep breaths, focusing on physical sensation of breathing.", confidence: 0.88, approved: true },
                    { id: 845, category: "communication", source: "dr_smith_training", content: "When a client uses 'I feel' statements, acknowledge and validate before exploring further. Mirror their emotional language.", confidence: 0.92, approved: true },
                    { id: 844, category: "boundaries", source: "coach_marcus_notes", content: "For workplace boundary issues, first validate the challenge, then explore what specific outcomes the client wants.", confidence: 0.85, approved: true },
                    { id: 843, category: "anxiety", source: "curriculum_anxiety.pdf", content: "For acute anxiety, use the 5-4-3-2-1 grounding technique: 5 things you see, 4 you hear, 3 you touch, 2 you smell, 1 you taste.", confidence: 0.94, approved: true },
                    { id: 842, category: "depression", source: "dr_chen_protocols", content: "When client expresses hopelessness, avoid toxic positivity. Instead, acknowledge the difficulty and explore small, achievable goals.", confidence: 0.91, approved: true },
                    { id: 841, category: "relationships", source: "coach_hope_notes", content: "For relationship conflicts, help client identify their underlying needs before discussing communication strategies.", confidence: 0.87, approved: true },
                    { id: 840, category: "trauma", source: "emdr_training_2026", content: "If trauma response is triggered, pause processing and use grounding. Never push through dissociation.", confidence: 0.96, approved: true }
                ]
            };
            
            originalWisdom = JSON.parse(JSON.stringify(wisdom));
            renderAll();
            setStatus("saved", "Loaded " + wisdom.entries.length + " entries (mock data)");
        }
        
        // Auto-load mock data if no backend response
        setTimeout(function() {
            if (wisdom.entries.length === 0) {
                console.log("[Wisdom] Loading mock data");
                loadMockData();
            }
        }, 3000);
        
        window.onload = init;
    </script>
</body>
</html>
