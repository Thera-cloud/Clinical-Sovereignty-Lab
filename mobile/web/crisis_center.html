<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crisis Center | Sovereign Command</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #0A0A0A; --bg-card: #111111; --bg-elevated: #1A1A1A;
            --gold: #FFD700; --gold-dim: rgba(255, 215, 0, 0.2);
            --cyan: #00D4FF; --cyan-dim: rgba(0, 212, 255, 0.1);
            --green: #00FF88; --green-dim: rgba(0, 255, 136, 0.1);
            --red: #FF3B3B; --red-dim: rgba(255, 59, 59, 0.15);
            --orange: #FF9500;
            --text-primary: #FFFFFF; --text-secondary: #888888; --border: #252525;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; }
        .header { background: linear-gradient(180deg, #1A1A10 0%, #0A0A0A 100%); border-bottom: 1px solid var(--gold-dim); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--red), #FF6B6B); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .logo-text { font-size: 18px; font-weight: 700; color: var(--red); letter-spacing: 2px; }
        .page-title { font-size: 14px; color: var(--text-secondary); }
        .back-btn { padding: 8px 16px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-size: 12px; text-decoration: none; }
        .content { padding: 24px; }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
        .stat-card.danger { border-color: rgba(255, 59, 59, 0.3); background: var(--red-dim); }
        .stat-value { font-size: 32px; font-weight: 700; }
        .stat-value.red { color: var(--red); }
        .stat-value.orange { color: var(--orange); }
        .stat-value.green { color: var(--green); }
        .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        .crisis-list { display: flex; flex-direction: column; gap: 16px; }
        .crisis-card { background: var(--red-dim); border: 1px solid rgba(255, 59, 59, 0.3); border-radius: 12px; padding: 20px; }
        .crisis-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
        .crisis-icon { width: 48px; height: 48px; background: rgba(255, 59, 59, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .crisis-info { flex: 1; }
        .crisis-name { font-size: 18px; font-weight: 600; color: var(--red); }
        .crisis-trigger { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        .crisis-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
        .crisis-actions { display: flex; gap: 10px; }
        .crisis-btn { padding: 10px 20px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; }
        .crisis-btn.primary { background: var(--red); color: white; }
        .crisis-btn.secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
        .empty-state { text-align: center; padding: 60px; color: var(--text-secondary); }
        .empty-state .icon { font-size: 64px; margin-bottom: 20px; }
        .empty-state h3 { color: var(--green); font-size: 20px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">🚨</div>
            <div>
                <div class="logo-text">CRISIS CENTER</div>
                <div class="page-title">Real-time monitoring</div>
            </div>
        </div>
        <a href="command.html" class="back-btn">← Back to Dashboard</a>
    </header>
    <div class="content">
        <div class="stats-row">
            <div class="stat-card danger"><div class="stat-value red" id="activeCount">0</div><div class="stat-label">Active Alerts</div></div>
            <div class="stat-card"><div class="stat-value orange" id="watchCount">0</div><div class="stat-label">On Watch</div></div>
            <div class="stat-card"><div class="stat-value green" id="resolvedCount">0</div><div class="stat-label">Resolved Today</div></div>
            <div class="stat-card"><div class="stat-value" id="avgResponse">--</div><div class="stat-label">Avg Response</div></div>
        </div>
        <div class="crisis-list" id="crisisList">
            <div c="empty-state">
                <div class="icon">✅</div>
                <h3>All Clear</h3>
                <div>No active crisis alerts</div>
            </div>
        </div>
    </div>
    <script>
        var SERVER_URL = "wss://api.sovereignsanctuary.net/ws";
        var socket = null;
        var crisisAlerts = [];

        function init() {
            var uname = sessionStorage.getItem("username");
            if (!uname) { window.location.href = "index.html"; return; }
            connect();
        }

        function connect() {
            socket = new WebSocket(SERVER_URL);
            socket.onopen = function() {
                var profile = JSON.parse(sessionStorage.getItem("profile") || "{}");
                socket.send(JSON.stringify({
                    type: "login_request",
                    username: sessionStorage.getItem("username"),
                    password: sessionStorage.getItem("password"),
                    expected_role: profile.role
                }));
            };
           ocket.onmessage = handleMessage;
            socket.onclose = function() { setTimeout(connect, 3000); };
        }

        function handleMessage(event) {
            var data = JSON.parse(event.data);
            if (data.type === "login_success") {
                socket.send(JSON.stringify({ type: "admin_get_crisis_watchlist" }));
            } else if (data.type === "admin_crisis_watchlist" || data.type === "admin_stats") {
                crisisAlerts = data.crisis_watchlist || [];
                document.getElementById("activeCount").textContent = crisisAlerts.length;
                renderCrisis();
            }
        }

        function renderCrisis() {
            var list = document.getElementById("crisisList");
            if (crisisAlerts.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="icon">✅</div><h3>All Clear</h3><div>No active crisis alerts</div></div>';
                return;
            }
            var html = "";
            for (var i = 0; i crisisAlerts.length; i++) {
                var c = crisisAlerts[i];
                html += '<div class="crisis-card">';
                html += '<div class="crisis-header">';
                html += '<div class="crisis-icon">🚨</div>';
                html += '<div class="crisis-info">';
                html += '<div class="crisis-name">' + (c.user_name || c.user_id || "Unknown") + '</div>';
                html += '<div class="crisis-trigger">' + (c.trigger || "Flagged for review") + '</div>';
                html += '<div class="crisis-time">' + (c.time || "Just now") + '</div>';
                html += '</div></div>';
                html += '<div class="crisis-actions">';
                html += '<button class="crisis-btn primary" onclick="respondToCrisis(\'' + c.user_id + '\')">🎥 Respond Now</button>';
                html += '<button class="crisis-btn secondary" onclick="viewProfile(\'' + c.user_id + '\')">View Profile</button>';
                html += '<button class="crisis-btn secondary" onk="dismissAlert(\'' + c.user_id + '\')">Dismiss</button>';
                html += '</div></div>';
            }
            list.innerHTML = html;
        }

        function respondToCrisis(id) { alert("Initiating crisis response for: " + id); }
        function viewProfile(id) { window.location.href = "users.html?id=" + id; }
        function dismissAlert(id) { alert("Alert dismissed"); }

        window.onload = init;
    </script>
</body>
</html>
