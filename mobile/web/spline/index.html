<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Block Spline export analytics (hooks.spline.design); allow Draco decoder on gstatic -->
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self' https://www.gstatic.com;" />
    <title>Little Nate Avatar</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #050505;
      }
      html, body {
        height: 100%;
        width: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas3d"></canvas>
    <script type="module">
      import { Application } from './runtime.js';
      
      const canvas = document.getElementById('canvas3d');
      const app = new Application(canvas);
      
      let splineApp = null;
      let currentExpression = 'neutral';
      let variableMap = {};
      let vcHandler = null;
      
      function setAvatarState(expression, force) {
        if (!splineApp) return;
        if (!force && expression === currentExpression) return;
        
        const varKey = 'to_' + expression;
        const varObj = variableMap[varKey];
        
        if (!varObj) {
          console.warn('[SplineAvatar] No variable for:', varKey);
          return;
        }
        
        currentExpression = expression;
        const newValue = 'trigger_' + Date.now();
        
        try {
          varObj.raw.data.value.textValue = newValue;
        } catch(e) { /* raw data update failed */ }
        
        try {
          if (splineApp._variablesCache instanceof Map) {
            splineApp._variablesCache.set(varObj.name, varObj.raw.data);
          }
        } catch(e) { /* cache update failed */ }
        
        try {
          splineApp.setVariable(varObj.name, newValue);
        } catch(e) { /* setVariable failed */ }
        
        try {
          const em = app._eventManager;
          if (em && typeof em.publish === 'function') {
            em.publish('VariableChange', {
              variable: varObj.raw.data,
              name: varObj.name,
              id: varObj.raw.id,
              value: newValue,
            });
          }
        } catch(e) { /* publish failed */ }
        
        try {
          if (vcHandler && typeof vcHandler.onFrame === 'function') {
            vcHandler.onFrame();
          }
        } catch(e) { /* onFrame failed */ }
        
        try { splineApp.requestRender(); } catch(e) {}
      }
      
      window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'setExpression') {
          console.log('[SplineAvatar] setExpression:', event.data.expression);
          setAvatarState(event.data.expression, event.data.force === true);
        }
      });
      
      const sceneUrl = new URL('./scene.splinecode', window.location.href).href;
      
      app.load(sceneUrl).then(() => {
        splineApp = app;
        
        const sharedData = app._data && app._data.shared;
        const dataVars = sharedData ? sharedData.variables : null;
        
        if (dataVars && Array.isArray(dataVars)) {
          for (const v of dataVars) {
            const name = v.data ? v.data.name : null;
            const textValue = v.data && v.data.value ? v.data.value.textValue : null;
            const entry = { name: name, id: v.id, raw: v };

            if (name) {
              variableMap[name] = entry;
            }
            if (textValue) {
              variableMap[textValue] = entry;
            }
            
            if (name && splineApp._variablesCache instanceof Map) {
              splineApp._variablesCache.set(name, v.data);
            }
          }
        }
        
        console.log('[SplineAvatar] Ready — expression keys:', Object.keys(variableMap).filter(k => k.startsWith('to_')).sort());

        const em = app._eventManager;
        if (em && em.handlers && em.handlers.VariableChange) {
          vcHandler = em.handlers.VariableChange;
        }
        
        window.parent.postMessage({ type: 'spline_ready' }, '*');
        
      }).catch(err => {
        console.error('[SplineAvatar] Load error:', err);
      });
    </script>
  </body>
</html>
