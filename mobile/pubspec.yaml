name: little_nate
description: Sovereign Sanctuary — AI Therapy Platform

publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Networking
  http: ^1.1.2
  web_socket_channel: ^2.4.0
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0

  # WebView (for hybrid web pages like Dojo, Admin approvals)
  webview_flutter: ^4.4.2

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Audio (for voice mode)
  just_audio: ^0.9.36
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.2
  audioplayers: ^5.2.1
  permission_handler: ^11.3.0
  local_auth: ^2.2.0
  
  # File System
  path_provider: ^2.1.1
  file_picker: ^6.1.1

  # Cloud Storage (Google Drive / OneDrive export)
  google_sign_in: ^6.2.1
  googleapis: ^13.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  flutter_appauth: ^7.0.1

  # URL Launcher (for opening external links)
  url_launcher: ^6.2.2
  url_launcher_web: ^2.2.0

  # Share (for invite-a-friend native share sheet)
  share_plus: ^7.2.2

  # Pointer interceptor for web HTML overlays
  pointer_interceptor: ^0.10.1

  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.2
  logger: ^2.0.2+1
  equatable: ^2.0.5
  cryptography: ^2.7.0
  crypto: ^3.0.3
  path: ^1.9.0
  
  # ZEFCP Layer 1 Physical Transport
  flutter_blue_plus: ^1.32.0
  nfc_manager: ^3.3.0
  battery_plus: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8

flutter:
  uses-material-design: true


dependency_overrides:
  record_linux: 1.2.1
