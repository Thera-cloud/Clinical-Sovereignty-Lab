# QUANTUM-CRYSTAL-ARCH — Step 8.1 PEFT memory containment (ORANGE)
# Unit name on host: ln7_peft_server.service (not orange-peft).
# Observed peak RSS 20.3G on canary spindown. MemoryMax=18G OOMs healthy load.
# Cap at 22G hard / 20G soft — kills the ~21GB+ wedge, not a healthy canary.
[Service]
MemoryMax=22G
MemoryHigh=20G
