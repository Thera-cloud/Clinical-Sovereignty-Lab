<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Clients | Sovereign Command</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #0A0A0A; --bg-card: #111111; --bg-elevated: #1A1A1A;
            --gold: #FFD700; --gold-dim: rgba(255, 215, 0, 0.2);
            --red: #FF3B3B; --red-dim: rgba(255, 59, 59, 0.15);
            --cyan: #00D4FF; --cyan-dim: rgba(0, 212, 255, 0.1);
            --green: #00FF88; --green-dim: rgba(0, 255, 136, 0.1);
            --purple: #9D4EDD;
            --orange: #FF9500;
            --text-primary: #FFFFFF; --text-secondary: #888888; --border: #252525;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; }
        .header { background: linear-gradient(180deg, #1A1A10 0%, #0A0A0A 100%); border-bottom: 1px solid var(--gold-dim); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--gold), #FF8C00); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .logo-text { font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: 2px; }
        .page-title { font-size: 14px; color: var(--text-secondary); }
        .back-btn { padding: 8px 16px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-size: 12px; text-decoration: none; }
        .main-layout { display: grid; grid-template-columns: 1fr 400px; height: calc(100vh - 73px); }
        .main-layout.no-selection { grid-template-columns: 1fr; }
        .content { padding: 24px; overflow-y: auto; }
        .content-header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .content-title { font-size: 20px; font-weight: 700; }
        .search-input { padding: 10px 16px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 13px; width: 250px; }
        .client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
        .client-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.2s; }
        .client-card:hover { border-color: var(--gold-dim); transform: translateY(-2px); }
        .client-card.selected { border-color: var(--gold); background: var(--gold-dim); }
        .client-card.top-tier { border-color: var(--gold-dim); background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), var(--bg-card)); }
        .client-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
        .client-avatar { width: 50px; height: 50px; background: var(--cyan-dim); border: 2px solid var(--cyan); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; }
        .client-avatar.gold { background: var(--gold-dim); border-color: var(--gold); }
        .client-name { font-size: 16px; font-weight: 600; }
        .client-tier { font-size: 10px; padding: 3px 8px; background: var(--gold); color: black; border-radius: 10px; font-weight: 600; margin-left: 8px; }
        .client-meta { font-size: 12px; color: var(--text-secondary); }
        .client-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
        .stat { text-align: center; }
        .stat-value { font-size: 18px; font-weight: 700; }
        .stat-value.cyan { color: var(--cyan); }
        .stat-value.green { color: var(--green); }
        .stat-value.orange { color: var(--orange); }
        .stat-label { font-size: 10px; color: var(--text-secondary); }
        .risk-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: 600; }
        .risk-badge.low { background: var(--green-dim); color: var(--green); }
        .risk-badge.medium { background: rgba(255, 149, 0, 0.15); color: var(--orange); }
        .risk-badge.high { background: var(--red-dim); color: var(--red); }
        .sidebar { background: var(--bg-card); border-left: 1px solid var(--border); padding: 24px; overflow-y: auto; }
        .sidebar-header { margin-bottom: 20px; }
        .sidebar-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .sidebar-subtitle { font-size: 12px; color: var(--text-secondary); }
        .action-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .action-btn { padding: 12px 16px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; display: flex; align-items: center; gap: 10px; }
        .action-btn.primary { background: var(--gold); color: black; }
        .action-btn.secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
        .action-btn.danger { background: var(--red-dim); color: var(--red); border: 1px solid rgba(255, 59, 59, 0.3); }
        .info-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
        .info-section h4 { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; }
        .info-label { color: var(--text-secondary); }
        .info-value { font-weight: 500; }
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; color: var(--text-secondary); }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        /* Sidebar inline views */
        .sidebar-back { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--gold); font-size: 12px; font-weight: 600; margin-bottom: 16px; padding: 6px 0; border: none; background: none; }
        .sidebar-back:hover { opacity: 0.8; }
        .sidebar-section-title { font-size: 14px; font-weight: 700; color: var(--gold); margin-bottom: 12px; letter-spacing: 1px; }
        .brief-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .brief-metric { text-align: center; padding: 10px; background: var(--bg-dark); border-radius: 8px; }
        .brief-metric-value { font-size: 20px; font-weight: 700; }
        .brief-metric-label { font-size: 9px; color: var(--text-secondary); margin-top: 2px; }
        .brief-mood { padding: 10px 14px; background: var(--bg-elevated); border-radius: 8px; margin-bottom: 16px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
        .brief-suggestion { padding: 14px; background: rgba(0, 212, 255, 0.08); border: 1px solid rgba(0, 212, 255, 0.2); border-radius: 10px; margin-bottom: 16px; }
        .brief-suggestion-title { font-size: 11px; font-weight: 700; color: var(--cyan); margin-bottom: 6px; }
        .brief-suggestion-text { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
        .convo-entry { padding: 12px; background: var(--bg-dark); border-radius: 8px; margin-bottom: 8px; }
        .convo-time { font-size: 9px; color: var(--text-secondary); margin-bottom: 6px; }
        .convo-user { font-size: 12px; color: var(--text-primary); margin-bottom: 4px; }
        .convo-nate { font-size: 12px; color: var(--cyan); }
        .convo-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        .msg-composer { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
        .msg-textarea { width: 100%; min-height: 120px; padding: 12px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 13px; font-family: inherit; resize: vertical; }
        .msg-textarea:focus { outline: none; border-color: var(--gold); }
        .msg-send-btn { padding: 12px; background: var(--gold); color: black; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .msg-send-btn:hover { opacity: 0.9; }
        .msg-sent { padding: 14px; background: var(--green-dim); border: 1px solid rgba(0, 255, 136, 0.3); border-radius: 8px; color: var(--green); font-size: 12px; text-align: center; }
        .loading-inline { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 12px; }
        /* PMB Card Styles */
        .pmb-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
        .pmb-badge.minimizer { background: rgba(255, 149, 0, 0.15); color: #FF9500; }
        .pmb-badge.amplifier { background: rgba(255, 59, 59, 0.15); color: #FF3B3B; }
        .pmb-badge.normalizer { background: rgba(0, 255, 136, 0.1); color: #00FF88; }
        .pmb-badge.calibrating { background: rgba(136, 136, 136, 0.15); color: #888; }
        .pmb-badge.calibrated { background: rgba(0, 212, 255, 0.1); color: #00D4FF; }
        .pmb-section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
        .pmb-section-title { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--text-secondary); margin-bottom: 10px; }
        .pmb-meter { height: 6px; background: var(--bg-dark); border-radius: 3px; overflow: hidden; margin-top: 6px; margin-bottom: 4px; }
        .pmb-meter-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
        .pmb-belief-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--bg-dark); border-radius: 6px; margin-bottom: 6px; font-size: 12px; }
        .pmb-belief-conf { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 8px; }
        .pmb-belief-conf.high { background: rgba(0, 255, 136, 0.15); color: #00FF88; }
        .pmb-belief-conf.med { background: rgba(255, 149, 0, 0.12); color: #FF9500; }
        .pmb-belief-conf.low { background: rgba(136, 136, 136, 0.12); color: #888; }
        .pmb-reactivity-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .pmb-react-item { padding: 8px 10px; background: var(--bg-dark); border-radius: 6px; text-align: center; }
        .pmb-react-label { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .pmb-react-val { font-size: 16px; font-weight: 700; margin-top: 2px; }
        .pmb-react-item.dominant { border: 1px solid rgba(157, 78, 221, 0.4); background: rgba(157, 78, 221, 0.08); }
        .pmb-pred-item { padding: 10px; background: var(--bg-dark); border-radius: 8px; margin-bottom: 8px; }
        .pmb-pred-item.actionable { border: 1px solid rgba(0, 255, 136, 0.3); background: rgba(0, 255, 136, 0.05); }
        .pmb-pred-item.sub-threshold { opacity: 0.5; }
        .pmb-pred-text { font-size: 12px; margin-bottom: 4px; }
        .pmb-pred-conf { font-size: 10px; font-weight: 600; }
        .pmb-legacy-item { padding: 10px; background: rgba(157, 78, 221, 0.06); border: 1px solid rgba(157, 78, 221, 0.15); border-radius: 8px; margin-bottom: 8px; }
        .pmb-legacy-label { font-size: 10px; font-weight: 600; color: var(--purple); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .pmb-legacy-text { font-size: 12px; color: var(--text-secondary); }
        .pmb-empty { text-align: center; padding: 20px; color: var(--text-secondary); font-size: 12px; font-style: italic; }
        /* Zoom Session Styles */
        .zoom-session-card { padding: 12px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
        .zoom-session-card.meeting { border-left: 3px solid #2D8CFF; }
        .zoom-session-card.phone { border-left: 3px solid #00FF88; }
        .zoom-source-badge { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; }
        .zoom-source-badge.meeting { background: rgba(45, 140, 255, 0.15); color: #2D8CFF; }
        .zoom-source-badge.phone { background: rgba(0, 255, 136, 0.1); color: #00FF88; }
        .zoom-session-topic { font-size: 13px; font-weight: 600; margin-top: 6px; }
        .zoom-session-meta { font-size: 10px; color: var(--text-secondary); margin-top: 4px; }
        .zoom-data-sources { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .zoom-data-src { text-align: center; padding: 8px; background: var(--bg-dark); border-radius: 6px; }
        .zoom-data-src-val { font-size: 18px; font-weight: 700; }
        .zoom-data-src-label { font-size: 9px; color: var(--text-secondary); margin-top: 2px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">👑</div>
            <div>
                <div class="logo-text">SOVEREIGN COMMAND</div>
                <div class="page-title">My Clients</div>
            </div>
        </div>
        <a href="command.html" class="back-btn">← Back to Dashboard</a>
    </header>
    <div class="main-layout no-selection" id="mainLayout">
        <div class="content">
            <div class="content-header">
                <div class="content-title">My Clients</div>
                <input type="text" class="search-input" id="searchInput" placeholder="Search clients..." oninput="filterClients()">
            </div>
            <div class="client-grid" id="clientGrid">
                <div class="empty-state">
                    <div class="icon">⏳</div>
                    <div>Loading clients...</div>
                </div>
            </div>
        </div>
        <div class="sidebar" id="sidebar" style="display: none;">
            <div id="sidebarContent"></div>
        </div>
    </div>
    <script>

function _recoverAuth() {
  function _ck(n) { var m = document.cookie.match(new RegExp('(^| )' + n + '=([^;]+)')); return m ? decodeURIComponent(m[2]) : ''; }
  var hp = new URLSearchParams(location.hash.slice(1));
  var ht = hp.get('t'), hu = hp.get('u'), hpf = hp.get('p');
  if (ht) { try { sessionStorage.setItem('token', decodeURIComponent(ht)); } catch(e){} try { localStorage.setItem('sc_token', decodeURIComponent(ht)); } catch(e){} }
  if (hu) { try { sessionStorage.setItem('username', decodeURIComponent(hu)); } catch(e){} try { localStorage.setItem('sc_username', decodeURIComponent(hu)); } catch(e){} }
  if (hpf) { try { sessionStorage.setItem('profile', decodeURIComponent(hpf)); } catch(e){} try { localStorage.setItem('sc_profile', decodeURIComponent(hpf)); } catch(e){} }
  if (location.hash) try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  if (!sessionStorage.getItem('token')) { var ct = _ck('sc_token') || localStorage.getItem('sc_token'); if (ct) { try { sessionStorage.setItem('token', ct); } catch(e){} } }
  if (!sessionStorage.getItem('username')) { var cu = _ck('sc_username') || localStorage.getItem('sc_username'); if (cu) { try { sessionStorage.setItem('username', cu); } catch(e){} } }
  if (!sessionStorage.getItem('profile')) { var cp = _ck('sc_profile') || localStorage.getItem('sc_profile'); if (cp) { try { sessionStorage.setItem('profile', cp); } catch(e){} } }
}
_recoverAuth();
        function getWsUrl() {
            var host = location.hostname;
            if (!host || host === "localhost" || host === "127.0.0.1" || location.protocol === "file:") {
                return "wss://api.sovereignsanctuary.net/ws";
            }
            if (host.indexOf("sovereignsanctuary") >= 0) {
                return "wss://" + host + "/ws";
            }
            var proto = (location.protocol === "https:") ? "wss" : "ws";
            return proto + "://" + host + ":8765";
        }

        var socket = null;
        var allClients = [];
        var _wsRetry = 0;
        var selectedClient = null;
        var sidebarState = "actions"; // actions | brief | history | message | pmb | zoom

        // =====================================================================
        // INIT & WEBSOCKET
        // =====================================================================
        function init() {
            var uname = (sessionStorage.getItem("username") || localStorage.getItem("sc_username"));
            var token = (sessionStorage.getItem("token") || localStorage.getItem("sc_token"));
            if (!uname || !token) { window.location.href = "index.html"; return; }
            connect();
        }

        function connect() {
            socket = new WebSocket(getWsUrl());
            socket.onopen = function() {
                _wsRetry = 0;
                var profileStr = (sessionStorage.getItem("profile") || localStorage.getItem("sc_profile"));
                var profile = profileStr ? JSON.parse(profileStr) : {};
                socket.send(JSON.stringify({
                    type: "auth",
                    token: (sessionStorage.getItem("token") || localStorage.getItem("sc_token")),
                    hardware_id: profile.hardware_id || "WEB_ADMIN"
                }));
            };
            socket.onmessage = handleMessage;
            socket.onerror = function(e) { console.warn('WS error:', e); };
            socket.onclose = function() { var a = Math.min(_wsRetry, 10); var b = Math.min(1000 * Math.pow(2, a), 30000); _wsRetry++; setTimeout(connect, b + Math.floor(b * 0.2 * Math.random())); };
        }

        function handleMessage(event) {
            var data = JSON.parse(event.data);
            console.log("Received:", data.type);
            if (data.type === "login_success" || data.type === "auth_success") {
                socket.send(JSON.stringify({ type: "coach_get_clients" }));
            } else if (data.type === "coach_clients") {
                allClients = data.clients || [];
                console.log("Got clients:", allClients.length);
                renderClients();
            } else if (data.type === "presession_brief") {
                renderInlineBrief(data.brief);
            } else if (data.type === "client_history_data") {
                renderInlineHistory(data.history);
            } else if (data.type === "client_pmb_data") {
                renderInlinePMB(data);
            } else if (data.type === "client_zoom_sessions") {
                renderInlineZoom(data);
            }
        }

        // =====================================================================
        // CLIENT GRID
        // =====================================================================
        function renderClients() {
            var grid = document.getElementById("clientGrid");
            var search = document.getElementById("searchInput").value.toLowerCase();
            var filtered = allClients.filter(function(c) {
                return (c.name || "").toLowerCase().indexOf(search) >= 0;
            });
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div>No clients found</div></div>';
                return;
            }
            var html = "";
            for (var i = 0; i < filtered.length; i++) {
                var c = filtered[i];
                var isTopTier = c.tier === "TOP_TIER" || c.tier === "PREMIUM";
                var isSelected = selectedClient && selectedClient.id === c.id;
                var initials = getInitials(c.name);
                var coherence = c.metrics && c.metrics.coherence ? c.metrics.coherence : "--";
                var growth = c.metrics && (c.metrics.growth || c.metrics.growth_potential) ? (c.metrics.growth || c.metrics.growth_potential) : "--";
                var risk = c.metrics && c.metrics.risk_level ? c.metrics.risk_level : "LOW";
                html += '<div class="client-card ' + (isTopTier ? 'top-tier ' : '') + (isSelected ? 'selected' : '') + '" onclick="selectClient(\'' + c.id + '\')">';
                html += '<div class="client-header"><div class="client-avatar ' + (isTopTier ? 'gold' : '') + '">' + initials + '</div><div>';
                html += '<div class="client-name">' + (c.name || "Unknown");
                if (isTopTier) html += '<span class="client-tier">TOP TIER</span>';
                html += '</div>';
                html += '<div class="client-meta">' + (c.total_sessions || 0) + ' sessions &bull; Last: ' + (c.last_login ? String(c.last_login).slice(0, 10) : 'Never') + '</div>';
                html += '</div></div>';
                html += '<div class="client-stats">';
                html += '<div class="stat"><div class="stat-value cyan">' + coherence + '</div><div class="stat-label">Coherence</div></div>';
                html += '<div class="stat"><div class="stat-value green">' + growth + '</div><div class="stat-label">Growth</div></div>';
                html += '<div class="stat"><div class="stat-value"><span class="risk-badge ' + risk.toLowerCase() + '">' + risk + '</span></div><div class="stat-label">Risk</div></div>';
                html += '</div></div>';
            }
            grid.innerHTML = html;
        }

        function getInitials(name) {
            if (!name) return "?";
            var parts = name.split(" ");
            var r = "";
            for (var i = 0; i < parts.length && i < 2; i++) {
                if (parts[i].length > 0) r += parts[i][0];
            }
            return r.toUpperCase();
        }

        function filterClients() { renderClients(); }

        // =====================================================================
        // CLIENT SELECTION & SIDEBAR STATE
        // =====================================================================
        function selectClient(clientId) {
            selectedClient = null;
            for (var i = 0; i < allClients.length; i++) {
                if (allClients[i].id === clientId) { selectedClient = allClients[i]; break; }
            }
            renderClients();
            if (selectedClient) showSidebarActions();
        }

        function showSidebarActions() {
            sidebarState = "actions";
            var sb = document.getElementById("sidebar");
            var layout = document.getElementById("mainLayout");
            layout.classList.remove("no-selection");
            sb.style.display = "block";

            var c = selectedClient;
            if (!c) return;
            var tier = c.tier || c.subscription_tier || "STANDARD";
            var coherence = c.metrics && c.metrics.coherence ? c.metrics.coherence : "--";
            var growth = c.metrics && (c.metrics.growth || c.metrics.growth_potential) ? (c.metrics.growth || c.metrics.growth_potential) : "--";
            var risk = c.metrics && c.metrics.risk_level ? c.metrics.risk_level : "LOW";

            var html = '';
            html += '<div class="sidebar-header">';
            html += '<div class="sidebar-title">' + (c.name || "Unknown") + '</div>';
            html += '<div class="sidebar-subtitle">ID: ' + c.id + '</div>';
            html += '</div>';
            html += '<div class="action-buttons">';
            html += '<button class="action-btn primary" onclick="startSession()">🎥 Start Session</button>';
            html += '<button class="action-btn secondary" onclick="openBrief()">📋 Pre-Session Brief</button>';
            html += '<button class="action-btn secondary" onclick="viewHistory()">📊 View History</button>';
            html += '<button class="action-btn secondary" onclick="sendMessage()">💬 Send Message</button>';
            html += '<button class="action-btn secondary" onclick="viewPMB()" style="background:rgba(157,78,221,0.1);border-color:rgba(157,78,221,0.3);color:#9D4EDD;">🧠 View PMB</button>';
            html += '<button class="action-btn secondary" onclick="viewZoomSessions()" style="background:rgba(45,140,255,0.08);border-color:rgba(45,140,255,0.25);color:#2D8CFF;">📹 Zoom Sessions</button>';
            html += '</div>';
            html += '<div class="info-section"><h4>CLIENT INFORMATION</h4>';
            html += '<div class="info-row"><span class="info-label">Subscription</span><span class="info-value">' + tier + '</span></div>';
            html += '<div class="info-row"><span class="info-label">Sessions Total</span><span class="info-value">' + (c.total_sessions || 0) + '</span></div>';
            html += '<div class="info-row"><span class="info-label">Last Login</span><span class="info-value">' + (c.last_login ? String(c.last_login).slice(0, 10) : "Never") + '</span></div>';
            html += '</div>';
            html += '<div class="info-section"><h4>NEVEDAL STATE</h4>';

            html += '<div class="zoom-data-src"><div class="zoom-data-src-val" style="color:#2D8CFF">' + meetingCount + '</div><div class="zoom-data-src-label">Video Sessions</div></div>';
            html += '<div class="zoom-data-src"><div class="zoom-data-src-val" style="color:#00FF88">' + phoneCount + '</div><div class="zoom-data-src-label">Phone Calls</div></div>';
            html += '<div class="zoom-data-src"><div class="zoom-data-src-val" style="color:var(--gold)">' + total + '</div><div class="zoom-data-src-label">Total</div></div>';
            html += '</div>';

            if (sessions.length === 0) {
                html += '<div class="pmb-empty">No Zoom sessions ingested yet.<br>Once Zoom cloud recording is enabled, sessions will appear here automatically.</div>';
            } else {
                html += '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:12px">Showing ' + sessions.length + ' of ' + total + ' sessions (most recent first)</div>';
                // Reverse to show most recent first
                for (var j = sessions.length - 1; j >= 0; j--) {
                    var s = sessions[j];
                    var srcType = (s.source || "zoom_meeting") === "zoom_phone" ? "phone" : "meeting";
                    html += '<div class="zoom-session-card ' + srcType + '">';
                    html += '<div style="display:flex;align-items:center;gap:8px">';
                    html += '<span class="zoom-source-badge ' + srcType + '">' + (srcType === "phone" ? "PHONE" : "VIDEO") + '</span>';
                    if (s.meeting_id) html += '<span style="font-size:9px;color:var(--text-secondary)">#' + String(s.meeting_id).slice(0, 10) + '</span>';
                    html += '</div>';
                    if (s.topic) html += '<div class="zoom-session-topic">' + escapeHtml(s.topic) + '</div>';
                    html += '<div class="zoom-session-meta">';
                    if (s.start_time) html += '📅 ' + String(s.start_time).slice(0, 16).replace("T", " ");
                    if (s.duration) html += ' &bull; ⏱ ' + s.duration + ' min';
                    html += '</div>';
                    html += '<div class="zoom-session-meta">';
                    html += '💬 ' + (s.client_turns_processed || 0) + ' client turns processed';
                    if (s.turns_total) html += ' / ' + s.turns_total + ' total';
                    html += '</div>';
                    if (s.ingested_at) {
                        html += '<div class="zoom-session-meta">Ingested: ' + String(s.ingested_at).slice(0, 19).replace("T", " ") + '</div>';
                    }
                    html += '</div>';
                }
            }

            document.getElementById("sidebarContent").innerHTML = html;
        }

        function fmtPct(val) {
            if (val === undefined || val === null) return "—";
            if (typeof val === "string") val = parseFloat(val);
            if (isNaN(val)) return "—";
            return (val * 100).toFixed(0) + "%";
        }

        // =====================================================================
        // UTILITY
        // =====================================================================
        function escapeHtml(str) {
            var div = document.createElement("div");
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        window.onload = init;
    </script>
</body>
</html>
