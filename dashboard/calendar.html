<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar | Sovereign Command</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-void: #050505; --bg-dark: #0A0A0A; --bg-card: #111111; --bg-elevated: #1A1A1A;
            --gold: #C9A962; --gold-dim: rgba(201, 169, 98, 0.2);
            --cyan: #4ECDC4; --cyan-dim: rgba(78, 205, 196, 0.1);
            --green: #00FF88; --green-dim: rgba(0, 255, 136, 0.1);
            --red: #FF3B3B;
            --orange: #FF9500;
            --text-primary: #FFFFFF; --text-secondary: #888888; --border: #252525;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg-void); color: var(--text-primary); min-height: 100vh; }
        .header { background: linear-gradient(180deg, #1A1A10 0%, #0A0A0A 100%); border-bottom: 1px solid var(--gold-dim); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--gold), #FF8C00); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .logo-text { font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: 2px; }
        .page-title { font-size: 14px; color: var(--text-secondary); }
        .back-btn { padding: 8px 16px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-size: 12px; text-decoration: none; }
        .main-layout { display: grid; grid-template-columns: 1fr 350px; gap: 24px; padding: 24px; height: calc(100vh - 73px); }
        .calendar-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar-title { font-size: 20px; font-weight: 700; }
        .calendar-nav { display: flex; gap: 10px; }
        .nav-btn { padding: 8px 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px; color: var(--gold); cursor: pointer; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .day-header { text-align: center; font-size: 11px; color: var(--text-secondary); padding: 10px 0; }
        .day-cell { aspect-ratio: 1; background: var(--bg-elevated); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; position: relative; border: 1px solid transparent; }
        .day-cell:hover { border-color: var(--gold-dim); }
        .day-cell.today { background: var(--gold-dim); border-color: var(--gold); }
        .day-cell.has-session::after { content: ''; position: absolute; bottom: 6px; width: 6px; height: 6px; background: var(--green); border-radius: 50%; }
        .day-cell.other-month { opacity: 0.3; }
        .sessions-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; overflow-y: auto; }
        .panel-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        .session-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
        .session-time { font-size: 18px; font-weight: 700; color: var(--gold); }
        .session-client { font-size: 14px; margin-top: 8px; }
        .session-status { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: 500; margin-top: 8px; }
        .session-status.confirmed { background: var(--green-dim); color: var(--green); }
        .session-status.pending { background: rgba(255, 149, 0, 0.15); color: var(--orange); }
        .session-actions { display: flex; gap: 8px; margin-top: 12px; }
        .session-btn { flex: 1; padding: 10px; border-radius: 6px; font-size: 11px; cursor: pointer; border: none; text-align: center; }
        .session-btn.primary { background: var(--green); color: black; }
        .session-btn.secondary { background: var(--bg-dark); color: var(--text-secondary); border: 1px solid var(--border); }
        .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }

        /* ── Loading Spinner ── */
        .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Connection Status ── */
        .ws-status { position: fixed; top: 8px; right: 8px; padding: 4px 10px; border-radius: 12px; font-size: 10px; z-index: 999; display: none; }
        .ws-status.disconnected { display: block; background: rgba(255, 59, 59, 0.2); color: #FF3B3B; }
        .ws-status.reconnecting { display: block; background: rgba(255, 149, 0, 0.2); color: #FF9500; }

        /* ── Mobile Responsive ── */
        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 1fr; height: auto; }
            .calendar-grid { grid-template-columns: repeat(7, 1fr); }
            .day-cell { aspect-ratio: auto; min-height: 48px; padding: 4px; font-size: 11px; }
            .header { padding: 10px 12px; flex-wrap: wrap; gap: 8px; }
            .calendar-card { padding: 12px; }
            .session-card { padding: 12px; }
        }
        @media (max-width: 480px) {
            .calendar-title { font-size: 16px; }
            .day-cell { min-height: 36px; font-size: 10px; }
            .header { padding: 8px; }
            .logo-text { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div id="wsStatus" class="ws-status"></div>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">👑</div>
            <div>
                <div class="logo-text">SOVEREIGN COMMAND</div>
                <div class="page-title">Calendar</div>
            </div>
        </div>
        <a href="command.html" class="back-btn">← Back to Dashboard</a>
    </header>
    <div class="main-layout">
        <div class="calendar-card">
            <div class="calendar-header">
                <div class="calendar-title" id="monthTitle">January 2026</div>
                <div class="calendar-nav">
                    <button class="nav-btn" onclick="prevMonth()">◀</button>
                    <button class="nav-btn" onclick="nextMonth()">▶</button>
                </div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
        <div class="sessions-panel">
            <div class="panel-title">📅 Today's Sessions</div>
            <div id="sessionsList">
                <div class="empty-state" id="sessionsLoading">
                    <div class="spinner" style="margin: 0 auto 12px;"></div>
                    <div>Loading sessions...</div>
                </div>
            </div>
        </div>
    </div>
    <script>

function _recoverAuth() {
  function _ck(n) { var m = document.cookie.match(new RegExp('(^| )' + n + '=([^;]+)')); return m ? decodeURIComponent(m[2]) : ''; }
  var hp = new URLSearchParams(location.hash.slice(1));
  var ht = hp.get('t'), hu = hp.get('u'), hpf = hp.get('p');
  if (ht) { try { sessionStorage.setItem('token', decodeURIComponent(ht)); } catch(e){} try { localStorage.setItem('sc_token', decodeURIComponent(ht)); } catch(e){} }
  if (hu) { try { sessionStorage.setItem('username', decodeURIComponent(hu)); } catch(e){} try { localStorage.setItem('sc_username', decodeURIComponent(hu)); } catch(e){} }
  if (hpf) { try { sessionStorage.setItem('profile', decodeURIComponent(hpf)); } catch(e){} try { localStorage.setItem('sc_profile', decodeURIComponent(hpf)); } catch(e){} }
  if (location.hash) try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  if (!sessionStorage.getItem('token')) { var ct = _ck('sc_token') || localStorage.getItem('sc_token'); if (ct) { try { sessionStorage.setItem('token', ct); } catch(e){} } }
  if (!sessionStorage.getItem('username')) { var cu = _ck('sc_username') || localStorage.getItem('sc_username'); if (cu) { try { sessionStorage.setItem('username', cu); } catch(e){} } }
  if (!sessionStorage.getItem('profile')) { var cp = _ck('sc_profile') || localStorage.getItem('sc_profile'); if (cp) { try { sessionStorage.setItem('profile', cp); } catch(e){} } }
}
_recoverAuth();
        var socket = null;
        var schedule = []; // raw schedule entries (CoachNexusV2 format)
        var clientNameById = {}; // client_id -> name (from coach_get_clients)
        var currentDate = new Date();
        var selectedDay = new Date().getDate();

        function getWsUrl() {
            var host = location.hostname;
            if (!host || host === "localhost" || host === "127.0.0.1" || location.protocol === "file:") {
                return "wss://api.sovereignsanctuary.net/ws";
            }
            if (host.indexOf("sovereignsanctuary") >= 0) {
                return "wss://" + host + "/ws";
            }
            var proto = (location.protocol === "https:") ? "wss" : "ws";
            return proto + "://" + host + ":8765";
        }

        function init() {
            var uname = (sessionStorage.getItem("username") || localStorage.getItem("sc_username"));
            var token = (sessionStorage.getItem("token") || localStorage.getItem("sc_token"));
            if (!uname || !token) { window.location.href = "index.html"; return; }
            connect();
            renderCalendar();
        }

        function connect() {
            socket = new WebSocket(getWsUrl());
            socket.onopen = function() {
                document.getElementById('wsStatus').className = 'ws-status';
                var profile = JSON.parse((sessionStorage.getItem("profile") || localStorage.getItem("sc_profile")) || "{}");
                socket.send(JSON.stringify({
                    type: "auth",
                    token: (sessionStorage.getItem("token") || localStorage.getItem("sc_token")),
                    hardware_id: profile.hardware_id || "WEB_ADMIN"
                }));
            };
            socket.onmessage = handleMessage;
            socket.onclose = function() {
                var el = document.getElementById('wsStatus');
                el.className = 'ws-status reconnecting';
                el.textContent = 'Reconnecting...';
                setTimeout(connect, 2000);
            };
        }

        function handleMessage(event) {
            var data = JSON.parse(event.data);
            if (data.type === "login_success" || data.type === "auth_success") {
                requestCalendar();
                socket.send(JSON.stringify({ type: "coach_get_clients" }));
            } else if (data.type === "coach_calendar_data") {
                schedule = (data.data && data.data.schedule) ? data.data.schedule : [];
                renderCalendar();
                renderSessions(selectedDay);
            } else if (data.type === "coach_clients") {
                clientNameById = {};
                (data.clients || []).forEach(function(c) {
                    if (c && c.id) clientNameById[c.id] = c.name || c.id;
                });
                renderSessions(selectedDay);
            }
        }

        function requestCalendar() {
            if (!socket) return;
            var month = currentDate.getMonth() + 1; // CoachNexusV2 uses 1-12
            var year = currentDate.getFullYear();
            socket.send(JSON.stringify({ type: "fetch_coach_calendar", month: month, year: year }));
        }

        function dayOfMonth(isoDate) {
            try { return new Date(isoDate).getDate(); } catch (e) { return null; }
        }

        function monthOf(isoDate) {
            try { return new Date(isoDate).getMonth(); } catch (e) { return null; }
        }

        function yearOf(isoDate) {
            try { return new Date(isoDate).getFullYear(); } catch (e) { return null; }
        }

        function renderCalendar() {
            var grid = document.getElementById("calendarGrid");
            var year = currentDate.getFullYear();
            var month = currentDate.getMonth();
            var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
            document.getElementById("monthTitle").textContent = months[month] + " " + year;

            var firstDay = new Date(year, month, 1).getDay();
            var daysInMonth = new Date(year, month + 1, 0).getDate();
            var today = new Date();

            var html = "";
            var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
            for (var d = 0; d < 7; d++) html += '<div class="day-header">' + days[d] + '</div>';
            for (var i = 0; i < firstDay; i++) html += '<div class="day-cell other-month"></div>';

            for (var day = 1; day <= daysInMonth; day++) {
                var isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                var hasSession = schedule.some(function(s) {
                    return s && s.date && dayOfMonth(s.date) === day && monthOf(s.date) === month && yearOf(s.date) === year && (s.status || "pending") !== "cancelled";
                });
                html += '<div class="day-cell' + (isToday ? ' today' : '') + (hasSession ? ' has-session' : '') + '" onclick="selectDay(' + day + ')">' + day + '</div>';
            }
            grid.innerHTML = html;
        }

        function selectDay(day) {
            selectedDay = day;
            renderSessions(day);
        }

        function statusClass(status) {
            var s = (status || "").toLowerCase();
            if (s === "confirmed") return "confirmed";
            if (s === "pending") return "pending";
            if (s === "cancelled") return "pending";
            return "confirmed";
        }

        function renderSessions(day) {
            var list = document.getElementById("sessionsList");
            var year = currentDate.getFullYear();
            var month = currentDate.getMonth();

            var daySessions = schedule.filter(function(s) {
                return s && s.date && dayOfMonth(s.date) === day && monthOf(s.date) === month && yearOf(s.date) === year && (s.status || "pending") !== "cancelled";
            });

            if (daySessions.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="icon">📅</div><div>No sessions scheduled</div></div>';
                return;
            }

            daySessions.sort(function(a, b) { return String(a.time || "").localeCompare(String(b.time || "")); });

            var html = "";
            for (var i = 0; i < daySessions.length; i++) {
                var s = daySessions[i];
                var cid = s.client_id || "";
                var cname = (cid && clientNameById[cid]) ? clientNameById[cid] : (s.client_name || cid || "Client");
                var st = statusClass(s.status);

                html += '<div class="session-card">';
                html += '<div class="session-time">' + (s.time || "Not scheduled") + '</div>';
                html += '<div class="session-client">' + cname + '</div>';
                html += '<span class="session-status ' + st + '">' + (s.status || "pending").toUpperCase() + '</span>';
                html += '<div class="session-actions">';
                html += '<button class="session-btn primary" onclick="joinSession(\'' + (s.zoom_link || '') + '\')">🎥 Join</button>';
                html += '<button class="session-btn secondary" onclick="openBrief(\'' + cid + '\')">📋 Brief</button>';
                html += '</div></div>';
            }
            list.innerHTML = html;
        }

        function joinSession(link) {
            if (link) window.open(link, "_blank");
            else alert("No join link available yet.");
        }

        function openBrief(clientId) {
            if (!clientId) return;
            window.location.href = "presession_brief.html?client=" + encodeURIComponent(clientId);
        }

        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            selectedDay = 1;
            requestCalendar();
            renderCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            selectedDay = 1;
            requestCalendar();
            renderCalendar();
        }

        window.onload = init;
    </script>
</body>
</html>
