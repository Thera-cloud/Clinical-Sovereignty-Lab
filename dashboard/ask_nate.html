<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Little Nate | Sovereign Command</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #050505;
            --bg-dark: #0A0A0A;
            --bg-card: #111111;
            --bg-elevated: #1A1A1A;
            --border: #252525;
            --gold: #C9A962;
            --gold-dim: rgba(201, 169, 98, 0.2);
            --cyan: #4ECDC4;
            --cyan-dim: rgba(78, 205, 196, 0.15);
            --text-primary: #FFFFFF;
            --text-secondary: #888888;
            --text-muted: #555555;
            --font-body: 'DM Sans', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-void);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(180deg, #0a1a1a 0%, var(--bg-dark) 100%);
            border-bottom: 1px solid var(--cyan-dim);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--cyan);
            font-size: 24px;
            cursor: pointer;
        }

        .header-content {
            flex: 1;
        }

        .header-title {
            color: var(--cyan);
            font-size: 18px;
            font-weight: 600;
        }

        .header-subtitle {
            color: var(--text-muted);
            font-size: 12px;
        }

        .nate-avatar {
            width: 48px;
            height: 48px;
            background: radial-gradient(circle, #001a33 30%, #000 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .nate-eyes {
            display: flex;
            gap: 10px;
        }

        .nate-eye {
            width: 8px;
            height: 8px;
            background: rgba(0, 255, 255, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
        }

        .client-context {
            background: var(--gold-dim);
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .context-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--gold), #FF8C00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .context-info {
            flex: 1;
        }

        .context-label {
            color: var(--gold);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .context-name {
            font-size: 14px;
            font-weight: 500;
        }

        .context-select {
            background: transparent;
            border: 1px solid rgba(255, 215, 0, 0.5);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--gold);
            font-size: 12px;
            cursor: pointer;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .quick-questions {
            margin-bottom: 24px;
        }

        .section-label {
            color: var(--text-muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .quick-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-btn {
            background: var(--cyan-dim);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px;
            padding: 10px 16px;
            color: var(--cyan);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: rgba(0, 212, 255, 0.25);
            border-color: var(--cyan);
        }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .message-avatar.nate {
            background: radial-gradient(circle, #001a33 30%, #000 100%);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        .message-avatar.user {
            background: linear-gradient(135deg, var(--gold), #FF8C00);
        }

        .message-bubble {
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
        }

        .message.nate .message-bubble {
            background: var(--cyan-dim);
            border: 1px solid rgba(78, 205, 196, 0.3);
            border-bottom-left-radius: 4px;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--gold), #FF8C00);
            color: #000;
            border-bottom-right-radius: 4px;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--cyan-dim);
            border-radius: 16px;
            max-width: 100px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--cyan);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .data-sources {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .source-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 10px;
            color: var(--text-muted);
        }

        .input-area {
            padding: 20px 24px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
        }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .text-input {
            flex: 1;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 14px 20px;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 14px;
        }

        .text-input:focus {
            outline: none;
            border-color: var(--cyan);
        }

        .text-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--cyan), #00a8cc);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        /* ── Connection Status Indicator ── */
        .ws-status { position: fixed; top: 8px; right: 8px; padding: 4px 10px; border-radius: 12px; font-size: 10px; z-index: 999; display: none; }
        .ws-status.disconnected { display: block; background: rgba(255, 59, 59, 0.2); color: #FF3B3B; }
        .ws-status.reconnecting { display: block; background: rgba(255, 149, 0, 0.2); color: #FF9500; }

        /* ── Loading Spinner ── */
        .loading-overlay { display: none; position: absolute; inset: 0; background: rgba(5,5,5,0.7); z-index: 10; align-items: center; justify-content: center; }
        .loading-overlay.active { display: flex; }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Mobile Responsive ── */
        @media (max-width: 768px) {
            .header { padding: 10px 12px; flex-wrap: wrap; gap: 8px; }
            .nav a { font-size: 11px; padding: 6px 10px; }
            .chat-container { max-width: 100%; margin: 0; padding: 12px; }
            .input-row { flex-direction: column; gap: 8px; }
            .input-row input { font-size: 14px; }
            .send-btn { width: 100%; justify-content: center; padding: 12px; }
            .quick-btns { justify-content: center; }
        }
        @media (max-width: 480px) {
            .header { padding: 8px; }
            .logo-text { font-size: 14px; }
            .nav { gap: 4px; }
            .nav a { font-size: 10px; padding: 4px 8px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <button class="back-btn" onclick="window.location.href='command.html'">←</button>
        <div class="header-content">
            <div class="header-title">Ask Little Nate</div>
            <div class="header-subtitle">AI-Powered Client Intelligence</div>
        </div>
        <div class="nate-avatar">
            <div class="nate-eyes">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
        </div>
    </header>

    <div class="client-context">
        <div class="context-avatar">👤</div>
        <div class="context-info">
            <div class="context-label">Asking about</div>
            <div class="context-name" id="selectedClient">All Clients</div>
        </div>
        <select class="context-select" id="clientSelect" onchange="selectClient()">
            <option value="">All Clients</option>
        </select>
    </div>

    <div class="chat-container">
        <div class="chat-area" id="chatArea">
            <div class="quick-questions">
                <div class="section-label">Quick Questions</div>
                <div class="quick-btns">
                    <button class="quick-btn" onclick="askQuestion('What are the recent emotional patterns?')">Recent patterns?</button>
                    <button class="quick-btn" onclick="askQuestion('What breakthroughs have occurred?')">Breakthroughs</button>
                    <button class="quick-btn" onclick="askQuestion('What are the risk indicators?')">Risk indicators</button>
                    <button class="quick-btn" onclick="askQuestion('What topics should I address?')">Topics to address</button>
                    <button class="quick-btn" onclick="askQuestion('Family dynamics summary')">Family dynamics</button>
                    <button class="quick-btn" onclick="askQuestion('Session recommendations')">Session tips</button>
                </div>
            </div>

            <div class="messages" id="messages">
                <div class="empty-chat-state" id="emptyChatState" style="text-align:center; padding:40px 20px; color:var(--text-muted);">
                    <div style="font-size:40px; margin-bottom:12px; opacity:0.4;">💬</div>
                    <div style="font-size:14px; margin-bottom:4px;">No messages yet</div>
                    <div style="font-size:12px;">Select a client and ask a question to begin</div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-row">
                <input type="text" class="text-input" id="messageInput" placeholder="Ask Nate about your clients..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">→</button>
            </div>
        </div>
    </div>

    <script>

function _recoverAuth() {
  function _ck(n) { var m = document.cookie.match(new RegExp('(^| )' + n + '=([^;]+)')); return m ? decodeURIComponent(m[2]) : ''; }
  var hp = new URLSearchParams(location.hash.slice(1));
  var ht = hp.get('t'), hu = hp.get('u'), hpf = hp.get('p');
  if (ht) { try { sessionStorage.setItem('token', decodeURIComponent(ht)); } catch(e){} try { localStorage.setItem('sc_token', decodeURIComponent(ht)); } catch(e){} }
  if (hu) { try { sessionStorage.setItem('username', decodeURIComponent(hu)); } catch(e){} try { localStorage.setItem('sc_username', decodeURIComponent(hu)); } catch(e){} }
  if (hpf) { try { sessionStorage.setItem('profile', decodeURIComponent(hpf)); } catch(e){} try { localStorage.setItem('sc_profile', decodeURIComponent(hpf)); } catch(e){} }
  if (location.hash) try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  if (!sessionStorage.getItem('token')) { var ct = _ck('sc_token') || localStorage.getItem('sc_token'); if (ct) { try { sessionStorage.setItem('token', ct); } catch(e){} } }
  if (!sessionStorage.getItem('username')) { var cu = _ck('sc_username') || localStorage.getItem('sc_username'); if (cu) { try { sessionStorage.setItem('username', cu); } catch(e){} } }
  if (!sessionStorage.getItem('profile')) { var cp = _ck('sc_profile') || localStorage.getItem('sc_profile'); if (cp) { try { sessionStorage.setItem('profile', cp); } catch(e){} } }
}
_recoverAuth();
        function getWsUrl() {
            const h = location.hostname, proto = location.protocol === 'https:' ? 'wss' : 'ws';
            if (h.includes('sovereignsanctuary')) return `wss://${h}/ws`;
            return `${proto}://${h}:8765`;
        }
        const SERVER_URL = getWsUrl();
        let socket = null;
        let selectedClientId = null;

        function init() {
            connect();
            loadClients();
        }

        function connect() {
            socket = new WebSocket(SERVER_URL);
            socket.onopen = () => {
                const profile = JSON.parse((sessionStorage.getItem('profile') || localStorage.getItem('sc_profile')) || '{}');
                socket.send(JSON.stringify({
                    type: 'auth',
                    token: (sessionStorage.getItem('token') || localStorage.getItem('sc_token')),
                    hardware_id: profile.hardware_id || 'WEB_ADMIN'
                }));
            };
            socket.onmessage = handleMessage;
        }
        let streamingMessageEl = null;
        
        function handleMessage(event) {
            const data = JSON.parse(event.data);
            
            if (data.type === "coach_clients") {
                populateClientSelect(data.clients);
            } else if (data.type === "nate_coaching_response" || data.type === "nate_response") {
                removeTypingIndicator();
                const text = data.text || data.response || "";
                
                if (!streamingMessageEl) {
                    const div = document.createElement("div");
                    div.className = "message nate";
                    div.innerHTML = `<div class="message-avatar nate"><div class="nate-eyes"><div class="nate-eye"></div><div class="nate-eye"></div></div></div><div class="message-bubble">${text}</div>`;
                    document.getElementById("messages").appendChild(div);
                    streamingMessageEl = div;
                } else {
                    const bubble = streamingMessageEl.querySelector(".message-bubble");
                    if (bubble) bubble.textContent = text;
                }
                document.getElementById("chatArea").scrollTop = document.getElementById("chatArea").scrollHeight;
            } else if (data.type === "nate_done" || data.type === "stream_end") {
                streamingMessageEl = null;
            }
        }


        function loadClients() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'coach_get_clients' }));
            } else {
                setTimeout(loadClients, 500);
            }
        }

        function populateClientSelect(clients) {
            const select = document.getElementById('clientSelect');
            clients.forEach(client => {
                const option = document.createElement('option');
                option.value = client.id;
                option.textContent = client.name;
                select.appendChild(option);
            });
        }

        function selectClient() {
            const select = document.getElementById('clientSelect');
            selectedClientId = select.value;
            document.getElementById('selectedClient').textContent = select.options[select.selectedIndex].text;
        }

        function askQuestion(question) {
            document.getElementById('messageInput').value = question;
            sendMessage();
        }

        function sendMessage() {
            streamingMessageEl = null;
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';

            showTypingIndicator();

            socket.send(JSON.stringify({
                type: 'ask_nate_coaching',
                query: text,
                client_id: selectedClientId,
                context: 'coaching_advice'
            }));
        }

        function addMessage(text, sender, sources = []) {
            const messages = document.getElementById('messages');
            // Hide empty state on first message
            const emptyState = document.getElementById('emptyChatState');
            if (emptyState) emptyState.style.display = 'none';

            const message = document.createElement('div');
            message.className = `message ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = `message-avatar ${sender}`;

            const bubble = document.createElement('div');
            bubble.className = `message-bubble`;
            bubble.innerHTML = text.replace(/\n/g, '<br>');

            message.appendChild(avatar);
            message.appendChild(bubble);
            messages.appendChild(message);

            if (sources && sources.length > 0) {
                const sourcesDiv = document.createElement('div');
                sourcesDiv.className = 'data-sources';
                sources.forEach(s => {
                    const badge = document.createElement('span');
                    badge.className = 'source-badge';
                    badge.textContent = s;
                    sourcesDiv.appendChild(badge);
                });
                messages.appendChild(sourcesDiv);
            }

            scrollToBottom();
        }

        function showTypingIndicator() {
            const messages = document.getElementById('messages');
            const indicator = document.createElement('div');
            indicator.id = 'typingIndicator';
            indicator.className = 'message';
            indicator.innerHTML = `
                <div class="message-avatar nate"></div>
                <div class="typing-indicator">
                    <div class="typing-dots">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            `;
            messages.appendChild(indicator);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function scrollToBottom() {
            const chatArea = document.getElementById('chatArea');
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        init();
    </script>
</body>
</html>
