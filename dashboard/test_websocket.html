<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #0A0A0A; color: #00FF88; }
        .log { margin: 5px 0; padding: 8px; background: #1A1A1A; border-left: 3px solid #00FF88; }
        .error { border-left-color: #FF3B3B; color: #FF3B3B; }
        .success { border-left-color: #00FF88; color: #00FF88; }
        .warning { border-left-color: #FFD700; color: #FFD700; }
        button { padding: 10px 20px; background: #9D4EDD; color: white; border: none; cursor: pointer; margin: 5px; border-radius: 6px; }
        button:hover { background: #7B2EBD; }
        h1 { color: #9D4EDD; }
    </style>
</head>
<body>
    <h1>🔬 Nevedal Lab - WebSocket Connection Test</h1>
    <button onclick="testConnection()">🔌 Test Connection</button>
    <button onclick="testLogin()">🔐 Test Login</button>
    <buttlick="testNevedalSubscribe()">📡 Test Nevedal Subscribe</button>
    <button onclick="clearLogs()">🗑️ Clear Logs</button>
    <hr>
    <div id="logs"></div>

    <script>
        let ws = null;
        let authenticated = false;

        function log(message, type = 'log') {
            const div = document.createElement('div');
            div.className = type;
            const time = new Date().toLocaleTimeString();
            div.textContent = `[${time}] ${message}`;
            document.getElementById('logs').appendChild(div);
            console.log(message);
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        function testConnection() {
            log('🔌 Attempting WebSocket connection to wss://api.sovereignsanctuary.net/ws...', 'log');
            
            try {
                ws = new WebSocket('wss://api.sovereignsanctuary.net/ws');
                
                ws.onopen = function() {
                    log('✅ WebSocket CONNECTED succes'success');
                    log('   Ready to send messages', 'success');
                };
                
                ws.onmessage = function(event) {
                    log('📩 Received message from server', 'success');
                    try {
                        const data = JSON.parse(event.data);
                        log(`   Type: ${data.type}`, 'log');
                        log(`   Data: ${JSON.stringify(data, null, 2)}`, 'log');
                        
                        if (data.type === 'login_success' || data.type === 'auth_success') {
                            authenticated = true;
                            log('🔓 Authentication successful!', 'success');
                        }
                    } catch(e) {
                        log(`   Raw: ${event.data}`, 'log');
                    }
                };
                
                ws.onerror = function(error) {
                    log('❌ WebSocket ERROR occurred', 'error');
                      Check that backend is running on port 8765', 'error');
                    console.error('WebSocket error:', error);
                };
                
                ws.onclose = function() {
                    log('⚠️  WebSocket connection CLOSED', 'warning');
                    authenticated = false;
                };
            } catch(e) {
                log(`❌ Failed to create WebSocket: ${e.message}`, 'error');
            }
        }

        function testLogin() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('❌ WebSocket not connected! Click "Test Connection" first.', 'error');
                return;
            }
            
            log('🔐 Sending login request for admin1...', 'log');
            
            const loginRequest = {
                type: 'login_request',
                username: 'admin1',
                password: 'admin123',
                expected_role: 'ADMIN',
                hardware_id: 'WEB_ADMIN'
            };
  
            ws.send(JSON.stringify(loginRequest));
            log('✉️  Login request sent', 'log');
        }

        function testNevedalSubscribe() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('❌ WebSocket not connected! Click "Test Connection" first.', 'error');
                return;
            }
            
            if (!authenticated) {
                log('⚠️  Not authenticated! Click "Test Login" first.', 'warning');
                return;
            }
            
            log('📡 Sending Nevedal subscribe request...', 'log');
            
            const subscribeRequest = {
                type: 'nevedal_subscribe',
                user_id: 'CLIENT_EMMA_ID'
            };
            
            ws.send(JSON.stringify(subscribeRequest));
            log('✉️  Subscribe request sent', 'log');
        }

        // Auto-start test
        window.onload = function() {
            log('🚀 WebSocket Tester initialized', 'log');
   lick "Test Connection" to begin', 'log');
            setTimeout(() => {
                log('🔄 Auto-testing connection...', 'log');
                testConnection();
            }, 1000);
        };
    </script>
</body>
</html>
