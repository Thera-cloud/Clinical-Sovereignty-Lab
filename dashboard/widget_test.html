<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Widget Preview</title>
<style>
body{background:#050505;color:#E8D5A3;font-family:'DM Sans',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{width:320px;border-radius:16px;overflow:hidden;border:1px solid rgba(201,169,98,.4);text-align:center}
.card img{width:100%;max-height:200px;object-fit:cover}
.card .body{padding:20px}
.primary{font-size:16px;font-weight:600;margin:8px 0}
.secondary{font-size:13px;color:#8B7355}
.type{font-size:11px;color:#4ECDC4;text-transform:uppercase;letter-spacing:1px}
.err{color:#EF4444;padding:40px}
</style></head><body>
<div id="root"><p>Loading widget...</p></div>
<script>
(function(){
  var t=sessionStorage.getItem('sc_token')||localStorage.getItem('sc_token')||'';
  if(!t){document.getElementById('root').innerHTML='<p class="err">No auth token. Log in to Sovereign Command first.</p>';return;}
  var api=(location.origin.indexOf('command.')>=0?location.origin.replace('command.','api.'):location.origin);
  fetch(api+'/api/sse-client/widget',{headers:{'Authorization':'Bearer '+t}})
    .then(function(r){return r.json()})
    .then(function(d){
      var h='<div class="card" style="background:'+d.background_color+'">';
      if(d.image_url) h+='<img src="'+d.image_url+'" alt="panel">';
      h+='<div class="body"><div class="type">'+d.type+'</div><div class="primary">'+d.primary_text+'</div>';
      if(d.secondary_text) h+='<div class="secondary">'+d.secondary_text+'</div>';
      h+='</div></div>';
      document.getElementById('root').innerHTML=h;
    })
    .catch(function(e){document.getElementById('root').innerHTML='<p class="err">'+e+'</p>';});
})();
</script></body></html>
