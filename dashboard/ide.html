<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign IDE | Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #050505;
            --gold: #C9A962;
            --gold-bright: #E8D5A3;
            --muted: #5a5850;
            --red: #EF4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 20%, #1a1810 0%, var(--void) 55%);
            color: var(--gold-bright);
            font-family: 'DM Sans', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gate {
            text-align: center;
            max-width: 420px;
            padding: 40px 28px;
        }
        .brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 36px;
            letter-spacing: 3px;
            color: var(--gold);
            margin-bottom: 8px;
        }
        .sub {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        button {
            padding: 16px 40px;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            letter-spacing: 1.5px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.25s, color 0.25s;
        }
        button:hover { background: rgba(201, 169, 98, 0.12); }
        button:disabled { opacity: 0.5; cursor: wait; }
        #status { margin-top: 20px; min-height: 22px; font-size: 12px; color: var(--muted); }
        .back {
            display: inline-block;
            margin-top: 28px;
            color: var(--muted);
            font-size: 12px;
            text-decoration: none;
        }
        .back:hover { color: var(--gold); }
    </style>
</head>
<body>
    <div class="gate">
        <div class="brand">SOVEREIGN IDE</div>
        <p class="sub">Admin gateway. Tap YubiKey, then open the Mac code-server at ide.sovereignsanctuary.net. Cloudflare Access still applies on the IDE host.</p>
        <button id="ykBtn" type="button">Tap YubiKey to Open IDE</button>
        <div id="status"></div>
        <a class="back" href="command.html">← Sovereign Command</a>
    </div>
    <script>
        // Same-origin /api via command nginx (matches command.html). Do NOT use api.* here — CORS → Failed to fetch.
        var IDE_URL = 'https://ide.sovereignsanctuary.net';

        function _cookie(name) {
            try {
                var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
                return m ? decodeURIComponent(m[1]) : '';
            } catch (e) { return ''; }
        }

        function _recoverAuth() {
            try {
                var hash = (location.hash || '').replace(/^#/, '');
                if (hash) {
                    var params = new URLSearchParams(hash);
                    var ht = params.get('t');
                    if (ht) {
                        sessionStorage.setItem('token', ht);
                        localStorage.setItem('sc_token', ht);
                    }
                }
            } catch (e) {}
            try {
                if (!sessionStorage.getItem('token')) {
                    var t = localStorage.getItem('sc_token') || _cookie('sc_token') || '';
                    if (t) sessionStorage.setItem('token', t);
                }
            } catch (e) {}
        }

        function _token() {
            try {
                return sessionStorage.getItem('token')
                    || localStorage.getItem('sc_token')
                    || _cookie('sc_token')
                    || '';
            } catch (e) { return ''; }
        }

        function _scB64toBuffer(b64) {
            var s = String(b64 || '').replace(/-/g, '+').replace(/_/g, '/');
            while (s.length % 4) s += '=';
            var bin = atob(s);
            var buf = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
            return buf.buffer;
        }

        function _scBufferToB64(buf) {
            var bytes = new Uint8Array(buf);
            var s = '';
            for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
            return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
        }

        async function _scApiPost(path, body) {
            var t = _token();
            try {
                var resp = await fetch(path, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + t,
                    },
                    body: JSON.stringify(body || {}),
                });
                if (!resp.ok) {
                    var errText = '';
                    try {
                        var ej = await resp.json();
                        errText = ej.detail || JSON.stringify(ej);
                    } catch (e2) {
                        errText = resp.statusText;
                    }
                    return { _error: true, status: resp.status, detail: errText };
                }
                return await resp.json();
            } catch (e) {
                return { _error: true, status: 0, detail: e.message || 'Failed to fetch' };
            }
        }

        function _openIde() {
            window.location.href = IDE_URL;
        }

        async function verifyAndRedirect() {
            var btn = document.getElementById('ykBtn');
            var status = document.getElementById('status');
            _recoverAuth();

            if (!_token()) {
                status.textContent = 'No admin session. Open Command, log in, then use the IDE tab.';
                status.style.color = 'var(--red)';
                return;
            }
            if (!window.PublicKeyCredential) {
                status.textContent = 'WebAuthn not supported in this browser.';
                status.style.color = 'var(--red)';
                return;
            }

            // Already verified this browser session (Command gate) — open IDE.
            try {
                if (sessionStorage.getItem('sc_yubikey_verified') === 'true') {
                    status.textContent = 'Already verified. Opening IDE...';
                    status.style.color = '#22C55E';
                    _openIde();
                    return;
                }
            } catch (e) {}

            btn.disabled = true;
            status.textContent = 'Requesting challenge...';
            status.style.color = 'var(--gold)';

            try {
                var optionsResp = await _scApiPost('/api/admin/webauthn/auth-options', {});
                if (!optionsResp || optionsResp._error || !optionsResp.options) {
                    var msg = 'Failed to get auth challenge.';
                    if (optionsResp && optionsResp._error) {
                        msg += ' (' + optionsResp.status + ': ' + (optionsResp.detail || 'unknown') + ')';
                        if (optionsResp.status === 0) {
                            msg += ' — use Command IDE tab (same-origin /api), not a direct file open.';
                        }
                    }
                    status.textContent = msg;
                    status.style.color = 'var(--red)';
                    btn.disabled = false;
                    return;
                }

                var options = optionsResp.options;
                options.challenge = _scB64toBuffer(options.challenge);
                if (options.allowCredentials) {
                    options.allowCredentials = options.allowCredentials.map(function (c) {
                        return Object.assign({}, c, { id: _scB64toBuffer(c.id) });
                    });
                }

                status.textContent = 'Touch your YubiKey now...';
                btn.textContent = 'Waiting for key...';

                var credential = await navigator.credentials.get({ publicKey: options });
                var assertion = {
                    id: credential.id,
                    rawId: _scBufferToB64(credential.rawId),
                    type: credential.type,
                    response: {
                        clientDataJSON: _scBufferToB64(credential.response.clientDataJSON),
                        authenticatorData: _scBufferToB64(credential.response.authenticatorData),
                        signature: _scBufferToB64(credential.response.signature),
                    },
                };

                status.textContent = 'Verifying...';
                var result = await _scApiPost('/api/admin/webauthn/auth-verify', { credential: assertion });
                if (result && !result._error && result.verified) {
                    try { sessionStorage.setItem('sc_yubikey_verified', 'true'); } catch (e) {}
                    status.textContent = 'Verified. Opening IDE...';
                    status.style.color = '#22C55E';
                    setTimeout(_openIde, 400);
                } else {
                    var vmsg = 'Key verification failed.';
                    if (result && result._error) {
                        vmsg += ' (' + result.status + ': ' + (result.detail || 'unknown') + ')';
                    }
                    status.textContent = vmsg;
                    status.style.color = 'var(--red)';
                    btn.disabled = false;
                    btn.textContent = 'Tap YubiKey to Open IDE';
                }
            } catch (err) {
                if (err && err.name === 'NotAllowedError') {
                    status.textContent = 'Verification cancelled.';
                    status.style.color = 'var(--muted)';
                } else {
                    status.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
                    status.style.color = 'var(--red)';
                }
                btn.disabled = false;
                btn.textContent = 'Tap YubiKey to Open IDE';
            }
        }

        _recoverAuth();
        document.getElementById('ykBtn').addEventListener('click', verifyAndRedirect);

        // Auto-open if already YubiKey-verified in this Command session
        try {
            if (_token() && sessionStorage.getItem('sc_yubikey_verified') === 'true') {
                document.getElementById('status').textContent = 'Session verified. Tap to open IDE, or wait…';
                setTimeout(function () {
                    if (sessionStorage.getItem('sc_yubikey_verified') === 'true') _openIde();
                }, 1200);
            }
        } catch (e) {}
    </script>
</body>
</html>
