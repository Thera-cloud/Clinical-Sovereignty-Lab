<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign IDE | Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #050505;
            --gold: #C9A962;
            --gold-bright: #E8D5A3;
            --muted: #5a5850;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 20%, #1a1810 0%, var(--void) 55%);
            color: var(--gold-bright);
            font-family: 'DM Sans', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gate {
            text-align: center;
            max-width: 420px;
            padding: 40px 28px;
        }
        .brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 36px;
            letter-spacing: 3px;
            color: var(--gold);
            margin-bottom: 8px;
        }
        .sub {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        button {
            padding: 16px 40px;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            letter-spacing: 1.5px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.25s, color 0.25s;
        }
        button:hover { background: rgba(201, 169, 98, 0.12); }
        button:disabled { opacity: 0.5; cursor: wait; }
        #status { margin-top: 20px; min-height: 22px; font-size: 12px; color: var(--muted); }
        .back {
            display: inline-block;
            margin-top: 28px;
            color: var(--muted);
            font-size: 12px;
            text-decoration: none;
        }
        .back:hover { color: var(--gold); }
    </style>
</head>
<body>
    <div class="gate">
        <div class="brand">SOVEREIGN IDE</div>
        <p class="sub">Admin gateway. Tap YubiKey, then open the Mac code-server at ide.sovereignsanctuary.net. Cloudflare Access still applies on the IDE host.</p>
        <button id="ykBtn" type="button">Tap YubiKey to Open IDE</button>
        <div id="status"></div>
        <a class="back" href="command.html">← Sovereign Command</a>
    </div>
    <script>
        var IDE_URL = 'https://ide.sovereignsanctuary.net';
        var API = (typeof window !== 'undefined' && window.location && window.location.origin.indexOf('localhost') >= 0)
            ? 'http://localhost:8000'
            : 'https://api.sovereignsanctuary.net';

        function _token() {
            try {
                return sessionStorage.getItem('token')
                    || localStorage.getItem('sc_token')
                    || '';
            } catch (e) { return ''; }
        }

        function _authHeaders(ct) {
            var h = { 'Authorization': 'Bearer ' + _token() };
            if (ct) h['Content-Type'] = ct;
            return h;
        }

        function bufferToBase64url(buf) {
            var bytes = new Uint8Array(buf);
            var str = '';
            for (var i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
            return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function base64urlToBuffer(s) {
            var pad = '='.repeat((4 - (s.length % 4)) % 4);
            var b64 = (s + pad).replace(/-/g, '+').replace(/_/g, '/');
            var raw = atob(b64);
            var buf = new ArrayBuffer(raw.length);
            var view = new Uint8Array(buf);
            for (var i = 0; i < raw.length; i++) view[i] = raw.charCodeAt(i);
            return buf;
        }

        async function apiPost(path, body) {
            var resp = await fetch(API + path, {
                method: 'POST',
                headers: _authHeaders('application/json'),
                body: JSON.stringify(body || {}),
            });
            var text = await resp.text();
            var data = null;
            try { data = text ? JSON.parse(text) : null; } catch (e) { data = { raw: text }; }
            if (!resp.ok) throw new Error((data && (data.detail || data.error)) || ('HTTP ' + resp.status));
            return data;
        }

        async function verifyAndRedirect() {
            var btn = document.getElementById('ykBtn');
            var status = document.getElementById('status');
            if (!_token()) {
                status.textContent = 'No admin session. Open Command and log in first.';
                return;
            }
            btn.disabled = true;
            status.textContent = 'Requesting challenge...';
            try {
                var optionsResp = await apiPost('/api/admin/webauthn/auth-options', {});
                var publicKey = optionsResp.publicKey || optionsResp;
                publicKey.challenge = base64urlToBuffer(publicKey.challenge);
                if (publicKey.allowCredentials) {
                    publicKey.allowCredentials = publicKey.allowCredentials.map(function (c) {
                        return Object.assign({}, c, { id: base64urlToBuffer(c.id) });
                    });
                }
                status.textContent = 'Touch your YubiKey now...';
                var cred = await navigator.credentials.get({ publicKey: publicKey });
                var assertion = {
                    id: cred.id,
                    rawId: bufferToBase64url(cred.rawId),
                    type: cred.type,
                    response: {
                        authenticatorData: bufferToBase64url(cred.response.authenticatorData),
                        clientDataJSON: bufferToBase64url(cred.response.clientDataJSON),
                        signature: bufferToBase64url(cred.response.signature),
                        userHandle: cred.response.userHandle
                            ? bufferToBase64url(cred.response.userHandle)
                            : null,
                    },
                };
                await apiPost('/api/admin/webauthn/auth-verify', { credential: assertion });
                status.textContent = 'Verified. Opening IDE...';
                window.location.href = IDE_URL;
            } catch (e) {
                status.textContent = String(e.message || e);
                btn.disabled = false;
            }
        }

        document.getElementById('ykBtn').addEventListener('click', verifyAndRedirect);
    </script>
</body>
</html>
