        .member-metric { font-family: var(--font-mono); font-size: 11px; color: var(--cyan); }
        .pmb-badge { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; }
        .pmb-badge.minimizer { background: rgba(255,149,0,0.15); color: #FF9500; }
        .pmb-badge.amplifier { background: rgba(255,59,59,0.15); color: #FF3B3B; }
        .pmb-badge.normalizer { background: rgba(0,255,136,0.1); color: #00FF88; }
        .pmb-badge.calibrating { background: rgba(136,136,136,0.15); color: #888; }

        .var-ref-toggle:hover { border-color: var(--cyan); background: var(--cyan-dim); }
        .var-ref-toggle.active { border-color: var(--cyan); background: var(--cyan-dim); }
        .var-ref-panel { position: fixed; left: 0; top: 0; bottom: 0; width: 280px; z-index: 899; background: rgba(10,10,10,0.95); border-right: 1px solid var(--border); backdrop-filter: blur(10px); transform: translateX(-100%); transition: transform 0.25s ease; overflow-y: auto; padding-top: 50px; }
        .var-ref-panel.open { transform: translateX(0); }
        .var-ref-panel-header { position: sticky; top: 0; padding: 12px 16px 8px; background: rgba(10,10,10,0.98); border-bottom: 1px solid var(--border); z-index: 1; }
        .var-ref-panel-header span { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 700; }
        .var-ref-panel-close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; line-height: 1; }
        .var-ref-panel-close:hover { color: var(--text-primary); }
        .var-ref-content { display: grid; gap: 6px; padding: 10px 16px 20px; }

        .overlay.open { display: block; }
        .overlay-content { max-width: 800px; margin: 40px auto; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 12px; padding: 24px; position: relative; }

        .overlay-close:hover { color: var(--text-primary); }
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
        .dist-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .dist-label { width: 80px; font-size: 10px; text-align: right; color: var(--text-secondary); font-weight: 600; }

        .coherence-bar { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
        .coherence-bar .cb-name { width: 80px; font-size: 11px; font-weight: 600; }
        .coherence-bar .cb-track { flex: 1; height: 20px; background: var(--bg-dark); border-radius: 4px; overflow: hidden; }

        .info-value { font-family: var(--font-mono); }
        .pmb-section { margin-bottom: 14px; }
        .pmb-section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--purple); font-weight: 700; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
        .pmb-meter { height: 6px; background: var(--bg-dark); border-radius: 3px; overflow: hidden; margin: 4px 0 8px 0; }
        .pmb-meter-fill { height: 100%; border-radius: 3px; }
        details summary { cursor: pointer; color: var(--cyan); font-size: 11px; padding: 6px 20px; }
        details summary:hover { color: var(--gold-text); }
        .globe-global-score { position: absolute; bottom: 16px; left: 16px; background: rgba(10,10,10,0.85); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; z-index: 10; }

        .globe-global-score .ggs-value { font-size: 28px; font-weight: 700; font-family: var(--font-mono); }
    </style>
</head>

<div class="header">
    <h1>PMB Command Center</h1>
    <div class="header-right">
        <button class="hdr-btn" onclick="openQueueOverlay()">Queue <span class="badge zero" id="queueBadge">0</span></button>

</div>

    var vars = _currentMode === 'pmb' ? PMB_VARS : _currentMode === 'stats' ? STATS_VARS : [];
    vars.forEach(function(v) {
        var opt = document.createElement('option');
        opt.value = v.key; opt.textContent = v.label;
        sel.appendChild(opt);
    });
    if (vars.length > 0) _currentVar = vars[0].key;
    sel.style.display = _currentMode === 'coherence' ? 'none' : '';
}

function setMode(m) {
    _currentMode = m;
    document.getElementById('modePmb').className = 'fb-btn' + (m === 'pmb' ? ' active' : '');
    document.getElementById('modeStats').className = 'fb-btn' + (m === 'stats' ? ' active' : '');
    document.getElementById('modeCoherence').className = 'fb-btn' + (m === 'coherence' ? ' active' : '');
    document.getElementById('globalScoreBox').style.display = m === 'coherence' ? '' : 'none';
    populateVarSelect();
    renderAggregate();
    renderMemberList();
    updateGlobeColors();
}

function getClientVar(c, key) {
    if (_currentMode === 'pmb') return c.pmb ? c.pmb[key] : null;
    if (_currentMode === 'stats') return c.stats ? c.stats[key] : null;
    return null;
}

function pointColor(c) {
    if (_currentMode === 'coherence') return '#00D4FF';
    var val = getClientVar(c, _currentVar);
    if (val == null) return '#333';
    if (_currentVar === 'reactivity_type') return REACT_COLORS[String(val).toUpperCase()] || '#888';
    if (_currentVar === 'crisis_baseline') return BASELINE_COLORS[String(val).toUpperCase()] || '#888';
    var varDef = (_currentMode === 'pmb' ? PMB_VARS : STATS_VARS).filter(function(v) { return v.key === _currentVar; })[0];
    return colorScale(val, varDef && varDef.invert);
}

function heatWeight(c) {
    if (_currentMode === 'coherence') return 0.5;
    var val = getClientVar(c, _currentVar);
    if (val == null) return 0.15;
    if (typeof val === 'string') return 0.4;
    return Math.max(0.1, Math.min(1.0, Math.abs(parseFloat(val))));
}

function heatColorFn() {
    var varDef = (_currentMode === 'pmb' ? PMB_VARS : STATS_VARS).filter(function(v) { return v.key === _currentVar; })[0];
    var invert = varDef && varDef.invert;
    if (_currentMode === 'coherence') return function(t) { return 'rgba(0, 212, 255, ' + t + ')'; };
    if (invert) return function(t) { return 'rgba(255, ' + Math.round(80 * (1 - t)) + ', ' + Math.round(60 * (1 - t)) + ', ' + t + ')'; };
    return function(t) { return 'rgba(' + Math.round(60 * (1 - t)) + ', ' + Math.round(255 * t) + ', ' + Math.round(100 * t) + ', ' + t + ')'; };
}

function initGlobe() {
    var container = document.getElementById('globeContainer');
    var w = container.clientWidth || 600;
    var h = container.clientHeight || 500;
    _globe = Globe()(container)
        .width(w)
        .height(h)
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('#050505')
        .atmosphereColor('rgba(0, 212, 255, 0.15)')
        .atmosphereAltitude(0.2)
        .pointsData([])
        .pointLat('lat').pointLng('lng')
        .pointColor(function(d) { return pointColor(d); })
        .pointAltitude(0.02)
        .pointRadius(function(d) { return d.has_pmb ? 0.4 : 0.25; })
        .pointLabel(function(d) {
            var val = getClientVar(d, _currentVar);
            var vStr = val != null ? (typeof val === 'number' ? fmtDec(val, 2) : val) : 'N/A';
            var src = d.geo_source === 'ip' ? 'IP' : d.geo_source === 'timezone' ? 'TZ' : d.geo_source === 'state' ? 'State' : 'approx';
            return '<div style="font-family:DM Sans;font-size:12px;background:rgba(10,10,10,0.92);padding:8px 12px;border-radius:8px;border:1px solid #333;max-width:220px;">' +
                '<b style="color:#C9A962;">' + esc(d.name) + '</b><br>' +
                '<span style="color:#888;">' + _currentVar.replace(/_/g, ' ') + ':</span> ' + vStr +
                '<br><span style="color:#555;font-size:10px;">loc: ' + src + (d.city ? ' \u2022 ' + esc(d.city) : '') + '</span></div>';
        })
        .onPointClick(function(d) { selectMember(d.hardware_id); })
        .enablePointerInteraction(true)
        .heatmapsData([])
        .heatmapPointLat('lat')
        .heatmapPointLng('lng')
        .heatmapPointWeight('w')
        .heatmapTopAltitude(0.15)
        .heatmapBandwidth(3.5)
        .heatmapColorFn(heatColorFn());

    _globe.controls().autoRotate = true;
    _globe.controls().autoRotateSpeed = 0.3;
    container.addEventListener('mousedown', function() { _globe.controls().autoRotate = false; });

    window.addEventListener('resize', function() {
        if (_globe) {
            _globe.width(container.clientWidth || 600);
            _globe.height(container.clientHeight || 500);
        }
    });
}

function updateHeatmap() {
    if (!_globe) return;
    if (!_showHeatmap) { _globe.heatmapsData([]); return; }
    var pts = _filteredClients.filter(function(c) { return c.lat != null && c.lng != null; });
    var heatPts = pts.map(function(c) { return { lat: c.lat, lng: c.lng, w: heatWeight(c) }; });
    _globe.heatmapColorFn(heatColorFn());
    _globe.heatmapsData(heatPts.length > 0 ? [heatPts] : []);
}

function updateGlobeData() {
    if (!_globe || !_geoData) return;
    var pts = _filteredClients.filter(function(c) { return c.lat != null && c.lng != null; });
    _globe.pointsData(pts);
    updateHeatmap();

    if (_showCoaches && _geoData.coaches) {
        var coaches = _geoData.coaches.filter(function(c) { return c.lat != null && c.lng != null; });
        _globe.customLayerData(coaches)
            .customThreeObject(function(d) {
                var geo = new THREE.SphereGeometry(0.6, 8, 8);
                var mat = new THREE.MeshBasicMaterial({ color: '#FFD700' });
                return new THREE.Mesh(geo, mat);
            })
            .customThreeObjectUpdate(function(obj, d) {
                Object.assign(obj.position, _globe.getCoords(d.lat, d.lng, 0.02));
            });
    } else {
        _globe.customLayerData([]);
    }
}

function updateGlobeColors() {
    if (!_globe) return;
    _globe.pointColor(function(d) { return pointColor(d); });
    updateHeatmap();
}

function zoomToGroup(clients) {
    if (!_globe || !clients || clients.length === 0) return;
    var locs = clients.filter(function(c) { return c.lat != null; });
    if (locs.length === 0) return;
    var lat = 0, lng = 0;
    locs.forEach(function(c) { lat += c.lat; lng += c.lng; });
    lat /= locs.length; lng /= locs.length;
    var alt = locs.length <= 3 ? 1.2 : locs.length <= 10 ? 1.8 : 2.5;
    _globe.pointOfView({ lat: lat, lng: lng, altitude: alt }, 1000);
}

function toggleProjection() {
    _is3D = !_is3D;
    document.getElementById('toggleProj').textContent = _is3D ? 'Flat Map' : '3D Globe';
    if (_is3D) { _globe.projectionType(null); } else { _globe.projectionType('naturalEarth1'); }
}
function toggleHeatmap() {
    _showHeatmap = !_showHeatmap;
    document.getElementById('toggleHeat').className = 'fb-btn' + (_showHeatmap ? ' active' : '');
    updateHeatmap();
}
function toggleCoachOverlay() {
    _showCoaches = !_showCoaches;
    document.getElementById('toggleCoach').className = 'fb-btn' + (_showCoaches ? ' active' : '');
    updateGlobeData();
}

function onVarChange() { _currentVar = document.getElementById('varSelect').value; updateGlobeColors(); renderMemberList(); }

function onIdTypeChange() {
    var type = document.getElementById('idType').value;
    var picker = document.getElementById('idPicker');
    if (type === 'all') { picker.style.display = 'none'; applyFilter('all', null); return; }
    picker.style.display = '';
    picker.innerHTML = '<option value="">-- select --</option>';
    var clients = (_geoData && _geoData.clients) || [];
    var opts = [];
    if (type === 'coach') {
        var seen = {};
        clients.forEach(function(c) { var cn = c.coach_name || c.coach_id || ''; if (cn && !seen[cn]) { seen[cn] = true; opts.push(cn); } });
    } else if (type === 'family') {
        var seen2 = {};
        clients.forEach(function(c) { var f = c.family_id; if (f && !seen2[f]) { seen2[f] = true; opts.push(f); } });
    } else if (type === 'group') {
        var seen3 = {};
        clients.forEach(function(c) { (c.group_names || []).forEach(function(g) { if (g && !seen3[g]) { seen3[g] = true; opts.push(g); } }); });
    } else if (type === 'company') {
        var seen4 = {};
        clients.forEach(function(c) { var co = c.company_id; if (co && !seen4[co]) { seen4[co] = true; opts.push(co); } });
    } else if (type === 'individual') {
        clients.forEach(function(c) { opts.push(c.name || c.username); });
    }
    opts.sort();
    opts.forEach(function(o) { var el = document.createElement('option'); el.value = o; el.textContent = o; picker.appendChild(el); });
}

function onIdPick() {
    var type = document.getElementById('idType').value;
    var val = document.getElementById('idPicker').value;
    if (!val) { applyFilter('all', null); return; }
    applyFilter(type, val);
}

function applyFilter(type, val) {
    var clients = (_geoData && _geoData.clients) || [];
    if (type === 'all' || !val) { _filteredClients = clients; }
    else if (type === 'coach') { _filteredClients = clients.filter(function(c) { return (c.coach_name || c.coach_id) === val; }); }
    else if (type === 'family') { _filteredClients = clients.filter(function(c) { return c.family_id === val; }); }
    else if (type === 'group') { _filteredClients = clients.filter(function(c) { return (c.group_names || []).indexOf(val) >= 0; }); }
    else if (type === 'company') { _filteredClients = clients.filter(function(c) { return c.company_id === val; }); }
    else if (type === 'individual') { _filteredClients = clients.filter(function(c) { return (c.name || c.username) === val; }); }
    updateGlobeData();
    zoomToGroup(_filteredClients);
    renderAggregate();
    renderMemberList();
    _selectedHwId = null;
    document.getElementById('detailBox').style.display = 'none';
    document.getElementById('wisdomSection').style.display = '';
}

function renderAggregate() {
    var el = document.getElementById('aggregateGrid');
    var list = _filteredClients;
    if (_currentMode === 'pmb') {
        var withPmb = list.filter(function(c) { return c.has_pmb; });
        var avgRecon = 0, avgShame = 0;
        withPmb.forEach(function(c) { avgRecon += (c.pmb && c.pmb.reconsolidation_readiness) || 0; avgShame += (c.pmb && c.pmb.shame_index) || 0; });
        avgRecon /= Math.max(withPmb.length, 1); avgShame /= Math.max(withPmb.length, 1);
        el.innerHTML = sc(list.length, 'Clients', '') + sc(withPmb.length, 'With PMB', 'var(--cyan)') + sc(fmtPct(avgRecon), 'Avg Reconsolidation', colorScale(avgRecon)) + sc(fmtPct(avgShame), 'Avg Shame', colorScale(avgShame, true));
    } else if (_currentMode === 'stats') {
        var withS = list.filter(function(c) { return c.stats; });
        var tot = { c: 0, g: 0, q: 0, a: 0, s: 0, e: 0, b: 0 };
        withS.forEach(function(c) { var s = c.stats; tot.c += s.c_emo || 0; tot.g += s.gap || 0; tot.q += s.quantum || 0; tot.a += s.anxiety_level || 0; tot.s += s.stress_level || 0; tot.e += s.engagement || 0; tot.b += s.breakthrough_count || 0; });
        var n = Math.max(withS.length, 1);
        el.innerHTML = sc(list.length, 'Clients', '') + sc(fmtDec(tot.c / n, 3), 'Avg C_emo', colorScale(tot.c / n)) + sc(fmtDec(tot.g / n, 3), 'Avg GAP', colorScale(tot.g / n)) + sc(fmtDec(tot.q / n, 3), 'Avg Quantum', colorScale(tot.q / n)) + sc(fmtDec(tot.a / n, 2), 'Avg Anxiety', colorScale(tot.a / n, true)) + sc(tot.b, 'Breakthroughs', 'var(--gold)');
    } else if (_currentMode === 'coherence') {
        var idType = document.getElementById('idType').value;
        if (idType === 'individual' && list.length === 1) {
            var c = list[0];
            var eng = c.engagement || {};
            el.innerHTML = sc(fmtDec(eng.engagement_score, 2) || '0.00', 'Engagement', colorScale(eng.engagement_score || 0)) +
                sc(eng.tokens_used ? eng.tokens_used.toLocaleString() : '0', 'Tokens Used', 'var(--cyan)') +
                sc(eng.login_count || 0, 'Logins', 'var(--gold)') +
                sc(eng.days_since_last_login != null ? eng.days_since_last_login + 'd' : '--', 'Last Active', eng.days_since_last_login < 3 ? 'var(--green)' : 'var(--orange)');
        } else if (_coherenceData) {
            var html = '';
            (_coherenceData.layers || []).forEach(function(l) {
                var col = colorScale(l.score);
                var extra = l.client_count ? ' (' + l.client_count + ' clients)' : l.family_count ? ' (' + l.family_count + ' families)' : l.group_count ? ' (' + l.group_count + ' groups)' : '';
                html += '<div class="coherence-bar"><div class="cb-name">' + l.name + '<span style="color:var(--text-muted);font-size:9px;">' + extra + '</span></div><div class="cb-track"><div class="cb-fill" style="width:' + (l.score * 100) + '%;background:' + col + ';"></div></div><div class="cb-val" style="color:' + col + ';">' + fmtDec(l.score, 3) + '</div></div>';
            });
            var b = _coherenceData.latest_briefing;
            if (b) {
                html += '<div style="margin-top:12px;padding:10px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;">';
                html += '<div style="font-size:10px;color:var(--gold);font-weight:600;margin-bottom:4px;">LATEST BRIEFING</div>';
                if (b.gap_analysis) html += '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:4px;">' + esc(b.gap_analysis) + '</div>';
                if (b.recommendations && b.recommendations.length) {
                    html += '<div style="font-size:10px;color:var(--cyan);margin-top:4px;">Recommendations:</div>';
                    b.recommendations.forEach(function(r) { html += '<div style="font-size:10px;color:var(--text-secondary);padding-left:8px;">\u2022 ' + esc(r) + '</div>'; });
                }
                if (b.generated_at) html += '<div style="font-size:9px;color:var(--text-muted);margin-top:4px;">' + timeAgo(b.generated_at) + '</div>';
                html += '</div>';
            }
            el.innerHTML = html;
        }
    }
}

function sc(val, label, color) {
    return '<div class="stat-card"><div class="stat-val" style="color:' + (color || 'var(--text-primary)') + ';">' + val + '</div><div class="stat-lbl">' + label + '</div></div>';
}

function renderMemberList() {
    var el = document.getElementById('memberList');
    var list = _filteredClients;
    var idType = document.getElementById('idType').value;
    if (_currentMode === 'coherence' && _coherenceData && (idType === 'all' || idType === 'family')) {
        var html = '';
        (_coherenceData.families || []).forEach(function(f) {
            html += '<div class="member-row" onclick="selectFamily(\'' + esc(f.family_id) + '\')"><span class="member-name">Family: ' + esc(f.family_id) + ' (' + f.member_count + ')</span><span class="member-metric">' + fmtDec(f.s2, 3) + '</span></div>';
        });
        (_coherenceData.communities || []).forEach(function(g) {
            html += '<div class="member-row"><span class="member-name">Group: ' + esc(g.group_name) + ' (' + g.member_count + ')</span><span class="member-metric">' + fmtDec(g.s3, 3) + '</span></div>';
        });
        el.innerHTML = html || '<div style="padding:10px;color:var(--text-muted);font-size:12px;">No families or groups found</div>';
        return;
    }
    var html2 = '';
    list.forEach(function(c) {
        var metric = '';
        if (_currentMode === 'pmb') {
            var bl = c.has_pmb ? (c.pmb.crisis_baseline || 'CALIBRATING') : 'N/A';
            metric = '<span class="pmb-badge ' + bl.toLowerCase() + '">' + bl + '</span>';
        } else {
            var cv = c.stats ? fmtDec(c.stats.c_emo, 3) : 'N/A';
            metric = '<span class="member-metric">' + cv + '</span>';
        }
        var sel = c.hardware_id === _selectedHwId ? ' selected' : '';
        html2 += '<div class="member-row' + sel + '" onclick="selectMember(\'' + esc(c.hardware_id) + '\')"><span class="member-name">' + esc(c.name || c.username) + '</span>' + metric + '</div>';
    });
    el.innerHTML = html2 || '<div style="padding:10px;color:var(--text-muted);font-size:12px;">No clients in selection</div>';
}

function selectFamily(famId) {
    document.getElementById('idType').value = 'family';
    onIdTypeChange();
    document.getElementById('idPicker').value = famId;
    onIdPick();
}

function selectMember(hwId) {
    _selectedHwId = hwId;
    renderMemberList();
    var box = document.getElementById('detailBox');
    box.style.display = '';
    document.getElementById('wisdomSection').style.display = 'none';
    document.getElementById('detailContent').innerHTML = '<div class="loading">Loading...</div>';
    fetch(API + '/api/reports/pmb/client/' + encodeURIComponent(hwId), { headers: _authHeaders() })
        .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(data) { renderDetail(data, hwId); })
        .catch(function(e) { document.getElementById('detailContent').innerHTML = '<div style="color:var(--red);">Error: ' + e.message + '</div>'; });
}

function closeDetail() {
    _selectedHwId = null;
    document.getElementById('detailBox').style.display = 'none';
    document.getElementById('wisdomSection').style.display = '';
    renderMemberList();
}

function renderDetail(data, hwId) {

    html += '<div class="info-row"><span class="info-label">Token Balance</span><span class="info-value">' + (eng.token_balance ? eng.token_balance.toLocaleString() : '0') + '</span></div>';

            legacy.forEach(function(lp) {
                if (typeof lp === 'object') {
                    html += '<div style="padding:6px 8px;background:var(--bg-dark);border-radius:4px;margin:3px 0;font-size:11px;">';
                    html += '<span style="color:var(--purple);font-weight:600;">' + esc(lp.source || '') + '</span> \u2192 ' + esc(lp.pattern || '');
                    if (lp.reflected_in_client) html += ' <span style="color:var(--red);font-size:10px;">REFLECTED</span>';
                    html += '</div>';
                }
            });
            html += '</div>';
        }
    }
    if (data.data_status === 'awaiting_first_session') {
        html += '<div style="padding:12px;background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.3);border-radius:8px;margin-bottom:14px;">';
        html += '<div style="font-size:11px;color:var(--cyan);font-weight:600;">THERAPY SESSION DATA PENDING</div>';
        html += '<div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">Crisis perception, shame profile, and reactivity scores will populate after this client completes their first therapy session with Little Nate. Engagement data above is live.</div>';
        html += '</div>';
    }

    var wisdom = data.wisdom || [];
    if (wisdom.length > 0) {
        html += '<div class="pmb-section"><div class="pmb-section-title">CLIENT WISDOM EXTRACTIONS</div>';
        wisdom.forEach(function(w) {
            html += '<div style="padding:6px 8px;background:var(--bg-dark);border-radius:4px;margin:3px 0;font-size:11px;">';
            html += '<span style="color:var(--purple);font-weight:600;">' + esc(w.insight_type || '') + '</span> <span style="color:var(--text-muted);">(' + esc(w.source || '') + ')</span>';
            if (w.effectiveness) html += ' <span style="color:var(--green);font-size:10px;">' + (w.effectiveness * 100).toFixed(0) + '% eff</span>';
            html += '<div style="color:var(--text-secondary);margin-top:2px;">' + esc(w.content || '') + '</div>';
            html += '</div>';
        });
        html += '</div>';
    }

    var gc = data.global_coherence || {};
    if (gc.score != null) {
        html += '<div class="pmb-section"><div class="pmb-section-title">GLOBAL COHERENCE (SYSTEM)</div>';
        html += meterRow('Global C_emo', gc.score, false);
        if (gc.measured_at) html += '<div class="info-row"><span class="info-label">Last Measured</span><span class="info-value" style="font-size:10px;color:var(--text-muted);">' + new Date(gc.measured_at).toLocaleString() + '</span></div>';
        html += '</div>';
    }

    html += '<div class="pmb-section"><div class="pmb-section-title">DATA QUALITY</div>';
    html += '<div class="info-row"><span class="info-label">Sessions</span><span class="info-value">' + (data.session_count || 0) + '</span></div>';
    html += '<div class="info-row"><span class="info-label">Mood Entries</span><span class="info-value">' + (data.mood_history_length || 0) + '</span></div>';
    html += '<div class="info-row"><span class="info-label">CEE Experiences</span><span class="info-value">' + (data.cee_count || 0) + '</span></div>';
    html += '<div class="info-row"><span class="info-label">C_emo</span><span class="info-value" style="font-family:var(--font-mono);">' + fmtDec(data.C_emo, 3) + '</span></div>';
    html += '</div>';
    document.getElementById('detailContent').innerHTML = html;
}

function meterRow(label, value, invert) {
    var v = parseFloat(value) || 0;
    var pct = Math.min(Math.abs(v) * 100, 100);
    var col = colorScale(Math.abs(v), invert);
    return '<div class="info-row"><span class="info-label">' + label + '</span><span class="info-value">' + fmtPct(v) + '</span></div>' +
        '<div class="pmb-meter"><div class="pmb-meter-fill" style="width:' + pct + '%;background:' + col + ';"></div></div>';
}

function renderWisdom() {
    var el = document.getElementById('wisdomFeed');
    if (!_wisdomData || !_wisdomData.feed || _wisdomData.feed.length === 0) {
        el.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:8px;">No wisdom data yet</div>';
        return;
    }
    var counts = 'Extractions: ' + (_wisdomData.extraction_count || 0) +
        ' \u2022 Nate Insights: ' + (_wisdomData.journal_count || 0) +
        ' \u2022 Community: ' + (_wisdomData.community_count || 0);
    var html = '<div style="font-size:10px;color:var(--text-muted);padding:0 0 8px 0;">' + counts + '</div>';
    _wisdomData.feed.slice(0, 15).forEach(function(w) {
        var icon, label, badge = '';
        if (w.type === 'nate_insight') {
            icon = '\ud83e\udde0'; label = (w.category || w.insight_type || 'insight').toUpperCase();
            if (w.applied) badge = ' <span style="background:var(--green-dim);color:var(--green);padding:1px 5px;border-radius:4px;font-size:9px;">APPLIED</span>';
        } else if (w.type === 'community_convergence') {
            icon = '\ud83c\udf10'; label = w.topic || 'Community';
            if (w.convergence_count > 1) badge = ' <span style="background:var(--purple-dim);color:var(--purple);padding:1px 5px;border-radius:4px;font-size:9px;">x' + w.convergence_count + '</span>';
        } else {
            icon = '\ud83d\udca1'; label = (w.insight_type || 'extraction').toUpperCase();
            if (w.effectiveness_score) badge = ' <span style="color:var(--text-muted);font-size:9px;">' + (w.effectiveness_score * 100).toFixed(0) + '% eff</span>';
        }
        html += '<div class="wisdom-item">';
        if (w.title) html += '<div style="font-size:11px;font-weight:600;color:var(--gold-text);margin-bottom:2px;">' + esc(w.title) + '</div>';
        html += '<div class="wi-type">' + icon + ' ' + esc(label) + badge + '</div>';
        html += '<div class="wi-text">' + esc((w.content || '').substring(0, 200)) + '</div>';
        html += '<div class="wi-time">' + timeAgo(w.timestamp) + '</div>';
        html += '</div>';
    });
    el.innerHTML = html;
}

async function loadAll() {
    try {
        var resp = await fetch(API + '/api/reports/pmb/geo-data', { headers: _authHeaders() });
        if (resp.ok) { _geoData = await resp.json(); _filteredClients = _geoData.clients || []; }
    } catch(e) { console.error('geo-data failed:', e); }

    try {
        var resp2 = await fetch(API + '/api/reports/pmb/coherence-layers', { headers: _authHeaders() });
        if (resp2.ok) {
            _coherenceData = await resp2.json();
            document.getElementById('globalScoreVal').textContent = fmtDec(_coherenceData.global_score, 3);
            document.getElementById('globalScoreVal').style.color = colorScale(_coherenceData.global_score);
        }
    } catch(e) { console.error('coherence failed:', e); }

    try {
        var resp3 = await fetch(API + '/api/reports/pmb/wisdom-feed', { headers: _authHeaders() });
        if (resp3.ok) { _wisdomData = await resp3.json(); }
    } catch(e) { console.error('wisdom failed:', e); }

    populateVarSelect();
    updateGlobeData();
    renderAggregate();
    renderMemberList();
    renderWisdom();
    loadQueueBadge();
}

async function loadQueueBadge() {
    try {
        var resp = await fetch(API + '/api/reports/pmb/pending', { headers: _authHeaders() });
        if (resp.ok) { var d = await resp.json(); var b = document.getElementById('queueBadge'); b.textContent = d.length; b.className = 'badge' + (d.length === 0 ? ' zero' : ''); }
    } catch(e) {}
}

async function openQueueOverlay() {
    document.getElementById('queueOverlay').classList.add('open');
    document.getElementById('queueContent').innerHTML = '<div class="loading">Loading...</div>';
    try {
        var resp = await fetch(API + '/api/reports/pmb/pending', { headers: _authHeaders() });
        if (!resp.ok) { document.getElementById('queueContent').innerHTML = '<div style="color:var(--red);">Error ' + resp.status + '</div>'; return; }
        var data = await resp.json();
        if (!data.length) { document.getElementById('queueContent').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">No pending reports</div>'; return; }
        var html = '<h3 style="color:var(--gold-text);font-family:var(--font-display);margin-bottom:16px;">Pending Reports</h3>';
        data.forEach(function(r) {
            html += '<div style="padding:12px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;" onclick="openDeepDive(\'' + r.id + '\')">';
            html += '<div style="font-weight:600;">' + esc(r.client_name || r.client_username) + '</div>';
            html += '<div style="font-size:11px;color:var(--text-secondary);">By ' + esc(r.requested_by) + ' \u2022 ' + r.urgency + ' \u2022 ' + timeAgo(r.requested_at) + '</div>';
            html += '</div>';
        });
        document.getElementById('queueContent').innerHTML = html;
    } catch(e) { document.getElementById('queueContent').innerHTML = '<div style="color:var(--red);">' + e.message + '</div>'; }
}
function closeQueue() { document.getElementById('queueOverlay').classList.remove('open'); }

async function openHistoryOverlay() {
    document.getElementById('historyOverlay').classList.add('open');
    document.getElementById('historyContent').innerHTML = '<div class="loading">Loading...</div>';
    try {
        var resp = await fetch(API + '/api/reports/pmb/history', { headers: _authHeaders() });
        if (!resp.ok) { document.getElementById('historyContent').innerHTML = '<div style="color:var(--red);">Error ' + resp.status + '</div>'; return; }
        var data = await resp.json();
        if (!data.length) { document.getElementById('historyContent').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">No reports yet</div>'; return; }
        var html = '<h3 style="color:var(--gold-text);font-family:var(--font-display);margin-bottom:16px;">Report History</h3>';
        data.forEach(function(r) {
            var stColor = r.status === 'APPROVED' ? 'var(--green)' : r.status === 'DENIED' ? 'var(--red)' : 'var(--orange)';
            html += '<div style="padding:10px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">';
            html += '<div><div style="font-weight:500;font-size:13px;">' + esc(r.client_name) + '</div><div style="font-size:10px;color:var(--text-secondary);">' + esc(r.requested_by) + ' \u2022 ' + new Date(r.requested_at).toLocaleDateString() + '</div></div>';
            html += '<span style="color:' + stColor + ';font-size:11px;font-weight:700;">' + r.status + '</span>';
            html += '</div>';
        });
        document.getElementById('historyContent').innerHTML = html;
    } catch(e) { document.getElementById('historyContent').innerHTML = '<div style="color:var(--red);">' + e.message + '</div>'; }
}
function closeHistory() { document.getElementById('historyOverlay').classList.remove('open'); }

async function openDeepDive(reportId) {
    closeQueue();
    try {
        var resp = await fetch(API + '/api/reports/pmb/deep-dive/' + reportId, { method: 'POST', headers: _authHeaders() });
        if (resp.ok) {
            var data = await resp.json();
            alert('Clinical workspace for ' + (data.client_name || 'client') + ' opened. Use Big Nate Chat in SkyEye for consultation.');
        } else { alert('Error: ' + resp.status); }
    } catch(e) { alert('Error: ' + e.message); }
}

var token = sessionStorage.getItem('token') || localStorage.getItem('sc_token');
if (!token) { window.location.href = 'command.html'; }
else { initGlobe(); loadAll(); }
</script>
</body>
</html>
