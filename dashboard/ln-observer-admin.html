<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LN-Observer Admin · Sovereign Command</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--night:#131022;--panel:#1c1830;--panel-2:#241f3d;--line:#37305c;--ink:#ece8f6;
--ink-dim:#9d96bd;--ember:#e8a24c;--live:#7fd6a4;--danger:#e0705f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--night);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;
font-size:14.5px;line-height:1.5;padding:28px;max-width:1100px;margin:0 auto}
h1{font-family:'Fraunces',serif;font-size:26px;margin-bottom:2px}
.sub{color:var(--ink-dim);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:26px}
h2{font-family:'Fraunces',serif;font-size:18px;margin:26px 0 12px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
th{color:var(--ink-dim);font-size:11px;letter-spacing:.09em;text-transform:uppercase;background:var(--panel-2)}
tr:last-child td{border-bottom:none}
.pill{font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.pill.approved{border-color:var(--live);color:var(--live)}
.pill.pending{border-color:var(--ember);color:var(--ember)}
.pill.revoked{border-color:var(--danger);color:var(--danger)}
button{font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;border-radius:8px;
padding:6px 12px;border:1px solid var(--line);background:transparent;color:var(--ink)}
button.approve{border-color:var(--live);color:var(--live)}
button.revoke{border-color:var(--danger);color:var(--danger)}
button:hover{filter:brightness(1.2)}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.mono{font-family:ui-monospace,monospace;font-size:12px;color:var(--ink-dim)}
.empty{color:var(--ink-dim);padding:16px}
.refresh{float:right;margin-top:-38px}
.warn{color:var(--danger);margin-bottom:12px;font-size:13px}
</style>
</head>
<body>
<h1>LN-Observer</h1>
<div class="sub">Sovereign Command · feature approvals &amp; activation record</div>
<div id="authWarn" class="warn hidden">No admin token — open from Sovereign Command after login.</div>

<h2>Coach approvals <button class="refresh" onclick="load()">Refresh</button></h2>
<table>
  <thead><tr><th>Coach</th><th>Status</th><th>Requested</th><th>Decided</th><th>Actions</th></tr></thead>
  <tbody id="approvals"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
</table>

<h2>Activation log</h2>
<table>
  <thead><tr><th>Activated</th><th>Coach</th><th>Session</th><th>Deactivated</th><th>Responsibility</th><th>Client</th></tr></thead>
  <tbody id="log"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
</table>

<script>
const API_BASE = window.SS_API_BASE || "https://api.sovereignsanctuary.net/api/ln-observer";
function _token(){
  try{
    return sessionStorage.getItem("sc_token")
      || localStorage.getItem("sc_token")
      || sessionStorage.getItem("token")
      || "";
  }catch(e){ return ""; }
}
function _headers(){
  const t = _token();
  const h = {"Content-Type":"application/json"};
  if(t) h["Authorization"] = "Bearer " + t;
  return h;
}
function fmt(t){ return t ? new Date(t).toLocaleString() : "—"; }
function esc(s){ const d=document.createElement("div"); d.textContent=s??""; return d.innerHTML; }

async function load(){
  if(!_token()) document.getElementById("authWarn").classList.remove("hidden");
  const [aRes,lRes] = await Promise.all([
    fetch(`${API_BASE}/admin/approvals`, {headers:_headers()}),
    fetch(`${API_BASE}/admin/activation-log`, {headers:_headers()})
  ]);
  if(!aRes.ok || !lRes.ok){
    document.getElementById("approvals").innerHTML =
      `<tr><td colspan="5" class="empty">Failed to load (${aRes.status}/${lRes.status})</td></tr>`;
    return;
  }
  const approvals = await aRes.json(), log = await lRes.json();

  document.getElementById("approvals").innerHTML = approvals.length ? approvals.map(a=>`
    <tr>
      <td>${esc(a.coach_name)}<div class="mono">${esc(a.coach_id)}</div></td>
      <td><span class="pill ${esc(a.status)}">${esc(a.status)}</span></td>
      <td>${fmt(a.requested_at)}</td>
      <td>${a.decided_at ? fmt(a.decided_at)+`<div class="mono">by ${esc(a.decided_by)}</div>` : "—"}</td>
      <td>
        ${a.status!=="approved" ? `<button class="approve" onclick="decide('${esc(a.coach_id)}','approved')">Approve</button>` : ""}
        ${a.status!=="revoked" ? `<button class="revoke" onclick="decide('${esc(a.coach_id)}','revoked')">Revoke</button>` : ""}
      </td>
    </tr>`).join("") : `<tr><td colspan="5" class="empty">No requests yet.</td></tr>`;

  document.getElementById("log").innerHTML = log.length ? log.map(r=>`
    <tr>
      <td>${fmt(r.activated_at)}</td>
      <td>${esc(r.coach_name)}<div class="mono">${esc(r.coach_id)}</div></td>
      <td class="mono">${esc(String(r.session_id).slice(0,8))}…</td>
      <td>${fmt(r.deactivated_at)}</td>
      <td>${r.responsibility_ack ? "Accepted ("+esc(r.ack_text_version)+")" : "—"}</td>
      <td class="mono">${esc(r.client_ip||"")}</td>
    </tr>`).join("") : `<tr><td colspan="6" class="empty">No activations yet.</td></tr>`;
}

async function decide(coachId, decision){
  await fetch(`${API_BASE}/admin/decide`,{
    method:"POST",
    headers:_headers(),
    body:JSON.stringify({coach_id:coachId, decision, coach_name:""})
  });
  load();
}
load();
</script>
</body>
</html>
