<!DOCTYPE html>
<html>
<head>
    <title>Admin Bypass</title>
    <style>
        body { 
            background: #0a0a0a; 
            color: #00ff88; 
            font-family: monospace; 
            padding: 40px; 
            text-align: center;
        }
        .btn {
            background: #FFD700;
            color: black;
            padding: 20px 40px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1>Admin Session Bypass</h1>
    <p>Click below to set admin session and go to The Eye</p>
    
    <button class="btn" onclick="setAdminSession()">
        Login as Admin & Go to The Eye
    </button>

    <div id="status"></div>

    <script>
        function setAdminSession() {
            sessionStorage.setItem("username", "admin1");
            sessionStorage.setItem("password", "admin123");
            sessionStorage.setItem("profile", JSON.stringify({
                role: "ADMIN",
                name: "Admin User",
                email: "admin@littlenate.ai",
                hardware_id: "ADMIN_001",
                subscription_plan: "TOP_TIER",
                subscription_status: "active",
                token_balance: 1000000
            }));

            document.getElementById("status").innerHTML = "<p style=\"color: #00ff88;\">Session set! Redirecting...</p>";
            
            setTimeout(function() {
                window.location.href = "the_eye.html";
            }, 1000);
        }
    </script>
</body>
</html>
