<!DOCTYPE html>
<html>
<head><title>Session Check</title></head>
<body style="background: #0a0a0a; color: #00ff88; font-family: monospace; padding: 40px;">
    <h1>Session Storage Status</h1>
    <div id="status"></div>
    
    <button onclick="setAndGo()" style="background: #FFD700; color: black; padding: 20px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 20px;">
        Set Session & Go to The Eye
    </button>
    
    <script>
    // Check current session
    const username = sessionStorage.getItem('username');
    const profile = sessionStorage.getItem('profile');
    
    let html = '<h2>Current Session:</h2>';
    html += '<p>Username: ' + (username || 'NOT SET') + '</p>';
    html += '<p>Profile: ' + (profile || 'NOT SET') + '</p>';
    
    if (profile) {
        try {
            const p = JSON.parse(profile);
            html += '<p>Role: ' + (p.role || 'N/A') + '</p>';
            html += '<p>Name: ' + (p.name || 'N/A') + '</p>';
        } catch(e) {}
    }
    
    document.getElementById('status').innerHTML = html;
    
    function setAndGo() {
        sessionStorage.setItem('username', 'admin1');
        sessionStorage.setItem('password', 'admin123');
        sessionStorage.setItem('profile', JSON.stringify({
            role: 'ADMIN',
            name: 'Admin User',
            hardware_id: 'ADMIN_001',
            email: 'admin@littlenate.ai',
            subscription_plan: 'TOP_TIER',
            subscription_status: 'active'
        }));
        
        alert('Session set! Redirecting to The Eye...');
        window.location.href = 'the_eye.html';
    }
    </script>
</body>
</html>
