<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Command | The Eye - Token Analytics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #0A0A0A; --bg-card: #111111; --bg-elevated: #1A1A1A;
            --gold: #FFD700; --gold-dim: rgba(255, 215, 0, 0.2);
            --red-critical: #FF3B3B; --red-dim: rgba(255, 59, 59, 0.15);
            --cyan: #00D4FF; --cyan-dim: rgba(0, 212, 255, 0.1);
            --green: #00FF88; --green-dim: rgba(0, 255, 136, 0.1);
            --orange: #FF9500; --purple: #9D4EDD; --purple-dim: rgba(157, 78, 221, 0.15);
            --text-primary: #FFFFFF; --text-secondary: #888888; --border: #252525;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; }
        .header { background: linear-gradient(180deg, #1A1A10 0%, #0A0A0A 100%); border-bottom: 1px solid var(--gold-dim); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--gold), #FF8C00); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .logo-text { font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: 2px; }
        .page-title { font-size: 14px; color: var(--text-secondary); }
        .btn { padding: 10px 20px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; display: inline-block; }
        .btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
        .sub-nav { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; gap: 24px; }
        .sub-nav-item { padding: 14px 0; font-size: 12px; color: var(--text-secondary); border-bottom: 2px solid transparent; cursor: pointer; }
        .sub-nav-item.active { color: var(--gold); border-bottom-color: var(--gold); }
        .main-content { padding: 24px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 14px; font-weight: 600; }
        .card-body { padding: 20px; }
        .token-overview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .token-stat { padding: 24px; background: var(--bg-elevated); border-radius: 12px; text-align: center; border: 1px solid var(--border); }
        .token-value { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
        .token-value.green { color: var(--green); }
        .token-value.orange { color: var(--orange); }
        .token-value.cyan { color: var(--cyan); }
        .token-value.gold { color: var(--gold); }
        .token-label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; }
        .budget-section { margin-bottom: 20px; }
        .budget-header { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 13px; }
        .budget-bar { height: 32px; background: var(--bg-dark); border-radius: 16px; overflow: hidden; position: relative; }
        .budget-fill { height: 100%; display: flex; align-items: center; justify-content: flex-end; padding-right: 16px; font-size: 12px; font-weight: 600; transition: width 0.5s; border-radius: 16px; }
        .budget-fill.safe { background: linear-gradient(90deg, var(--green), #00CC6A); }
        .budget-fill.warning { background: linear-gradient(90deg, var(--gold), var(--orange)); }
        .budget-fill.danger { background: linear-gradient(90deg, var(--orange), var(--red-critical)); }
        .usage-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px; }
        .usage-card { background: var(--bg-elevated); border-radius: 10px; padding: 16px; border-left: 3px solid var(--border); }
        .usage-card.voice { border-left-color: var(--purple); }
        .usage-card.text { border-left-color: var(--cyan); }
        .usage-card.vision { border-left-color: var(--gold); }
        .usage-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .usage-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .usage-icon.voice { background: var(--purple-dim); }
        .usage-icon.text { background: var(--cyan-dim); }
        .usage-icon.vision { background: var(--gold-dim); }
        .usage-name { font-size: 13px; font-weight: 600; }
        .usage-detail { font-size: 10px; color: var(--text-secondary); }
        .usage-val { font-size: 22px; font-weight: 700; margin: 8px 0; }
        .usage-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 10px; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
        .usage-row:last-child { border-bottom: none; }
        .empty-state { text-align: center; padding: 30px; color: var(--text-secondary); font-size: 11px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">&#x1F441;&#xFE0F;</div>
            <div>
                <div class="logo-text">THE EYE</div>
                <div class="page-title">Token Usage &amp; Spending</div>
            </div>
        </div>
        <a href="the_eye.html" class="btn btn-secondary">&larr; Back to The Eye</a>
    </header>
    <nav class="sub-nav">
        <div class="sub-nav-item" onclick="location.href='the_eye.html'" style="cursor:pointer;">Overview</div>
        <div class="sub-nav-item" onclick="location.href='the_eye_coaches.html'">Coaches</div>
        <div class="sub-nav-item active">Tokens</div>
        <div class="sub-nav-item" onclick="location.href='the_eye_monitor.html'">Live Monitor</div>
        <div class="sub-nav-item" onclick="location.href='the_eye_crisis.html'">Crisis</div>
        <div class="sub-nav-item" onclick="location.href='the_eye_community.html'">Community</div>
    </nav>
    <main class="main-content">
        <div id="token-overview" class="token-overview"><div class="empty-state" style="grid-column:span 4;">Loading token data...</div></div>
        <div class="card">
            <div class="card-header"><div class="card-title">&#x1F4B0; Monthly Token Budget</div></div>
            <div class="card-body"><div id="budget-display"><div class="empty-state">Loading...</div></div></div>
        </div>
        <div class="card">
            <div class="card-header"><div class="card-title">&#x1F4CA; Usage Breakdown by Modality</div><span style="font-size:10px;color:var(--text-secondary);">Patent 4: Vision includes biometric analysis tokens</span></div>
            <div class="card-body"><div class="usage-grid" id="usage-grid"><div class="empty-state" style="grid-column:span 3;">Loading usage data...</div></div></div>
        </div>
        <div class="card">
            <div class="card-header"><div class="card-title">&#x1F4C8; Platform Totals</div></div>
            <div class="card-body"><div id="platform-usage"><div class="empty-state">Loading...</div></div></div>
        </div>
    </main>
    <script>

function _recoverAuth() {
  function _ck(n) { var m = document.cookie.match(new RegExp('(^| )' + n + '=([^;]+)')); return m ? decodeURIComponent(m[2]) : ''; }
  var hp = new URLSearchParams(location.hash.slice(1));
  var ht = hp.get('t'), hu = hp.get('u'), hpf = hp.get('p');
  if (ht) { try { sessionStorage.setItem('token', decodeURIComponent(ht)); } catch(e){} try { localStorage.setItem('sc_token', decodeURIComponent(ht)); } catch(e){} }
  if (hu) { try { sessionStorage.setItem('username', decodeURIComponent(hu)); } catch(e){} try { localStorage.setItem('sc_username', decodeURIComponent(hu)); } catch(e){} }
  if (hpf) { try { sessionStorage.setItem('profile', decodeURIComponent(hpf)); } catch(e){} try { localStorage.setItem('sc_profile', decodeURIComponent(hpf)); } catch(e){} }
  if (location.hash) try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  if (!sessionStorage.getItem('token')) { var ct = _ck('sc_token') || localStorage.getItem('sc_token'); if (ct) { try { sessionStorage.setItem('token', ct); } catch(e){} } }
  if (!sessionStorage.getItem('username')) { var cu = _ck('sc_username') || localStorage.getItem('sc_username'); if (cu) { try { sessionStorage.setItem('username', cu); } catch(e){} } }
  if (!sessionStorage.getItem('profile')) { var cp = _ck('sc_profile') || localStorage.getItem('sc_profile'); if (cp) { try { sessionStorage.setItem('profile', cp); } catch(e){} } }
}
_recoverAuth();
    (function() {
        "use strict";
        var username = (sessionStorage.getItem("username") || localStorage.getItem("sc_username"));
        var token = (sessionStorage.getItem("token") || localStorage.getItem("sc_token"));
        var profile = JSON.parse((sessionStorage.getItem("profile") || localStorage.getItem("sc_profile")) || "{}");
        if (!username) { window.location.href = "index.html"; return; }
        if (profile.role !== "ADMIN") { alert("Admin access required"); window.location.href = "command.html"; return; }

        function getWsUrl() {
            var h = location.hostname;
            if (!h || h === "localhost" || h === "127.0.0.1" || location.protocol === "file:") return "wss://api.sovereignsanctuary.net/ws";
            if (h.indexOf("sovereignsanctuary") >= 0) return "wss://" + h + "/ws";
            var params = new URLSearchParams(window.location.search);
            if (params.get("ws")) return params.get("ws");
            return (location.protocol === "https:" ? "wss" : "ws") + "://" + h + "/ws";
        }

        var ws = null, authenticated = false;

        function connect() {
            ws = new WebSocket(getWsUrl());
            ws.onopen = function() {
                ws.send(JSON.stringify({ type: "auth", token: token, hardware_id: profile.hardware_id || "WEB_ADMIN" }));
            };
            ws.onmessage = function(event) {
                var data; try { data = JSON.parse(event.data); } catch(e) { return; }
                if (data.type === "login_success" || data.type === "auth_success") {
                    authenticated = true;
                    ws.send(JSON.stringify({ type: "admin_get_stats" }));
                    return;
                }
                if (data.type === "admin_stats") {
                    var stats = data.stats || {};
                    displayTokenOverview(stats);
                    displayBudget(stats);
                    displayUsageBreakdown(stats);
                    displayPlatformUsage(stats);
                    return;
                }
            };
            ws.onclose = function() { authenticated = false; setTimeout(connect, 2000); };
        }

        function displayTokenOverview(stats) {
            var tokensToday = stats.tokens_used_today || stats.today_tokens || 0;
            var tokensMonth = stats.tokens_used_month || 0;
            var totalRevenue = stats.total_revenue || 0;
            var totalTokens = (stats.platform_totals && stats.platform_totals.total_tokens_used) || stats.total_tokens_used || 0;
            var totalSessions = (stats.platform_totals && stats.platform_totals.total_sessions) || stats.total_sessions || 1;
            var avgPerSession = Math.round(totalTokens / Math.max(totalSessions, 1));

            document.getElementById("token-overview").innerHTML =
                '<div class="token-stat"><div class="token-value cyan">' + tokensToday.toLocaleString() + '</div><div class="token-label">Tokens Today</div></div>' +
                '<div class="token-stat"><div class="token-value orange">' + tokensMonth.toLocaleString() + '</div><div class="token-label">Tokens This Month</div></div>' +
                '<div class="token-stat"><div class="token-value green">$' + totalRevenue.toLocaleString() + '</div><div class="token-label">Total Revenue</div></div>' +
                '<div class="token-stat"><div class="token-value gold">' + avgPerSession.toLocaleString() + '</div><div class="token-label">Avg Tokens/Session</div></div>';
        }

        function displayBudget(stats) {
            var budget = 500000;
            var used = stats.tokens_used_month || 0;
            var pct = Math.min((used / budget) * 100, 100);
            var cls = pct < 70 ? "safe" : pct < 90 ? "warning" : "danger";
            document.getElementById("budget-display").innerHTML =
                '<div class="budget-section"><div class="budget-header"><span style="font-weight:600;">Monthly Token Budget</span><span>' + used.toLocaleString() + ' / ' + budget.toLocaleString() + '</span></div><div class="budget-bar"><div class="budget-fill ' + cls + '" style="width:' + pct + '%;">' + pct.toFixed(1) + '%</div></div></div>';
        }

        function displayUsageBreakdown(stats) {
            var totalTokens = stats.tokens_used_today || stats.today_tokens || 1;
            // Estimate modality split (backend can provide exact splits when available)
            var voiceTokens = Math.round(totalTokens * 0.45);
            var textTokens = Math.round(totalTokens * 0.35);
            var visionTokens = Math.round(totalTokens * 0.20);
            var voiceCost = (voiceTokens * 0.00001).toFixed(2);
            var textCost = (textTokens * 0.00001).toFixed(2);
            var visionCost = (visionTokens * 0.00001).toFixed(2);

            document.getElementById("usage-grid").innerHTML =
                '<div class="usage-card voice"><div class="usage-header"><div class="usage-icon voice">&#x1F399;&#xFE0F;</div><div><div class="usage-name">Voice (Whisper + TTS)</div><div class="usage-detail">Top Tier clients only</div></div></div><div class="usage-val" style="color:var(--purple);">$' + voiceCost + '</div><div class="usage-row"><span>Tokens</span><span>' + voiceTokens.toLocaleString() + '</span></div><div class="usage-row"><span>Whisper (STT)</span><span>~' + Math.round(voiceTokens * 0.6).toLocaleString() + '</span></div><div class="usage-row"><span>TTS (Generation)</span><span>~' + Math.round(voiceTokens * 0.4).toLocaleString() + '</span></div></div>' +
                '<div class="usage-card text"><div class="usage-header"><div class="usage-icon text">&#x1F4AC;</div><div><div class="usage-name">Text (GPT-4o)</div><div class="usage-detail">All tiers</div></div></div><div class="usage-val" style="color:var(--cyan);">$' + textCost + '</div><div class="usage-row"><span>Tokens</span><span>' + textTokens.toLocaleString() + '</span></div><div class="usage-row"><span>Therapeutic Chat</span><span>~' + Math.round(textTokens * 0.7).toLocaleString() + '</span></div><div class="usage-row"><span>Night School / Analysis</span><span>~' + Math.round(textTokens * 0.3).toLocaleString() + '</span></div></div>' +
                '<div class="usage-card vision"><div class="usage-header"><div class="usage-icon vision">&#x1F441;&#xFE0F;</div><div><div class="usage-name">Vision (GPT-4V)</div><div class="usage-detail">Patent 4: Biometric analysis</div></div></div><div class="usage-val" style="color:var(--gold);">$' + visionCost + '</div><div class="usage-row"><span>Tokens</span><span>' + visionTokens.toLocaleString() + '</span></div><div class="usage-row"><span>Facial Affect Analysis</span><span>~' + Math.round(visionTokens * 0.4).toLocaleString() + '</span></div><div class="usage-row"><span>Gaze / Body Tracking</span><span>~' + Math.round(visionTokens * 0.3).toLocaleString() + '</span></div><div class="usage-row"><span>Engagement Scoring</span><span>~' + Math.round(visionTokens * 0.2).toLocaleString() + '</span></div><div class="usage-row"><span>Clinical Supervision</span><span>~' + Math.round(visionTokens * 0.1).toLocaleString() + '</span></div></div>';
        }

        function displayPlatformUsage(stats) {
            var totalTokens = (stats.platform_totals && stats.platform_totals.total_tokens_used) || stats.total_tokens_used || 0;
            var totalMessages = (stats.platform_totals && stats.platform_totals.total_messages) || 0;
            var totalSessions = (stats.platform_totals && stats.platform_totals.total_sessions) || stats.total_sessions || 0;
            document.getElementById("platform-usage").innerHTML =
                '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;">' +
                '<div style="text-align:center;"><div style="font-size:24px;font-weight:700;color:var(--cyan);">' + totalTokens.toLocaleString() + '</div><div style="font-size:10px;color:var(--text-secondary);text-transform:uppercase;">Total Tokens Used</div></div>' +
                '<div style="text-align:center;"><div style="font-size:24px;font-weight:700;color:var(--gold);">' + totalMessages.toLocaleString() + '</div><div style="font-size:10px;color:var(--text-secondary);text-transform:uppercase;">Total Messages</div></div>' +
                '<div style="text-align:center;"><div style="font-size:24px;font-weight:700;color:var(--green);">' + totalSessions.toLocaleString() + '</div><div style="font-size:10px;color:var(--text-secondary);text-transform:uppercase;">Total Sessions</div></div>' +
                '</div>';
        }

        connect();
    })();
    </script>
</body>
</html>
