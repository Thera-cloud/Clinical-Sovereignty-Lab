<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickBooks Integration — Sovereign Command</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --bg-void: #050505;
    --bg-dark: #0A0A0A;
    --bg-card: #111111;
    --bg-elevated: #1A1A1A;
    --border: #252525;
    --border-active: #333333;
    --gold: #C9A962;
    --gold-bright: #E8D5A3;
    --gold-dim: #8B7355;
    --gold-dim-bg: rgba(201, 169, 98, 0.15);
    --cyan: #4ECDC4;
    --cyan-dim: rgba(78, 205, 196, 0.15);
    --red: #EF4444;
    --red-dim: rgba(239, 68, 68, 0.15);
    --green: #22C55E;
    --green-dim: rgba(34, 197, 94, 0.15);
    --orange: #F59E0B;
    --text-primary: #FFFFFF;
    --text-secondary: #888888;
    --text-muted: #555555;
    --font-body: 'DM Sans', -apple-system, sans-serif;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-mono: 'JetBrains Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: var(--font-body);
    background: var(--bg-void);
    color: var(--text-primary);
    min-height: 100vh;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 200;
    background: rgba(10, 10, 10, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(201, 169, 98, 0.2);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.topbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
}

.back-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}
.back-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-primary);
    border-color: var(--border-active);
}

.topbar-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
}
.topbar-title span { color: var(--gold); }

.main-content {
    padding: 24px;
    max-width: 1200px;
    margin: 0 auto;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
}

.card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
}

.card.full-width {
    grid-column: 1 / -1;
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
}

.card-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 14px;
}

.card-body {
    padding: 20px;
}

.icon { font-size: 18px; }
.icon.gold { color: var(--gold); }
.icon.cyan { color: var(--cyan); }
.icon.green { color: var(--green); }
.icon.red { color: var(--red); }

.action-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    font-family: var(--font-body);
    transition: 0.2s;
}
.action-btn.gold {
    background: var(--gold-dim-bg);
    border: 1px solid var(--gold);
    color: var(--gold);
}
.action-btn.gold:hover {
    background: rgba(201, 169, 98, 0.25);
}
.action-btn.cyan {
    background: var(--cyan-dim);
    border: 1px solid var(--cyan);
    color: var(--cyan);
}
.action-btn.cyan:hover {
    background: rgba(78, 205, 196, 0.25);
}
.action-btn.red {
    background: var(--red-dim);
    border: 1px solid var(--red);
    color: var(--red);
}
.action-btn.red:hover {
    background: rgba(239, 68, 68, 0.25);
}

.status-badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
}
.status-badge.synced { background: var(--green-dim); color: var(--green); }
.status-badge.failed { background: var(--red-dim); color: var(--red); }
.status-badge.skipped { background: rgba(245, 158, 11, 0.2); color: var(--gold-bright); }

.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}
.data-table th {
    text-align: left;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text-secondary);
    font-weight: 500;
}
.data-table td {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
}
.data-table tbody tr:hover {
    background: rgba(255, 255, 255, 0.02);
}
.data-table tbody tr:last-child td {
    border-bottom: none;
}

.input-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
}
.input-row:last-child { border-bottom: none; }
.input-row label {
    min-width: 180px;
    font-size: 13px;
    color: var(--text-secondary);
}
.input-row input {
    flex: 1;
    max-width: 200px;
    padding: 8px 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    font-size: 13px;
}
.input-row input::placeholder {
    color: var(--text-muted);
}

.stat-row {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
}
.stat-item {
    display: flex;
    align-items: center;
    gap: 8px;
}
.stat-value {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
}
.stat-label {
    font-size: 12px;
    color: var(--text-secondary);
}

@media (max-width: 768px) {
    .dashboard-grid { grid-template-columns: 1fr; }
    .input-row { flex-wrap: wrap; }
    .input-row input { max-width: none; }
}
</style>
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <a class="back-btn" id="backBtn" title="Back to Command">&#8592;</a>
        <div class="topbar-title"><span>📊</span> QuickBooks Integration</div>
    </div>
</div>

<div class="main-content">
    <div class="dashboard-grid">

        <!-- Connection Status -->
        <div class="card full-width">
            <div class="card-header">
                <div class="card-title"><div class="icon gold">🔗</div> Connection Status</div>
                <div style="display:flex;gap:8px;">
                    <button class="action-btn cyan" id="btnConnect" style="display:none;">Connect to QuickBooks</button>
                    <button class="action-btn red" id="btnDisconnect" style="display:none;">Disconnect</button>
                    <button class="action-btn gold" id="btnRefreshStatus">Refresh</button>
                </div>
            </div>
            <div class="card-body">
                <div id="statusContent" style="min-height:80px;">
                    <div style="color:var(--text-secondary);">Loading...</div>
                </div>
            </div>
        </div>

        <!-- Account Mapping -->
        <div class="card full-width">
            <div class="card-header">
                <div class="card-title"><div class="icon cyan">📋</div> Account Mapping</div>
                <button class="action-btn gold" id="btnSaveMapping">Save Mappings</button>
            </div>
            <div class="card-body">
                <div id="mappingForm">
                    <div class="input-row">
                        <label>Subscription Revenue</label>
                        <input type="text" id="map_subscription_revenue_id" placeholder="QB Account ID" />
                        <input type="text" id="map_subscription_revenue_name" placeholder="Account name" style="max-width:280px;" />
                    </div>
                    <div class="input-row">
                        <label>Token Sales</label>
                        <input type="text" id="map_token_sales_id" placeholder="QB Account ID" />
                        <input type="text" id="map_token_sales_name" placeholder="Account name" style="max-width:280px;" />
                    </div>
                    <div class="input-row">
                        <label>GKM Donations</label>
                        <input type="text" id="map_gkm_donations_id" placeholder="QB Account ID" />
                        <input type="text" id="map_gkm_donations_name" placeholder="Account name" style="max-width:280px;" />
                    </div>
                    <div class="input-row">
                        <label>Coach Payouts</label>
                        <input type="text" id="map_coach_payouts_id" placeholder="QB Account ID" />
                        <input type="text" id="map_coach_payouts_name" placeholder="Account name" style="max-width:280px;" />
                    </div>
                    <div class="input-row">
                        <label>Corporate Revenue</label>
                        <input type="text" id="map_corporate_revenue_id" placeholder="QB Account ID" />
                        <input type="text" id="map_corporate_revenue_name" placeholder="Account name" style="max-width:280px;" />
                    </div>
                </div>
            </div>
        </div>

        <!-- Refresh Token Countdown -->
        <div class="card" id="refreshTokenCard" style="display:none;">
            <div class="card-header">
                <div class="card-title"><div class="icon" id="refreshIcon">🔑</div> Refresh Token</div>
                <button class="action-btn gold" id="btnRefreshToken">Refresh Now</button>
            </div>
            <div class="card-body">
                <div style="display:flex;flex-wrap:wrap;gap:24px;align-items:center;">
                    <div style="flex:1;min-width:200px;">
                        <div id="refreshCountdown" style="font-family:var(--font-mono);font-size:28px;font-weight:700;color:var(--gold);letter-spacing:1px;">—</div>
                        <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">until refresh token expires</div>
                    </div>
                    <div style="flex:2;min-width:260px;">
                        <div id="refreshProgressWrap" style="background:var(--bg-elevated);border-radius:8px;height:10px;overflow:hidden;margin-bottom:8px;">
                            <div id="refreshProgressBar" style="height:100%;border-radius:8px;transition:width 0.5s;"></div>
                        </div>
                        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);">
                            <span id="refreshIssuedLabel">Issued: —</span>
                            <span id="refreshExpiresLabel">Expires: —</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sync Stats & Manual Sync -->
        <div class="card">
            <div class="card-header">
                <div class="card-title"><div class="icon green">📈</div> Sync Stats</div>
                <button class="action-btn cyan" id="btnTriggerSync">Manual Sync</button>
            </div>
            <div class="card-body">
                <div class="stat-row" id="syncStats">
                    <div class="stat-item"><span class="stat-value" id="stat-synced">0</span><span class="stat-label">Synced</span></div>
                    <div class="stat-item"><span class="stat-value" id="stat-failed" style="color:var(--red);">0</span><span class="stat-label">Failed</span></div>
                    <div class="stat-item"><span class="stat-value" id="stat-skipped" style="color:var(--gold-bright);">0</span><span class="stat-label">Skipped</span></div>
                </div>
            </div>
        </div>

        <!-- Sync History -->
        <div class="card full-width">
            <div class="card-header">
                <div class="card-title"><div class="icon gold">📜</div> Sync History</div>
                <button class="action-btn gold" id="btnRefreshHistory">Refresh</button>
            </div>
            <div class="card-body" style="overflow-x:auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Sync Type</th>
                            <th>Source Table</th>
                            <th>QB Entity</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <tr><td colspan="6" style="padding:24px;text-align:center;color:var(--text-secondary);">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
// Auth recovery (URL hash, localStorage, cookies — same pattern as other sub-pages)
function _recoverAuth() {
    function _ck(n) { var m = document.cookie.match(new RegExp('(^| )' + n + '=([^;]+)')); return m ? decodeURIComponent(m[2]) : ''; }
    var hp = new URLSearchParams(location.hash.slice(1));
    var ht = hp.get('t'), hu = hp.get('u'), hpf = hp.get('p');
    if (ht) { try { sessionStorage.setItem('token', decodeURIComponent(ht)); } catch(e){} try { localStorage.setItem('sc_token', decodeURIComponent(ht)); } catch(e){} }
    if (hu) { try { sessionStorage.setItem('username', decodeURIComponent(hu)); } catch(e){} try { localStorage.setItem('sc_username', decodeURIComponent(hu)); } catch(e){} }
    if (hpf) { try { sessionStorage.setItem('profile', decodeURIComponent(hpf)); } catch(e){} try { localStorage.setItem('sc_profile', decodeURIComponent(hpf)); } catch(e){} }
    if (location.hash) try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
    if (!sessionStorage.getItem('token')) { var ct = _ck('sc_token') || localStorage.getItem('sc_token'); if (ct) { try { sessionStorage.setItem('token', ct); } catch(e){} } }
    if (!sessionStorage.getItem('username')) { var cu = _ck('sc_username') || localStorage.getItem('sc_username'); if (cu) { try { sessionStorage.setItem('username', cu); } catch(e){} } }
    if (!sessionStorage.getItem('profile')) { var cp = _ck('sc_profile') || localStorage.getItem('sc_profile'); if (cp) { try { sessionStorage.setItem('profile', cp); } catch(e){} } }
}
_recoverAuth();

var _ykVerified = false;
try { _ykVerified = sessionStorage.getItem('sc_yubikey_verified') === 'true'; } catch(e) {}
if (!_ykVerified) { window.location.href = 'command.html'; }

var API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
    ? 'http://localhost:8000' : 'https://api.sovereignsanctuary.net';

function _authHeaders() {
    var token = sessionStorage.getItem('token') || localStorage.getItem('sc_token') || '';
    return { 'Authorization': 'Bearer ' + token };
}

async function apiFetch(url) {
    try {
        var resp = await fetch(API + url, { headers: _authHeaders() });
        if (resp.status === 401) { window.location.href = 'command.html'; return null; }
        if (!resp.ok) { console.warn('QuickBooks API error', resp.status, url); return null; }
        return await resp.json();
    } catch (e) { console.warn('QuickBooks apiFetch', url, e); return null; }
}

function navTo(page) {
    var t = sessionStorage.getItem('token') || localStorage.getItem('sc_token') || '';
    var u = sessionStorage.getItem('username') || localStorage.getItem('sc_username') || '';
    var p = sessionStorage.getItem('profile') || localStorage.getItem('sc_profile') || '';
    window.location.href = page + '#t=' + encodeURIComponent(t) + '&u=' + encodeURIComponent(u) + '&p=' + encodeURIComponent(p);
}

document.getElementById('backBtn').addEventListener('click', function(e) {
    e.preventDefault();
    navTo('command.html');
});

var CATEGORIES = ['subscription_revenue', 'token_sales', 'gkm_donations', 'coach_payouts', 'corporate_revenue'];

var _refreshExpiresAt = null;
var _refreshCountdownTimer = null;

async function loadStatus() {
    var data = await apiFetch('/api/admin/quickbooks/status');
    var el = document.getElementById('statusContent');
    var btnConnect = document.getElementById('btnConnect');
    var btnDisconnect = document.getElementById('btnDisconnect');
    if (!data) {
        el.innerHTML = '<div style="color:var(--red);">Failed to load status. Check console.</div>';
        return;
    }
    var connected = data.connected === true;
    btnConnect.style.display = connected ? 'none' : 'inline-flex';
    btnDisconnect.style.display = connected ? 'inline-flex' : 'none';
    if (connected) {
        el.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:16px;">' +
            '<div><span style="color:var(--green);font-weight:600;">● Connected</span></div>' +
            '<div><span style="color:var(--text-secondary);">Company:</span> <span style="color:var(--gold);">' + (data.company_name || '—') + '</span></div>' +
            '<div><span style="color:var(--text-secondary);">Last sync:</span> <span>' + (data.last_sync_at ? data.last_sync_at.replace('T',' ').substring(0,19) : '—') + '</span></div>' +
            '<div><span style="color:var(--text-secondary);">Token health:</span> <span style="color:' + (data.token_healthy ? 'var(--green)' : 'var(--red)') + ';">' + (data.token_healthy ? 'Healthy' : 'Expired / needs refresh') + '</span></div>' +
            '</div>';
        updateRefreshTokenCard(data);
    } else {
        el.innerHTML = '<div style="color:var(--text-secondary);">' +
            '<span style="color:var(--red);font-weight:600;">● Disconnected</span><br>' +
            'Connect to QuickBooks to sync revenue, donations, and payouts.</div>';
        document.getElementById('refreshTokenCard').style.display = 'none';
    }
}

function updateRefreshTokenCard(data) {
    var card = document.getElementById('refreshTokenCard');
    if (!data.refresh_token_expires_at) { card.style.display = 'none'; return; }
    card.style.display = '';

    var issued = data.refresh_token_issued_at ? new Date(data.refresh_token_issued_at) : null;
    var expires = new Date(data.refresh_token_expires_at);
    _refreshExpiresAt = expires;

    var issuedStr = issued ? issued.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
    var expiresStr = expires.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    document.getElementById('refreshIssuedLabel').textContent = 'Issued: ' + issuedStr;
    document.getElementById('refreshExpiresLabel').textContent = 'Expires: ' + expiresStr;

    if (_refreshCountdownTimer) clearInterval(_refreshCountdownTimer);
    tickRefreshCountdown();
    _refreshCountdownTimer = setInterval(tickRefreshCountdown, 1000);
}

function tickRefreshCountdown() {
    if (!_refreshExpiresAt) return;
    var now = new Date();
    var diff = _refreshExpiresAt.getTime() - now.getTime();
    var el = document.getElementById('refreshCountdown');
    var bar = document.getElementById('refreshProgressBar');
    var icon = document.getElementById('refreshIcon');

    if (diff <= 0) {
        el.textContent = 'EXPIRED';
        el.style.color = 'var(--red)';
        bar.style.width = '0%';
        bar.style.background = 'var(--red)';
        icon.style.color = 'var(--red)';
        return;
    }

    var totalDays = 100;
    var daysLeft = diff / (1000 * 60 * 60 * 24);
    var pct = Math.max(0, Math.min(100, (daysLeft / totalDays) * 100));

    var d = Math.floor(diff / 86400000);
    var h = Math.floor((diff % 86400000) / 3600000);
    var m = Math.floor((diff % 3600000) / 60000);
    var s = Math.floor((diff % 60000) / 1000);
    el.textContent = d + 'd ' + _pad(h) + 'h ' + _pad(m) + 'm ' + _pad(s) + 's';

    if (daysLeft <= 7) {
        el.style.color = 'var(--red)';
        bar.style.background = 'var(--red)';
        icon.style.color = 'var(--red)';
    } else if (daysLeft <= 21) {
        el.style.color = 'var(--orange)';
        bar.style.background = 'var(--orange)';
        icon.style.color = 'var(--orange)';
    } else {
        el.style.color = 'var(--gold)';
        bar.style.background = 'linear-gradient(90deg, var(--gold-dim), var(--gold))';
        icon.style.color = 'var(--gold)';
    }
    bar.style.width = pct.toFixed(1) + '%';
}

function _pad(n) { return n < 10 ? '0' + n : '' + n; }

document.getElementById('btnRefreshStatus').addEventListener('click', loadStatus);

document.getElementById('btnRefreshToken').addEventListener('click', async function() {
    if (!confirm('Refresh the QuickBooks token now?\n\nThis contacts Intuit to get a new access + refresh token pair and resets the 100-day countdown.')) return;
    var btn = this;
    btn.disabled = true;
    btn.textContent = 'Refreshing...';
    try {
        var resp = await fetch(API + '/api/admin/quickbooks/refresh-token', {
            method: 'POST',
            headers: Object.assign(_authHeaders(), { 'Content-Type': 'application/json' })
        });
        if (resp.status === 401) { window.location.href = 'command.html'; return; }
        if (resp.ok) {
            var data = await resp.json();
            alert('Token refreshed!\n\nNew refresh token expires in ' + (data.refresh_days_remaining || 100) + ' days.');
            loadStatus();
        } else {
            var err = await resp.text();
            alert('Refresh failed: ' + resp.status + '\n' + err);
        }
    } catch (e) {
        alert('Refresh error: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Refresh Now';
    }
});

document.getElementById('btnConnect').addEventListener('click', async function() {
    try {
        var data = await apiFetch('/api/admin/quickbooks/connect');
        if (data && data.oauth_url) {
            window.location.href = data.oauth_url;
        } else {
            alert('Could not get OAuth URL. Check that the backend QuickBooks router is configured.');
        }
    } catch (e) { alert('Connect error: ' + e.message); }
});

document.getElementById('btnDisconnect').addEventListener('click', async function() {
    if (!confirm('Disconnect QuickBooks? You will need to reconnect to sync again.')) return;
    try {
        var resp = await fetch(API + '/api/admin/quickbooks/disconnect', {
            method: 'POST',
            headers: Object.assign(_authHeaders(), { 'Content-Type': 'application/json' })
        });
        if (resp.status === 401) { window.location.href = 'command.html'; return; }
        if (resp.ok) loadStatus();
        else alert('Disconnect failed: ' + resp.status);
    } catch (e) { alert('Disconnect error: ' + e.message); }
});

function getMappingPayload() {
    var out = {};
    CATEGORIES.forEach(function(cat) {
        var idEl = document.getElementById('map_' + cat + '_id');
        var nameEl = document.getElementById('map_' + cat + '_name');
        if (idEl && nameEl) {
            out[cat] = { qb_account_id: (idEl.value || '').trim(), qb_account_name: (nameEl.value || '').trim() };
        }
    });
    return out;
}

document.getElementById('btnSaveMapping').addEventListener('click', async function() {
    var payload = getMappingPayload();
    try {
        var resp = await fetch(API + '/api/admin/quickbooks/account-mapping', {
            method: 'POST',
            headers: Object.assign(_authHeaders(), { 'Content-Type': 'application/json' }),
            body: JSON.stringify(payload)
        });
        if (resp.status === 401) { window.location.href = 'command.html'; return; }
        if (resp.ok) alert('Mappings saved.');
        else alert('Save failed: ' + resp.status);
    } catch (e) { alert('Save error: ' + e.message); }
});

async function loadMapping() {
    var data = await apiFetch('/api/admin/quickbooks/account-mapping');
    if (!data || !data.mappings) return;
    CATEGORIES.forEach(function(cat) {
        var m = data.mappings[cat];
        var idEl = document.getElementById('map_' + cat + '_id');
        var nameEl = document.getElementById('map_' + cat + '_name');
        if (idEl && nameEl && m) {
            idEl.value = m.qb_account_id || '';
            nameEl.value = m.qb_account_name || '';
        }
    });
}

async function loadHistory() {
    var data = await apiFetch('/api/admin/quickbooks/sync/history');
    var tbody = document.getElementById('historyBody');
    if (!data) {
        tbody.innerHTML = '<tr><td colspan="6" style="padding:24px;text-align:center;color:var(--red);">Failed to load history.</td></tr>';
        return;
    }
    var items = data.items || data.history || data || [];
    if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="padding:24px;text-align:center;color:var(--text-secondary);">No sync history yet.</td></tr>';
        updateSyncStats([]);
        return;
    }
    var synced = 0, failed = 0, skipped = 0;
    var html = '';
    items.forEach(function(row) {
        var st = (row.status || '').toLowerCase();
        if (st === 'synced') synced++;
        else if (st === 'failed') failed++;
        else skipped++;
        var badgeClass = st === 'synced' ? 'synced' : (st === 'failed' ? 'failed' : 'skipped');
        var created = (row.created_at || '').replace('T', ' ').substring(0, 19);
        html += '<tr>' +
            '<td>' + (row.sync_type || '—') + '</td>' +
            '<td>' + (row.source_table || '—') + '</td>' +
            '<td>' + (row.qb_entity_type || '—') + '</td>' +
            '<td>' + (row.amount != null ? '$' + parseFloat(row.amount).toFixed(2) : '—') + '</td>' +
            '<td><span class="status-badge ' + badgeClass + '">' + (row.status || '—') + '</span></td>' +
            '<td>' + created + '</td>' +
            '</tr>';
    });
    tbody.innerHTML = html;
    updateSyncStats(items);
}

function updateSyncStats(items) {
    var synced = 0, failed = 0, skipped = 0;
    items.forEach(function(row) {
        var st = (row.status || '').toLowerCase();
        if (st === 'synced') synced++;
        else if (st === 'failed') failed++;
        else skipped++;
    });
    document.getElementById('stat-synced').textContent = synced;
    document.getElementById('stat-failed').textContent = failed;
    document.getElementById('stat-skipped').textContent = skipped;
}

document.getElementById('btnRefreshHistory').addEventListener('click', loadHistory);

document.getElementById('btnTriggerSync').addEventListener('click', async function() {
    try {
        var resp = await fetch(API + '/api/admin/quickbooks/sync/trigger', {
            method: 'POST',
            headers: Object.assign(_authHeaders(), { 'Content-Type': 'application/json' })
        });
        if (resp.status === 401) { window.location.href = 'command.html'; return; }
        if (resp.ok) { alert('Sync triggered.'); loadHistory(); loadStatus(); }
        else alert('Trigger failed: ' + resp.status);
    } catch (e) { alert('Sync error: ' + e.message); }
});

// Check for OAuth callback params
(function() {
    var params = new URLSearchParams(location.search);
    if (params.get('code') || params.get('state')) {
        // Likely returned from OAuth; status will show connected after callback processing
        setTimeout(loadStatus, 500);
    }
})();

loadStatus();
loadMapping();
loadHistory();
</script>
</body>
</html>
