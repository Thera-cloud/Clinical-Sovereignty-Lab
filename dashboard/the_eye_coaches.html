<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Command | The Eye - Coach Performance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #0A0A0A; --bg-card: #111111; --bg-elevated: #1A1A1A;
            --gold: #FFD700; --gold-dim: rgba(255, 215, 0, 0.2);
            --red-critical: #FF3B3B; --red-dim: rgba(255, 59, 59, 0.15);
            --cyan: #00D4FF; --cyan-dim: rgba(0, 212, 255, 0.1);
            --green: #00FF88; --green-dim: rgba(0, 255, 136, 0.1);
            --orange: #FF9500; --purple: #9D4EDD; --purple-dim: rgba(157, 78, 221, 0.15);
            --text-primary: #FFFFFF; --text-secondary: #888888; --border: #252525;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; }
        .header { background: linear-gradient(180deg, #1A1A10 0%, #0A0A0A 100%); border-bottom: 1px solid var(--gold-dim); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--gold), #FF8C00); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .logo-text { font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: 2px; }
        .page-title { font-size: 14px; color: var(--text-secondary); }
        .btn { padding: 10px 20px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; display: inline-block; }
        .btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
        .sub-nav { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; gap: 24px; }
        .sub-nav-item { padding: 14px 0; font-size: 12px; color: var(--text-secondary); border-bottom: 2px solid transparent; cursor: pointer; }
        .sub-nav-item.active { color: var(--gold); border-bottom-color: var(--gold); }
        .main-content { padding: 24px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .card-body { padding: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { padding: 20px; background: var(--bg-elevated); border-radius: 12px; text-align: center; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--gold); }
        .stat-label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; margin-top: 8px; }
        .coach-grid { display: grid; gap: 16px; }
        .coach-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .coach-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .coach-avatar { width: 48px; height: 48px; background: var(--gold-dim); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 12px; }
        .coach-name { font-size: 16px; font-weight: 600; }
        .coach-email { font-size: 11px; color: var(--text-secondary); }
        .coach-specialty { font-size: 10px; color: var(--purple); margin-top: 2px; }
        .coach-status { padding: 4px 12px; border-radius: 12px; font-size: 10px; font-weight: 600; }
        .status-active { background: var(--green-dim); color: var(--green); }
        .status-inactive { background: var(--red-dim); color: var(--red-critical); }
        .coach-metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 12px; }
        .metric { text-align: center; padding: 10px; background: var(--bg-dark); border-radius: 8px; }
        .metric-value { font-size: 18px; font-weight: 600; }
        .metric-value.good { color: var(--green); }
        .metric-value.medium { color: var(--gold); }
        .metric-value.low { color: var(--red-critical); }
        .metric-label { font-size: 8px; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; }
        /* Patent 4 Supervision Panel */
        .supervision-panel { margin-top: 12px; padding: 12px; background: var(--bg-dark); border-radius: 8px; border-left: 3px solid var(--purple); }
        .supervision-title { font-size: 9px; color: var(--purple); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 600; }
        .supervision-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 10px; }
        .technique-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        .technique-tag { padding: 2px 8px; border-radius: 4px; font-size: 8px; font-weight: 600; }
        .technique-tag.eft { background: var(--cyan-dim); color: var(--cyan); }
        .technique-tag.ifs { background: var(--purple-dim); color: var(--purple); }
        .technique-tag.cbt { background: var(--green-dim); color: var(--green); }
        .technique-tag.polyvagal { background: var(--gold-dim); color: var(--gold); }
        .technique-tag.somatic { background: rgba(255,149,0,0.15); color: var(--orange); }
        .technique-tag.reflective { background: var(--cyan-dim); color: var(--cyan); }
        .technique-tag.validation { background: var(--green-dim); color: var(--green); }
        .presence-score { display: inline-flex; align-items: center; gap: 6px; }
        .presence-bar { width: 60px; height: 6px; background: var(--bg-elevated); border-radius: 3px; overflow: hidden; display: inline-block; }
        .presence-fill { height: 100%; border-radius: 3px; }
        .badge-sm { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 9px; font-weight: 600; }
        .badge-sm.green { background: var(--green-dim); color: var(--green); }
        .badge-sm.gold { background: var(--gold-dim); color: var(--gold); }
        .badge-sm.red { background: var(--red-dim); color: var(--red-critical); }
        .badge-sm.cyan { background: var(--cyan-dim); color: var(--cyan); }
        .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">&#x1F441;&#xFE0F;</div>
            <div>
                <div class="logo-text">THE EYE</div>
                <div class="page-title">Coach Performance Analytics</div>
            </div>
        </div>
        <a href="the_eye.html" class="btn btn-secondary">&larr; Back to The Eye</a>
    </header>
    <nav class="sub-nav">
        <div class="sub-nav-item" onclick="location.href='the_eye.html'" style="cursor:pointer;">Overview</div>
        <div class="sub-nav-item active">Coaches</div>
        <div class="sub-nav-item" onclick="location.href='the_eye_tokens.html'">Tokens</div>
        <div class="sub-nav-item" onclick="location.href='the_eye_monitor.html'">Live Monitor</div>
        <div class="sub-nav-item" onclick="location.href='the_eye_crisis.html'">Crisis</div>
        <div class="sub-nav-item" onclick="location.href='the_eye_community.html'">Community</div>
    </nav>
    <main class="main-content">
        <div id="stats" class="stats-grid"></div>
        <div class="card">
            <div class="card-header"><div class="card-title">&#x1F468;&#x200D;&#x2695;&#xFE0F; Coach Performance &amp; Clinical Supervision</div></div>
            <div class="card-body"><div id="coaches" class="coach-grid"><div class="empty-state">Connecting to server...</div></div></div>
        </div>
    </main>
    <script>
    (function() {
        "use strict";
        var username = sessionStorage.getItem("username");
        var password = sessionStorage.getItem("password");
        var profile = JSON.parse(sessionStorage.getItem("profile") || "{}");
        if (!username) { window.location.href = "index.html"; return; }
        if (profile.role !== "ADMIN") { alert("Admin access required"); window.location.href = "command.html"; return; }

        function getWsUrl() {
            var h = location.hostname;
            if (!h || h === "localhost" || h === "127.0.0.1" || location.protocol === "file:") return "wss://api.sovereignsanctuary.net/ws";
            if (h.indexOf("sovereignsanctuary") >= 0) return "wss://" + h + "/ws";
            return (location.protocol === "https:" ? "wss" : "ws") + "://" + h + ":8765";
        }

        function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
        var ws = null, authenticated = false;
        var learningQueue = {};

        function connect() {
            ws = new WebSocket(getWsUrl());
            ws.onopen = function() {
                ws.send(JSON.stringify({ type: "login_request", username: username, password: password, expected_role: "ADMIN", hardware_id: profile.hardware_id || "WEB_ADMIN" }));
            };
            ws.onmessage = function(event) {
                var data; try { data = JSON.parse(event.data); } catch(e) { return; }
                if (data.type === "login_success" || data.type === "auth_success") {
                    authenticated = true;
                    ws.send(JSON.stringify({ type: "admin_get_stats" }));
                    ws.send(JSON.stringify({ type: "admin_get_coach_learning_queue" }));
                    return;
                }
                if (data.type === "admin_stats") {
                    displayStats(data.stats || {});
                    ws.send(JSON.stringify({ type: "admin_get_users" }));
                    return;
                }
                if ((data.type === "admin_users" || data.type === "admin_users_list") && data.users) {
                    var coaches = data.users.filter(function(u) { return u.role === "COACH"; });
                    displayCoaches(coaches);
                    return;
                }
                if (data.type === "admin_coach_learning_queue") {
                    (data.entries || []).forEach(function(e) {
                        if (!learningQueue[e.coach_id]) learningQueue[e.coach_id] = [];
                        learningQueue[e.coach_id].push(e);
                    });
                    return;
                }
            };
            ws.onclose = function() { authenticated = false; setTimeout(connect, 2000); };
        }

        function displayStats(stats) {
            var totalCoaches = stats.coaches_count || 0;
            var activeToday = stats.coaches_active_today || 0;
            var totalClients = stats.clients_count || 0;
            var sessionsToday = stats.sessions_today || (stats.platform_totals && stats.platform_totals.total_sessions) || 0;
            var liveSessions = stats.live_sessions || 0;
            document.getElementById("stats").innerHTML =
                '<div class="stat-card"><div class="stat-value">' + totalCoaches + '</div><div class="stat-label">Total Coaches</div></div>' +
                '<div class="stat-card"><div class="stat-value" style="color:var(--green);">' + activeToday + '</div><div class="stat-label">Active Today</div></div>' +
                '<div class="stat-card"><div class="stat-value" style="color:var(--cyan);">' + totalClients + '</div><div class="stat-label">Total Clients</div></div>' +
                '<div class="stat-card"><div class="stat-value" style="color:var(--orange);">' + sessionsToday + '</div><div class="stat-label">Sessions Today</div></div>' +
                '<div class="stat-card"><div class="stat-value" style="color:var(--green);">' + liveSessions + '</div><div class="stat-label">Live Now</div></div>';
        }

        function displayCoaches(coaches) {
            if (coaches.length === 0) { document.getElementById("coaches").innerHTML = '<div class="empty-state">No coaches found in system</div>'; return; }
            document.getElementById("coaches").innerHTML = coaches.map(function(coach) {
                var coachId = coach.id || coach.user_id || coach.hardware_id;
                var name = coach.name || "Unnamed Coach";
                var email = coach.email || "No email";
                var status = coach.subscription_status || "inactive";
                var clients = coach.client_count || 0;
                var sessions = coach.total_sessions || 0;
                var tier = coach.subscription_plan || coach.tier || "STANDARD";
                // Patent 4 supervision metrics (from backend when available)
                var presence = coach.therapeutic_presence_score || 0;
                var talkRatio = coach.talk_time_ratio || 0;
                var reflections = coach.reflection_frequency || 0;
                var techniques = coach.detected_techniques || [];
                var devAssignments = coach.dev_assignments_pending || 0;
                var queue = learningQueue[coachId] || [];
                var pendingLearning = queue.filter(function(e){ return e.status === "pending"; }).length;

                var presenceClass = presence >= 7 ? "good" : presence >= 5 ? "medium" : "low";
                var presenceColor = presence >= 7 ? "var(--green)" : presence >= 5 ? "var(--gold)" : "var(--red-critical)";

                var html = '<div class="coach-card">';
                html += '<div class="coach-header"><div style="display:flex;align-items:center;"><div class="coach-avatar">\uD83D\uDC68\u200D\u2695\uFE0F</div><div><div class="coach-name">' + esc(name) + '</div><div class="coach-email">' + esc(email) + '</div>';
                if (coach.specialty) html += '<div class="coach-specialty">' + esc(coach.specialty) + '</div>';
                html += '</div></div>';
                html += '<span class="coach-status ' + (status === "active" ? "status-active" : "status-inactive") + '">' + esc(status) + '</span></div>';
                // Core metrics
                html += '<div class="coach-metrics">';
                html += '<div class="metric"><div class="metric-value" style="color:var(--cyan);">' + clients + '</div><div class="metric-label">Clients</div></div>';
                html += '<div class="metric"><div class="metric-value" style="color:var(--gold);">' + sessions + '</div><div class="metric-label">Sessions</div></div>';
                html += '<div class="metric"><div class="metric-value">' + esc(tier) + '</div><div class="metric-label">Tier</div></div>';
                html += '<div class="metric"><div class="metric-value ' + presenceClass + '">' + (presence ? presence.toFixed(1) : "\u2014") + '</div><div class="metric-label">Presence Score</div></div>';
                html += '<div class="metric"><div class="metric-value" style="color:var(--cyan);">' + (talkRatio ? (talkRatio * 100).toFixed(0) + "%" : "\u2014") + '</div><div class="metric-label">Talk Ratio</div></div>';
                html += '</div>';
                // Patent 4 Supervision Panel
                html += '<div class="supervision-panel">';
                html += '<div class="supervision-title">Patent 4: Clinical Supervision (Automated)</div>';
                html += '<div class="supervision-row"><span>Therapeutic Presence (0-10)</span><span class="presence-score"><span class="presence-bar"><span class="presence-fill" style="width:' + (presence * 10) + '%;background:' + presenceColor + ';"></span></span> ' + (presence ? presence.toFixed(1) : "\u2014") + '/10</span></div>';
                html += '<div class="supervision-row"><span>Reflection Frequency</span><span>' + (reflections ? reflections + "/session" : "\u2014") + '</span></div>';
                html += '<div class="supervision-row"><span>Dev Assignments Pending</span><span>' + (devAssignments || "\u2014") + '</span></div>';
                html += '<div class="supervision-row"><span>Night School Queue</span><span>' + (pendingLearning > 0 ? '<span class="badge-sm gold">' + pendingLearning + ' pending</span>' : '<span class="badge-sm green">Clear</span>') + '</span></div>';
                html += '<div class="supervision-row"><span>Detected Modalities</span></div>';
                html += '<div class="technique-tags">';
                if (techniques.length > 0) {
                    techniques.forEach(function(t) {
                        var cls = t.toLowerCase().replace(/\s+/g, "");
                        if (cls.indexOf("eft") >= 0) cls = "eft";
                        else if (cls.indexOf("ifs") >= 0) cls = "ifs";
                        else if (cls.indexOf("cbt") >= 0) cls = "cbt";
                        else if (cls.indexOf("polyvagal") >= 0) cls = "polyvagal";
                        else if (cls.indexOf("somatic") >= 0) cls = "somatic";
                        else if (cls.indexOf("reflect") >= 0) cls = "reflective";
                        else if (cls.indexOf("valid") >= 0) cls = "validation";
                        else cls = "cbt";
                        html += '<span class="technique-tag ' + cls + '">' + esc(t) + '</span>';
                    });
                } else {
                    html += '<span style="font-size:9px;color:var(--text-secondary);">Awaiting session data for technique detection</span>';
                }
                html += '</div>';
                html += '</div>';
                html += '</div>';
                return html;
            }).join('');
        }

        connect();
    })();
    </script>
</body>
</html>
