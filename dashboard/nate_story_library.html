<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Nate's Story Library</title>
<meta name="description" content="Editorial stories from Little Nate Dispatch — education, not therapy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--void:#050505;--gold:#C9A962;--gold-dim:#8B7355;--cyan:#4ECDC4;--text:#E8D5A3}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#111 0%,var(--void) 55%);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
header{padding:48px 24px 24px;max-width:800px;margin:0 auto}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(2.2rem,5vw,3.4rem);color:var(--gold);margin:0 0 8px;font-weight:600}
.sub{color:var(--gold-dim);max-width:36rem;line-height:1.5}
main{max-width:800px;margin:0 auto;padding:0 24px 64px}
.issue{border-top:1px solid #222;padding:20px 0;display:flex;gap:16px;align-items:flex-start}
.issue img{width:96px;height:96px;object-fit:cover;border-radius:4px;background:#111;flex-shrink:0}
.issue .copy{min-width:0}
.issue a{color:var(--cyan);text-decoration:none;font-family:'Cormorant Garamond',serif;font-size:1.35rem}
.issue a:hover{text-decoration:underline}
.meta{font-size:.85rem;color:var(--gold-dim);margin-top:6px}
footer{max-width:800px;margin:0 auto;padding:24px;font-size:.8rem;color:#666;border-top:1px solid #1a1a1a}
footer a{color:var(--gold-dim)}
.err{color:#EF4444}
.subbox{margin:24px 0;padding:16px 0;border-top:1px solid #222;border-bottom:1px solid #222}
.subbox label{display:block;font-size:.8rem;color:var(--gold-dim);margin-bottom:6px}
.subbox input{width:100%;max-width:320px;background:#111;border:1px solid #333;color:var(--text);padding:10px 12px;font:inherit;border-radius:2px}
.subbox button{margin-top:10px;background:var(--gold);color:#050505;border:0;padding:10px 18px;font:inherit;cursor:pointer;font-weight:500}
.subbox button:disabled{opacity:.5;cursor:default}
.share a{color:var(--gold-dim);font-size:.8rem;margin-right:10px;text-decoration:none}
.share a:hover{color:var(--cyan)}
#subMsg{font-size:.85rem;margin-top:8px;color:var(--cyan)}
</style>
</head>
<body>
<header>
  <h1>Little Nate's Story Library</h1>
  <p class="sub">Weekly Dispatch issues Nate has already sent — open to read, share, or ask him about in chat. Education and reflection, not medical advice.</p>
  <div class="subbox" id="subscribeBox">
    <label for="subEmail">Get the next Dispatch by email</label>
    <input id="subEmail" type="email" placeholder="you@example.com" autocomplete="email">
    <button type="button" id="subBtn" onclick="doSubscribe()">Subscribe</button>
    <div id="subMsg"></div>
  </div>
</header>
<main id="list"><p class="meta">Loading…</p></main>
<footer>
  Little Nate is an AI companion. Crisis support: <a href="https://988lifeline.org">988 Lifeline</a> ·
  Veterans: 988 then press 1 ·
  <a href="https://findahelpline.com">findahelpline.com</a> ·
  <a href="/api/newsletter/rss">RSS</a>
</footer>
<script>
var API=(location.hostname.indexOf('sovereignsanctuary')>=0)
  ? 'https://api.sovereignsanctuary.net' : '';
function qs(name){
  try{return new URLSearchParams(location.search).get(name)||'';}catch(e){return '';}
}
async function doSubscribe(){
  var email=(document.getElementById('subEmail').value||'').trim();
  var msg=document.getElementById('subMsg');
  var btn=document.getElementById('subBtn');
  if(!email||email.indexOf('@')<0){msg.textContent='Enter a valid email.';return;}
  btn.disabled=true;msg.textContent='Sending confirmation…';
  try{
    var r=await fetch(API+'/api/newsletter/subscribe',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        email:email,
        source:'story_library',
        utm_source:qs('utm_source')||'library',
        utm_medium:qs('utm_medium')||'web',
        utm_campaign:qs('utm_campaign')||'dispatch',
        ref:qs('ref')||null
      })
    });
    var d=await r.json().catch(function(){return {};});
    msg.textContent=(d.message||'If eligible, a confirmation was sent.');
  }catch(e){
    msg.textContent='Could not subscribe right now.';
  }
  btn.disabled=false;
}
(async function(){
  if(qs('subscribe')==='1'){
    try{document.getElementById('subscribeBox').scrollIntoView({behavior:'smooth'});}catch(e){}
  }
  var el=document.getElementById('list');
  try{
    var r=await fetch(API+'/api/newsletter/library?limit=40');
    if(!r.ok) throw new Error('HTTP '+r.status);
    var d=await r.json();
    var issues=d.issues||d||[];
    if(!issues.length){el.innerHTML='<p class="meta">No published issues yet.</p>';return;}
    el.innerHTML=issues.map(function(i){
      var slug=i.slug||'';
      var title=i.subject_line||i.topic||slug;
      var when=i.sent_at||i.created_at||'';
      var href=API+'/api/newsletter/library/'+encodeURIComponent(slug)+'/page';
      var shareBase=API+'/api/newsletter/share?slug='+encodeURIComponent(slug)+'&channel=';
      var thumb=i.hero_image_url
        ? '<img src="'+i.hero_image_url+'" alt="" loading="lazy">'
        : '';
      return '<article class="issue">'+thumb+'<div class="copy"><a href="'+href+'">'+title.replace(/</g,'&lt;')+'</a>'
        +'<div class="meta">'+(when?String(when).slice(0,10):'')+(i.topic?' · '+String(i.topic).replace(/</g,'&lt;'):'')+'</div>'
        +'<div class="share">'
        +'<a href="'+shareBase+'x">X</a>'
        +'<a href="'+shareBase+'facebook">Facebook</a>'
        +'<a href="'+shareBase+'linkedin">LinkedIn</a>'
        +'<a href="'+shareBase+'whatsapp">WhatsApp</a>'
        +'<a href="'+shareBase+'email">Email</a>'
        +'</div></div></article>';
    }).join('');
  }catch(e){
    el.innerHTML='<p class="err">Library unavailable right now.</p>';
  }
})();
</script>
</body>
</html>
