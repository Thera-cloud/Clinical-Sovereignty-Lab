<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thera-World Studio — Sovereign Sanctuary</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --bg:     #050505;
  --card:   #0A0A0A;
  --raised: #111111;
  --border: #1a1a1a;
  --gold:   #C9A962;
  --gold-b: #E8D5A3;
  --gold-d: #8B7355;
  --cyan:   #4ECDC4;
  --purple: #9D4EDD;
  --red:    #EF4444;
  --green:  #22C55E;
  --t1:     #f0ece4;
  --t2:     #a0998d;
  --t3:     #605a50;
  --mono:   'SF Mono', 'Fira Code', monospace;
  --body:   'DM Sans', system-ui, sans-serif;
  --head:   'Cormorant Garamond', Georgia, serif;
  --rs:     8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--t1); font-family:var(--body); font-size:14px; min-height:100vh; }
::selection { background:var(--gold); color:var(--bg); }
a { color:var(--gold); text-decoration:none; }
a:hover { color:var(--gold-b); }
button { font-family:var(--body); cursor:pointer; }
.topbar { display:flex; align-items:center; gap:16px; padding:12px 24px; background:var(--card); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
.topbar h1 { font-family:var(--head); font-size:22px; color:var(--gold); font-weight:400; }
.topbar .nav-link { font-size:13px; color:var(--t2); }
.topbar .nav-link:hover { color:var(--gold); }
.topbar .cost-banner { margin-left:auto; font-size:12px; color:var(--t2); font-family:var(--mono); }
.tab-bar { display:flex; gap:0; background:var(--card); border-bottom:1px solid var(--border); padding:0 24px; }
.tab-btn { padding:10px 20px; font-size:13px; color:var(--t3); background:none; border:none; border-bottom:2px solid transparent; transition:all .2s; }
.tab-btn:hover { color:var(--t2); }
.tab-btn.active { color:var(--gold); border-bottom-color:var(--gold); }
.main { padding:24px; max-width:1400px; margin:0 auto; }
.panel { background:var(--card); border:1px solid var(--border); border-radius:var(--rs); padding:20px; margin-bottom:16px; }
.panel h2 { font-family:var(--head); font-size:18px; color:var(--gold-b); margin-bottom:12px; font-weight:400; }
.btn { padding:8px 16px; border-radius:6px; border:1px solid var(--gold-d); background:var(--raised); color:var(--gold); font-size:12px; transition:all .2s; }
.btn:hover { background:var(--gold); color:var(--bg); }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.btn-sm { padding:5px 12px; font-size:11px; }
.btn-danger { border-color:var(--red); color:var(--red); }
.btn-danger:hover { background:var(--red); color:#fff; }
textarea, input[type="text"], select {
  background:var(--raised); border:1px solid var(--border); color:var(--t1); border-radius:6px;
  padding:10px 12px; font-family:var(--body); font-size:13px; width:100%; resize:vertical;
}
textarea:focus, input:focus, select:focus { outline:none; border-color:var(--gold-d); }
.grid-3 { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:16px; }
.scene-card { background:var(--raised); border:1px solid var(--border); border-radius:var(--rs); overflow:hidden; }
.scene-card .card-header { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.scene-card .card-header .scene-num { color:var(--gold); font-family:var(--mono); font-size:11px; }
.scene-card .card-header .mood { font-size:10px; color:var(--purple); background:rgba(157,78,221,.15); padding:2px 8px; border-radius:10px; }
.scene-card .card-body { padding:16px; }
.scene-card .desc { font-size:12px; color:var(--t2); line-height:1.5; max-height:80px; overflow:hidden; margin-bottom:12px; }
.scene-card .media-preview { width:100%; aspect-ratio:16/9; background:var(--bg); border-radius:6px; overflow:hidden; display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
.scene-card .media-preview img { width:100%; height:100%; object-fit:cover; }
.scene-card .card-actions { display:flex; gap:8px; flex-wrap:wrap; }
.lib-item { background:var(--raised); border:1px solid var(--border); border-radius:var(--rs); overflow:hidden; cursor:pointer; transition:border-color .2s; }
.lib-item:hover { border-color:var(--gold-d); }
.lib-item .thumb { width:100%; aspect-ratio:16/9; background:var(--bg); display:flex; align-items:center; justify-content:center; overflow:hidden; }
.lib-item .thumb img { width:100%; height:100%; object-fit:cover; }
.lib-item .meta { padding:10px 12px; font-size:11px; color:var(--t2); }
.modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.7); z-index:200; display:flex; align-items:center; justify-content:center; }
.modal { background:var(--card); border:1px solid var(--border); border-radius:var(--rs); max-width:800px; width:90%; max-height:80vh; overflow:auto; padding:24px; }
.modal h3 { font-family:var(--head); color:var(--gold); margin-bottom:12px; }
.spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--gold-d); border-top-color:var(--gold); border-radius:50%; animation:spin .6s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.split { display:flex; gap:16px; }
.split .left { flex:7; }
.split .right { flex:3; }
.content-item { padding:8px 12px; font-size:12px; color:var(--t2); cursor:pointer; border-radius:4px; margin-bottom:4px; }
.content-item:hover { background:var(--border); color:var(--t1); }
.collapse-header { cursor:pointer; font-size:13px; color:var(--gold-d); padding:8px 0; border-bottom:1px solid var(--border); margin-bottom:8px; user-select:none; }
.collapse-header:hover { color:var(--gold); }
.filter-tabs { display:flex; gap:8px; margin-bottom:16px; }
.filter-tab { padding:6px 14px; font-size:12px; border-radius:20px; border:1px solid var(--border); background:none; color:var(--t3); cursor:pointer; }
.filter-tab.active { border-color:var(--gold-d); color:var(--gold); background:rgba(201,169,98,.1); }
.badge { font-size:10px; padding:2px 8px; border-radius:10px; }
.badge-green { background:rgba(34,197,94,.15); color:var(--green); }
.badge-red { background:rgba(239,68,68,.15); color:var(--red); }
.badge-gold { background:rgba(201,169,98,.15); color:var(--gold); }
.empty-state { text-align:center; padding:48px; color:var(--t3); font-size:14px; }
@media (max-width:768px) { .split { flex-direction:column; } .grid-3 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const API = location.origin;

function _recoverAuth() {
  if (sessionStorage.getItem('sc_token')) return;
  const hash = location.hash.slice(1);
  if (hash) {
    const ps = new URLSearchParams(hash);
    if (ps.get('t')) { try { sessionStorage.setItem('sc_token', ps.get('t')); } catch(e){} }
    if (ps.get('u')) { try { sessionStorage.setItem('username', ps.get('u')); } catch(e){} }
    if (ps.get('p')) { try { sessionStorage.setItem('profile', ps.get('p')); } catch(e){} }
    if (ps.get('t')) return;
  }
  ['sc_token','sc_username','sc_profile'].forEach(k => {
    const v = localStorage.getItem(k);
    if (v) { try { sessionStorage.setItem(k === 'sc_token' ? 'sc_token' : k === 'sc_username' ? 'username' : 'profile', v); } catch(e){} }
  });
  if (sessionStorage.getItem('sc_token')) return;
  const ck = document.cookie.split(';').reduce((a,c) => { const [k,v] = c.trim().split('='); a[k] = decodeURIComponent(v||''); return a; }, {});
  if (ck.sc_token) { try { sessionStorage.setItem('sc_token', ck.sc_token); } catch(e){} }
  if (ck.sc_username) { try { sessionStorage.setItem('username', ck.sc_username); } catch(e){} }
  if (ck.sc_profile) { try { sessionStorage.setItem('profile', ck.sc_profile); } catch(e){} }
}
_recoverAuth();

function _authHeaders(ct) {
  const t = sessionStorage.getItem('sc_token') || localStorage.getItem('sc_token') || '';
  const h = { 'Authorization': 'Bearer ' + t };
  if (ct) h['Content-Type'] = ct;
  return h;
}

function navTo(page) {
  const t = sessionStorage.getItem('sc_token') || localStorage.getItem('sc_token') || '';
  const u = sessionStorage.getItem('username') || localStorage.getItem('sc_username') || '';
  const p = sessionStorage.getItem('profile') || localStorage.getItem('sc_profile') || '';
  try { localStorage.setItem('sc_token', t); } catch(e) {}
  try { localStorage.setItem('sc_username', u); } catch(e) {}
  try { localStorage.setItem('sc_profile', p); } catch(e) {}
  const ckOpts = '; path=/; max-age=86400; samesite=strict' + (location.protocol === 'https:' ? '; secure' : '');
  document.cookie = 'sc_token=' + encodeURIComponent(t) + ckOpts;
  document.cookie = 'sc_username=' + encodeURIComponent(u) + ckOpts;
  document.cookie = 'sc_profile=' + encodeURIComponent(p) + ckOpts;
  window.location.href = page;
}

async function apiFetch(path, opts = {}) {
  try {
    const r = await fetch(API + path, { ...opts, headers: { ..._authHeaders(opts.ct), ...opts.headers } });
    if (!r.ok) {
      const txt = await r.text().catch(() => '');
      throw new Error(`${r.status}: ${txt.slice(0, 200)}`);
    }
    return await r.json();
  } catch (e) { console.warn('apiFetch', path, e); throw e; }
}

function asJsonArray(v) {
  if (Array.isArray(v)) return v;
  if (v == null || v === '') return [];
  if (typeof v === 'string') {
    try {
      const p = JSON.parse(v);
      return Array.isArray(p) ? p : [];
    } catch (e) { return []; }
  }
  return [];
}

function normalizeRecapJob(job) {
  if (!job) return null;
  return {
    ...job,
    segment_clips: asJsonArray(job.segment_clips),
    panel_alignments: asJsonArray(job.panel_alignments),
    chat_captures: asJsonArray(job.chat_captures),
  };
}

function recapClipSummary(job) {
  const clips = asJsonArray(job?.segment_clips);
  const need = job?.segment_count || 4;
  let grok = 0, kb = 0, failed = 0, pending = 0;
  for (let i = 0; i < need; i++) {
    const c = clips[i];
    if (!c || !(c.video_url || c.r2_key)) { pending++; continue; }
    if (c.status === 'grok') grok++;
    else if (c.status === 'ken_burns') kb++;
    else failed++;
  }
  return { clips, need, grok, kb, failed, pending, ready: grok + kb + failed };
}

function dText(d) {
  if (!d) return '';
  if (typeof d === 'string') return d;
  if (Array.isArray(d)) return d.filter(x => x && x.text).map(x => x.text).join(' ');
  if (d.text) return d.text;
  return '';
}
function dHas(d) { return !!dText(d); }
function dVoice(d) {
  if (!d) return 'narrator';
  if (typeof d === 'string') return 'narrator';
  if (Array.isArray(d) && d.length > 0 && d[0].voice) return d[0].voice;
  if (d.voice) return d.voice;
  return 'narrator';
}

// ═══════════════════════════════════════════════════════════════════
//  SCRIPT TAB
// ═══════════════════════════════════════════════════════════════════
function ScriptTab({ scenes, setScenes, setTab, setRecapJobId, setRecapArchetype, recapJobId }) {
  const [script, setScript] = useState('');
  const [prompt, setPrompt] = useState('');
  const [clientUser, setClientUser] = useState('');
  const [dragOver, setDragOver] = useState(false);
  const [sources, setSources] = useState(null);
  const [selectedSources, setSelectedSources] = useState(['plots','characters','biomes','workbooks','npcs']);
  const [loading, setLoading] = useState('');
  const [presets, setPresets] = useState([]);
  const [collapsed, setCollapsed] = useState({});
  const [videoIngestMode, setVideoIngestMode] = useState(() => {
    try { return sessionStorage.getItem('studio_video_ingest_mode') || 'audio_driven'; }
    catch (e) { return 'audio_driven'; }
  });

  const setVideoIngestModePersist = (mode) => {
    setVideoIngestMode(mode);
    try { sessionStorage.setItem('studio_video_ingest_mode', mode); } catch (e) {}
  };

  useEffect(() => {
    apiFetch('/api/sse/admin/studio/content-sources').then(setSources).catch(() => {});
    apiFetch('/api/sse/admin/studio/presets').then(setPresets).catch(() => {});
  }, []);

  const toggleCollapse = (k) => setCollapsed(p => ({...p, [k]: !p[k]}));

  const loadPreset = async (name) => {
    try {
      const data = await apiFetch('/api/sse/admin/studio/presets/' + name);
      setScenes(data.scenes || []);
      setScript(data.scenes.map(s => `Scene ${s.scene}: ${s.title}\n${s.prompt}\nMood: ${s.mood}\nDuration: ${s.duration}s\n`).join('\n'));
    } catch (e) { alert('Failed to load preset: ' + e.message); }
  };

  const generateScript = async () => {
    if (!prompt.trim()) return;
    setLoading('script');
    try {
      const d = await apiFetch('/api/sse/admin/studio/generate-script', {
        method: 'POST', ct: 'application/json',
        body: JSON.stringify({ prompt, content_sources: selectedSources })
      });
      setScenes(d.scenes || []);
      if (d.scenes?.length) {
        setScript(d.scenes.map(s => `Scene ${s.scene}: ${s.title}\n${s.description}\nDialogue: ${dText(s.dialogue)}\nMood: ${s.mood}\nDuration: ${s.duration}s\n`).join('\n'));
      } else if (d.raw) { setScript(d.raw); }
    } catch (e) { alert('Script generation failed: ' + e.message); }
    setLoading('');
  };

  const breakScenes = async () => {
    if (!script.trim()) return;
    setLoading('break');
    try {
      const d = await apiFetch('/api/sse/admin/studio/break-scenes', {
        method: 'POST', ct: 'application/json',
        body: JSON.stringify({ script })
      });
      setScenes(d.scenes || []);
    } catch (e) { alert('Scene breaking failed: ' + e.message); }
    setLoading('');
  };

  const insertContent = (text) => setScript(s => s + '\n' + text);

  const pollRecapIngestUntilReady = async (jobId) => {
    const maxAttempts = 180;
    for (let i = 0; i < maxAttempts; i++) {
      const d = await apiFetch('/api/sse/admin/studio/journey-recap/' + jobId);
      const job = d.job || {};
      if (job.status === 'failed') {
        throw new Error(job.error_message || 'Video ingest failed');
      }
      if (d.studio) return d.studio;
      await new Promise(r => setTimeout(r, 4000));
    }
    throw new Error('Ingest still running — check Pipeline tab or retry in a few minutes.');
  };

  const ingestClientVideo = async (file) => {
    if (!file) return;
    const uid = clientUser.trim();
    if (!uid) return alert('Enter the client username before uploading video.');
    setLoading('recap');
    const fd = new FormData();
    fd.append('user_id', uid);
    fd.append('file', file);
    fd.append('ingest_mode', videoIngestMode);
    try {
      const r = await fetch(API + '/api/sse/admin/studio/journey-recap/ingest', {
        method: 'POST', headers: _authHeaders(), body: fd
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.detail || r.statusText || 'Ingest failed');
      if (d.async && d.job_id) {
        setRecapJobId(d.job_id);
        const studio = await pollRecapIngestUntilReady(d.job_id);
        applyRecapIngest({ ...studio, video_duration_seconds: d.video_duration_seconds });
      } else {
        applyRecapIngest(d);
      }
    } catch (e) { alert('Journey recap ingest failed: ' + e.message); }
    setLoading('');
  };

  const applyRecapIngest = (d) => {
    setScript(d.script || '');
    setScenes(d.scenes || []);
    setRecapJobId(d.job_id || null);
    setRecapArchetype(d.archetype || '');
    if (d.scenes?.length) setTab('scenes');
    if (d.ingest_mode === 'audio_driven' && d.target_duration_seconds) {
      console.info('[Studio] Audio-driven recap:', d.segment_count, 'scenes,', d.target_duration_seconds, 's');
    }
  };

  const buildRecapFromTranscript = async (autoRender = false) => {
    const uid = clientUser.trim();
    const text = script.trim();
    if (!uid) return alert('Enter the client username above.');
    if (text.length < 20) return alert('Paste at least a few sentences of transcript in the Script Editor.');
    setLoading(autoRender ? 'recap-render' : 'recap-txt');
    try {
      const d = await apiFetch('/api/sse/admin/studio/journey-recap/ingest-transcript', {
        method: 'POST', ct: 'application/json',
        body: JSON.stringify({ user_id: uid, transcript_text: text })
      });
      applyRecapIngest(d);
      if (autoRender && d.job_id) {
        await apiFetch('/api/sse/admin/studio/journey-recap/' + d.job_id + '/render-all', { method: 'POST' });
        setTab('pipeline');
      }
    } catch (e) { alert('Journey recap from transcript failed: ' + e.message); }
    setLoading('');
  };

  const attachRecapAudio = async (file) => {
    if (!file || !recapJobId) return;
    setLoading('recap-audio');
    const fd = new FormData();
    fd.append('file', file);
    try {
      const r = await fetch(API + '/api/sse/admin/journey-recap/jobs/' + recapJobId + '/audio', {
        method: 'POST', headers: _authHeaders(), body: fd
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.detail || r.statusText || 'Audio upload failed');
      alert('Client audio attached — stitch will mux this track into the final 30s video.');
    } catch (e) { alert('Audio attach failed: ' + e.message); }
    setLoading('');
  };

  const onDrop = (e) => {
    e.preventDefault();
    e.stopPropagation();
    setDragOver(false);
    const f = e.dataTransfer?.files?.[0];
    if (!f) return;
    if (f.type.startsWith('video/') || /\.(mp4|mov|webm|m4v)$/i.test(f.name || '')) {
      ingestClientVideo(f);
    } else {
      alert('Drop a video file (MP4, MOV, WebM) or paste a transcript in the box below.');
    }
  };

  const onDragOver = (e) => {
    e.preventDefault();
    e.stopPropagation();
    setDragOver(true);
  };

  const renderSource = (key, label, items, renderItem) => (
    <div key={key}>
      <div className="collapse-header" onClick={() => toggleCollapse(key)}>
        {collapsed[key] ? '▸' : '▾'} {label} ({items?.length || 0})
      </div>
      {!collapsed[key] && items?.map((item, i) => (
        <div key={i} className="content-item" onClick={() => insertContent(renderItem(item))}>
          {typeof renderItem(item) === 'string' ? renderItem(item).slice(0, 80) : item.title || item.name || item.id}
        </div>
      ))}
    </div>
  );

  return (
    <div className="split">
      <div className="left">
        <div className="panel">
          <h2>Script Editor</h2>
          <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
            <input type="text" placeholder="Client username (required for recap)" value={clientUser}
              onChange={e => setClientUser(e.target.value)} style={{flex:1,minWidth:160}} />
            <label className="btn" style={{cursor:'pointer',margin:0}}>
              {loading==='recap' ? <span className="spinner"/> : 'Upload Video'}
              <input type="file" accept="video/*,.mp4,.mov,.webm" style={{display:'none'}} disabled={!!loading}
                onChange={e => ingestClientVideo(e.target.files?.[0])} />
            </label>
          </div>
          <div style={{display:'flex',gap:16,marginBottom:12,flexWrap:'wrap',alignItems:'center',fontSize:12}}>
            <span style={{color:'var(--t3)'}}>Video ingest:</span>
            <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',color: videoIngestMode==='audio_driven' ? 'var(--cyan)' : 'var(--t2)'}}>
              <input type="radio" name="videoIngestMode" checked={videoIngestMode==='audio_driven'}
                onChange={() => setVideoIngestModePersist('audio_driven')} />
              Generate from audio (match video length)
            </label>
            <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',color: videoIngestMode==='panel_aligned' ? 'var(--gold-b)' : 'var(--t2)'}}>
              <input type="radio" name="videoIngestMode" checked={videoIngestMode==='panel_aligned'}
                onChange={() => setVideoIngestModePersist('panel_aligned')} />
              Use journey panels (30s, 4 scenes)
            </label>
          </div>
          <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
            <input type="text" placeholder="Describe what to create..." value={prompt} onChange={e => setPrompt(e.target.value)} style={{flex:1,minWidth:200}} />
            <button className="btn" onClick={generateScript} disabled={!!loading}>{loading==='script' ? <span className="spinner"/> : 'Generate Script'}</button>
            {presets.length > 0 && (
              <select onChange={e => e.target.value && loadPreset(e.target.value)} style={{width:'auto',minWidth:140}}>
                <option value="">Load Preset...</option>
                {presets.map(p => <option key={p.id} value={p.id}>{p.title} ({p.scene_count} scenes)</option>)}
              </select>
            )}
          </div>
          <div
            onDragOver={onDragOver}
            onDragLeave={() => setDragOver(false)}
            onDrop={onDrop}
            style={{
              position:'relative',
              border:'2px dashed ' + (dragOver ? 'var(--gold)' : 'var(--border)'),
              borderRadius:8,
              background: dragOver ? 'var(--raised)' : 'transparent',
            }}
          >
            {dragOver && (
              <div style={{
                position:'absolute', inset:0, zIndex:2, display:'flex', alignItems:'center', justifyContent:'center',
                background:'rgba(201,169,98,0.12)', borderRadius:6, pointerEvents:'none',
                color:'var(--gold)', fontSize:13, fontWeight:600
              }}>
                Drop video to transcribe &amp; build scenes
              </div>
            )}
            {loading==='recap' && (
              <div style={{
                position:'absolute', inset:0, zIndex:2, display:'flex', alignItems:'center', justifyContent:'center',
                background:'rgba(0,0,0,0.55)', borderRadius:6, pointerEvents:'none',
                color:'var(--gold)', fontSize:12, padding:16, textAlign:'center'
              }}>
                {videoIngestMode === 'panel_aligned'
                  ? 'Transcribing video and aligning existing journey panels (30s recap)…'
                  : 'Upload received — transcribing audio, building story beats, and generating scene art (may take several minutes)…'}
              </div>
            )}
            <textarea
              rows={16}
              value={script}
              onChange={e => setScript(e.target.value)}
              placeholder="Paste client transcript here — or drop / upload a client video (MP4/MOV). Video upload transcribes audio, creates story-matched scenes for the full video length, and generates new imagery (no journey panel grab)."
              style={{border:'none', background:'var(--bg)', width:'100%', boxSizing:'border-box', minHeight:280}}
            />
          </div>
          <div style={{display:'flex',gap:12,marginTop:12,alignItems:'center',flexWrap:'wrap'}}>
            <button className="btn" onClick={() => buildRecapFromTranscript(false)} disabled={!!loading}>
              {loading==='recap-txt' ? <span className="spinner"/> : 'Build 30s Recap from Transcript'}
            </button>
            <button className="btn" onClick={() => buildRecapFromTranscript(true)} disabled={!!loading} title="Align panels, then queue Grok/Ken Burns render for all 4 scenes">
              {loading==='recap-render' ? <span className="spinner"/> : 'Build & Render All Scenes'}
            </button>
            <button className="btn" onClick={breakScenes} disabled={!!loading}>{loading==='break' ? <span className="spinner"/> : 'Break into Scenes (generic)'}</button>
            {recapJobId && (
              <label className="btn btn-sm" style={{cursor:'pointer',margin:0}}>
                {loading==='recap-audio' ? <span className="spinner"/> : 'Attach client audio'}
                <input type="file" accept="audio/*,video/*" style={{display:'none'}} disabled={!!loading}
                  onChange={e => attachRecapAudio(e.target.files?.[0])} />
              </label>
            )}
            {scenes.length > 0 && <span style={{fontSize:12,color:'var(--t2)'}}>{scenes.length} scenes &middot; ~{scenes.reduce((a,s) => a + (s.duration||5), 0)}s total</span>}
            {scenes.length > 0 && <button className="btn btn-sm" onClick={() => setTab('scenes')} style={{marginLeft:'auto'}}>Go to Scenes &rarr;</button>}
          </div>
          <p style={{fontSize:11,color:'var(--t3)',marginTop:8}}>
            Video upload uses the option above. &ldquo;Generate from audio&rdquo; creates new story-beat imagery matched to video length.
            &ldquo;Use journey panels&rdquo; pulls the client&rsquo;s existing Sovereign Journey / daily panel art (30s, 4 scenes).
            Transcript buttons below always use journey panels. Archetype from the client profile is baked into each scene.
          </p>
        </div>
        {scenes.length > 0 && (
          <div className="panel">
            <h2>Scene Breakdown</h2>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {scenes.map((s,i) => (
                <div key={i} style={{display:'flex',gap:12,padding:'10px 12px',background:'var(--raised)',borderRadius:6,alignItems:'flex-start'}}>
                  <span style={{color:'var(--gold)',fontFamily:'var(--mono)',fontSize:11,minWidth:32}}>#{s.scene||i+1}</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,color:'var(--t1)',marginBottom:4}}>{s.title || `Scene ${s.scene||i+1}`}</div>
                    <div style={{fontSize:11,color:'var(--t2)',lineHeight:1.4}}>{(s.description || s.prompt || '').slice(0, 150)}</div>
                    {dHas(s.dialogue) && <div style={{fontSize:11,color:'var(--cyan)',marginTop:4}}>"{dText(s.dialogue).slice(0, 120)}"</div>}
                  </div>
                  <span className="mood" style={{fontSize:10,color:'var(--purple)'}}>{s.mood || '—'}</span>
                  <span style={{fontSize:10,color:'var(--t3)',minWidth:30,textAlign:'right'}}>{s.duration||5}s</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
      <div className="right">
        <div className="panel" style={{position:'sticky',top:60}}>
          <h2>Content Sources</h2>
          {!sources ? <div style={{color:'var(--t3)',fontSize:12}}>Loading...</div> : <>
            {renderSource('plots', 'Story Plots', sources.plots, p => `[Plot: ${p.title}] ${p.description}`)}
            {renderSource('archetypes', 'Archetypes', sources.archetypes?.map(a => ({id:a,name:a})), a => a.name)}
            {renderSource('biomes', 'Biomes', sources.biomes, b => `[Biome: ${b.id}] ${b.description}`)}
            {renderSource('workbooks', 'Workbooks', sources.workbooks, w => `[${w.name}] by ${w.theorist}`)}
            {renderSource('npcs', 'NPC Templates', sources.npcs, n => `[NPC: ${n.name}] ${n.description}`)}
            {sources.core_character && (
              <div>
                <div className="collapse-header" onClick={() => toggleCollapse('core')}>
                  {collapsed['core'] ? '▸' : '▾'} Core Character
                </div>
                {!collapsed['core'] && <div className="content-item" onClick={() => insertContent(sources.core_character)}>{sources.core_character.slice(0,120)}...</div>}
              </div>
            )}
          </>}
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
//  SCENES TAB
// ═══════════════════════════════════════════════════════════════════
function ScenesTab({ scenes, setScenes, projectId, ensureProject, costInfo, refreshCost, recapJobId }) {
  const [loading, setLoading] = useState({});
  const [saving, setSaving] = useState(false);

  const genImage = async (idx) => {
    const pid = await ensureProject(scenes);
    if (!pid) return;
    setLoading(l => ({...l, [`img_${idx}`]: true}));
    try {
      const s = scenes[idx];
      const d = await apiFetch('/api/sse/admin/studio/generate-image', {
        method: 'POST', ct: 'application/json',
        body: JSON.stringify({
          project_id: pid,
          scene_num: s.scene || idx+1,
          description: s.description || s.prompt,
          characters: s.characters || [],
          source_image_url: s.source_image_url || s.image_url || null,
          panel_visual_theme: s.panel_visual_theme || null,
        })
      });
      const updated = [...scenes];
      updated[idx] = { ...updated[idx], image_url: d.r2_url };
      setScenes(updated);
      refreshCost();
    } catch (e) { alert('Image gen failed: ' + e.message); }
    setLoading(l => ({...l, [`img_${idx}`]: false}));
  };

  const genVideo = async (idx) => {
    const s = scenes[idx];
    const sceneNum = s.scene || idx+1;
    setLoading(l => ({...l, [`vid_${idx}`]: true}));
    try {
      if (s.recap_job_id != null) {
        const segIdx = s.recap_segment_index ?? idx;
        const d = await apiFetch(
          `/api/sse/admin/studio/journey-recap/${s.recap_job_id}/render-segment/${segIdx}`,
          { method: 'POST' }
        );
        const updated = [...scenes];
        updated[idx] = {
          ...updated[idx],
          video_url: d.segment?.video_url || updated[idx].video_url,
          video_status: d.segment?.status || 'complete',
        };
        setScenes(updated);
        refreshCost();
        return;
      }
      const pid = await ensureProject(scenes);
      if (!pid) return;
      if (!s.image_url) return alert('Generate an image first');
      await apiFetch('/api/sse/admin/studio/generate-video', {
        method: 'POST', ct: 'application/json',
        body: JSON.stringify({
          project_id: pid, scene_num: sceneNum, image_url: s.image_url,
          motion_prompt: (s.motion_prompt || s.description || s.prompt || '').slice(0, 400)
        })
      });
      for (let attempt = 0; attempt < 40; attempt++) {
        await new Promise(r => setTimeout(r, 5000));
        try {
          const proj = await apiFetch('/api/sse/admin/studio/projects/' + pid + '?hydrate=true');
          const mScenes = (proj.manifest && proj.manifest.scenes) || proj.scenes || [];
          const sc = mScenes.find(x => x.scene === sceneNum);
          if (sc && sc.video_url) {
            const updated = [...scenes];
            updated[idx] = { ...updated[idx], video_url: sc.video_url };
            setScenes(updated);
            refreshCost();
            break;
          }
        } catch (_) {}
      }
    } catch (e) { alert('Video gen failed: ' + e.message); }
    setLoading(l => ({...l, [`vid_${idx}`]: false}));
  };

  const genAudio = async (idx, voice) => {
    const pid = await ensureProject(scenes);
    if (!pid) return;
    const s = scenes[idx];
    if (!dHas(s.dialogue)) return alert('No dialogue for this scene');
    setLoading(l => ({...l, [`aud_${idx}`]: true}));
    try {
      const d = await apiFetch('/api/sse/admin/studio/generate-narration', {
        method: 'POST', ct: 'application/json',
        body: JSON.stringify({ project_id: pid, scene_num: s.scene || idx+1, text: dText(s.dialogue), voice: voice || dVoice(s.dialogue) })
      });
      const updated = [...scenes];
      updated[idx] = { ...updated[idx], audio_url: d.audio_url };
      setScenes(updated);
      refreshCost();
    } catch (e) { alert('Narration failed: ' + e.message); }
    setLoading(l => ({...l, [`aud_${idx}`]: false}));
  };

  const genAllImages = async () => {
    const est = scenes.length * 0.07;
    if (!confirm(`Generate ${scenes.length} images (~$${est.toFixed(2)}). Proceed?`)) return;
    for (let i = 0; i < scenes.length; i++) {
      if (!scenes[i].image_url) await genImage(i);
    }
  };

  const saveProject = async () => {
    const pid = await ensureProject(scenes);
    if (!pid) return;
    setSaving(true);
    try {
      await apiFetch('/api/sse/admin/studio/projects/' + pid, {
        method: 'PUT', ct: 'application/json',
        body: JSON.stringify({ manifest: { scenes } })
      });
    } catch (e) { /* ignore if already created */ }
    setSaving(false);
  };

  if (!scenes.length) return <div className="empty-state">No scenes yet. Use the Script tab to create or load scenes.</div>;

  return (
    <div>
      <div style={{display:'flex',gap:12,marginBottom:16,alignItems:'center',flexWrap:'wrap'}}>
        <button className="btn" onClick={genAllImages}>Generate All Images (~${(scenes.length * 0.07).toFixed(2)})</button>
        <button className="btn btn-sm" onClick={saveProject} disabled={saving}>{saving ? <span className="spinner"/> : 'Save Project'}</button>
        {costInfo && <span style={{marginLeft:'auto',fontSize:12,color:'var(--t2)',fontFamily:'var(--mono)'}}>Today: ${(costInfo.spent_cents/100).toFixed(2)} / ${(costInfo.cap_cents/100).toFixed(2)}</span>}
      </div>
      <div className="grid-3">
        {scenes.map((s, i) => (
          <div key={i} className="scene-card">
            <div className="card-header">
              <span className="scene-num">Scene {s.scene || i+1}</span>
              <span style={{fontSize:12,color:'var(--t1)',flex:1,marginLeft:8,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.title || ''}</span>
              {s.mood && <span className="mood">{s.mood}</span>}
            </div>
            <div className="card-body">
              <div className="desc">{s.description || s.prompt || ''}</div>
              <div className="media-preview">
                {s.image_url ? <img src={s.image_url} alt={s.title} /> : <span style={{color:'var(--t3)',fontSize:12}}>No image</span>}
              </div>
              {s.video_url && (
                <video controls style={{width:'100%',borderRadius:6,marginBottom:12}} src={s.video_url}/>
              )}
              {s.audio_url && (
                <audio controls style={{width:'100%',marginBottom:12}} src={s.audio_url}/>
              )}
              <div className="card-actions">
                <button className="btn btn-sm" onClick={() => genImage(i)} disabled={loading[`img_${i}`]}>
                  {loading[`img_${i}`] ? <span className="spinner"/> : (s.image_url ? 'Regen Image' : 'Gen Image')}
                </button>
                <button className="btn btn-sm" onClick={() => genVideo(i)} disabled={loading[`vid_${i}`] || (!s.recap_job_id && !s.image_url)}>
                  {loading[`vid_${i}`] ? <span className="spinner"/> : (s.video_url ? 'Regen Video' : 'Gen Video')}
                </button>
                {dHas(s.dialogue) && (
                  <select onChange={e => e.target.value && genAudio(i, e.target.value)} disabled={loading[`aud_${i}`]} style={{width:'auto',fontSize:11,padding:'4px 8px'}}>
                    <option value="">{loading[`aud_${i}`] ? 'Generating...' : (s.audio_url ? 'Regen Audio' : 'Gen Audio')}</option>
                    <option value="narrator">Narrator</option>
                    <option value="serpent">Serpent</option>
                    <option value="boy">Boy</option>
                    <option value="girl">Girl</option>
                  </select>
                )}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
//  LIBRARY TAB
// ═══════════════════════════════════════════════════════════════════
function LibraryTab({ onLoadProject }) {
  const [items, setItems] = useState([]);
  const [filter, setFilter] = useState('all');
  const [projects, setProjects] = useState([]);
  const [preview, setPreview] = useState(null);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const [lib, proj] = await Promise.all([
        apiFetch('/api/sse/admin/studio/library?filter=' + filter),
        apiFetch('/api/sse/admin/studio/projects').catch(() => [])
      ]);
      setItems(lib || []);
      setProjects(proj || []);
    } catch (e) { console.warn('Library load failed:', e); }
    setLoading(false);
  }, [filter]);

  useEffect(() => { load(); }, [load]);

  const deleteItem = async (key) => {
    if (!confirm('Delete ' + key.split('/').pop() + '?')) return;
    try {
      await fetch(API + '/api/sse/admin/studio/library/delete', {
        method: 'DELETE', headers: _authHeaders('application/json'),
        body: JSON.stringify({ r2_key: key })
      });
      setItems(items.filter(i => i.key !== key));
    } catch (e) { alert('Delete failed: ' + e.message); }
  };

  const cleanProject = async (pid) => {
    if (!confirm('Delete all R2 assets for this project?')) return;
    try {
      const d = await apiFetch('/api/sse/admin/studio/clean-project', {
        method: 'POST', ct: 'application/json',
        body: JSON.stringify({ project_id: pid })
      });
      alert('Deleted ' + d.deleted_count + ' objects');
      load();
    } catch (e) { alert('Clean failed: ' + e.message); }
  };

  const totalSize = items.reduce((a,i) => a + (i.size_bytes||0), 0);
  const filters = ['all','image','video','audio'];

  return (
    <div>
      <div style={{display:'flex',gap:12,marginBottom:16,alignItems:'center',flexWrap:'wrap'}}>
        <div className="filter-tabs">
          {filters.map(f => (
            <button key={f} className={'filter-tab' + (filter===f?' active':'')} onClick={() => setFilter(f)}>
              {f.charAt(0).toUpperCase() + f.slice(1)}
            </button>
          ))}
        </div>
        <span style={{marginLeft:'auto',fontSize:11,color:'var(--t3)',fontFamily:'var(--mono)'}}>
          {items.length} items &middot; {(totalSize/1024/1024).toFixed(1)} MB
        </span>
      </div>

      {loading ? <div className="empty-state"><span className="spinner"/> Loading...</div> : (
        <>
          {items.length === 0 ? <div className="empty-state">No media found</div> : (
            <div className="grid-3">
              {items.map((item, i) => (
                <div key={i} className="lib-item" onClick={() => setPreview(item)}>
                  <div className="thumb">
                    {item.type === 'image' ? <img src={item.url} alt="" /> :
                     item.type === 'video' ? <span style={{fontSize:32}}>▶</span> :
                     item.type === 'audio' ? <span style={{fontSize:24}}>🎵</span> :
                     <span style={{fontSize:24}}>📄</span>}
                  </div>
                  <div className="meta">
                    <div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.key.split('/').pop()}</div>
                    <div style={{display:'flex',justifyContent:'space-between',marginTop:4}}>
                      <span className={'badge badge-' + (item.type==='image'?'gold':item.type==='video'?'green':'gold')}>{item.type}</span>
                      <span>{(item.size_bytes/1024).toFixed(0)} KB</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {projects.length > 0 && (
            <div className="panel" style={{marginTop:24}}>
              <h2>Projects</h2>
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {projects.map(p => (
                  <div key={p.project_id} style={{display:'flex',gap:12,padding:'10px 12px',background:'var(--raised)',borderRadius:6,alignItems:'center'}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,color:'var(--t1)'}}>{p.title}</div>
                      <div style={{fontSize:11,color:'var(--t3)'}}>{p.scene_count} scenes &middot; ${((p.actual_cost_cents||0)/100).toFixed(2)} spent &middot; {p.status}</div>
                    </div>
                    <span className={'badge ' + (p.status==='complete'?'badge-green':p.status==='failed'?'badge-red':'badge-gold')}>{p.status}</span>
                    <button className="btn btn-sm" onClick={() => onLoadProject && onLoadProject(p.project_id)}>Load</button>
                    {(p.status === 'failed' || p.status === 'partial') && (
                      <button className="btn btn-sm btn-danger" onClick={() => cleanProject(p.project_id)}>Clean</button>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}
        </>
      )}

      {preview && (
        <div className="modal-overlay" onClick={() => setPreview(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>{preview.key.split('/').pop()}</h3>
            {preview.type === 'image' && <img src={preview.url} style={{width:'100%',borderRadius:6,marginBottom:12}} />}
            {preview.type === 'video' && <video controls src={preview.url} style={{width:'100%',borderRadius:6,marginBottom:12}} />}
            {preview.type === 'audio' && <audio controls src={preview.url} style={{width:'100%',marginBottom:12}} />}
            <div style={{fontSize:12,color:'var(--t2)',marginBottom:12}}>
              <div>Key: <span style={{fontFamily:'var(--mono)',fontSize:11}}>{preview.key}</span></div>
              <div>Size: {(preview.size_bytes/1024).toFixed(1)} KB &middot; Modified: {preview.last_modified?.slice(0,19) || '—'}</div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <a className="btn" href={preview.url} target="_blank" rel="noopener">Download</a>
              <button className="btn btn-danger" onClick={() => { deleteItem(preview.key); setPreview(null); }}>Delete</button>
              <button className="btn" onClick={() => setPreview(null)} style={{marginLeft:'auto'}}>Close</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
//  PIPELINE TAB (Phase 2 — character refs, batch video, stitching)
// ═══════════════════════════════════════════════════════════════════
function PipelineTab({ projectId, ensureProject, scenes, costInfo, refreshCost, recapJobId, recapArchetype }) {
  const [charRefs, setCharRefs] = useState(null);
  const [refsLoading, setRefsLoading] = useState(false);
  const [videoStatus, setVideoStatus] = useState(null);
  const [videoLoading, setVideoLoading] = useState(false);
  const [stitchLoading, setStitchLoading] = useState(false);
  const [recapStitchLoading, setRecapStitchLoading] = useState(false);
  const [recapOutputUrl, setRecapOutputUrl] = useState(null);
  const [recapRenderLoading, setRecapRenderLoading] = useState(false);
  const [recapRenderMsg, setRecapRenderMsg] = useState('');
  const [recapJobStatus, setRecapJobStatus] = useState(null);
  const [trailerStatus, setTrailerStatus] = useState(null);
  const [stitchOpts, setStitchOpts] = useState({ include_color_grade: true, include_narration: true, color_preset: 'ghibli_warm', format: '16:9' });
  const [genMode, setGenMode] = useState('interpolated');
  const pollRef = useRef(null);

  const pollVideoStatus = useCallback(async () => {
    if (!projectId) return;
    try {
      const s = await apiFetch('/api/sse/admin/studio/projects/' + projectId + '/video-status');
      setVideoStatus(s);
      if (s.status === 'not_started' && videoLoading) { /* still running */ }
      else if (s.clips) { setVideoLoading(false); }
    } catch (e) { /* ignore */ }
  }, [projectId, videoLoading]);

  const pollTrailerStatus = useCallback(async () => {
    if (!projectId) return;
    try {
      const s = await apiFetch('/api/sse/admin/studio/projects/' + projectId + '/trailer-status');
      setTrailerStatus(s);
      if (s.trailer) { setStitchLoading(false); }
    } catch (e) { /* ignore */ }
  }, [projectId]);

  const pollRecapJob = useCallback(async () => {
    if (!recapJobId) return;
    try {
      const d = await apiFetch('/api/sse/admin/studio/journey-recap/' + recapJobId);
      const job = normalizeRecapJob(d.job);
      setRecapJobStatus(job);
      if (job?.output_r2_url) setRecapOutputUrl(job.output_r2_url);
    } catch (e) { /* ignore */ }
  }, [recapJobId]);

  useEffect(() => {
    if (!recapJobId) return;
    pollRecapJob();
    const ms = recapRenderLoading ? 3000 : 8000;
    const iv = setInterval(pollRecapJob, ms);
    return () => clearInterval(iv);
  }, [recapJobId, pollRecapJob, recapRenderLoading]);

  useEffect(() => {
    if (!recapRenderLoading || !recapJobStatus) return;
    const s = recapClipSummary(recapJobStatus);
    if (s.ready >= s.need || recapJobStatus.status === 'clips_ready' || recapJobStatus.status === 'complete') {
      setRecapRenderLoading(false);
      setRecapRenderMsg(
        `Render complete: ${s.grok} Grok · ${s.kb} Ken Burns` +
        (s.failed ? ` · ${s.failed} failed` : '') + '. Stitch when ready.'
      );
    }
  }, [recapRenderLoading, recapJobStatus]);

  const renderAllRecapSegments = async () => {
    if (!recapJobId) return;
    if (!confirm('Render all journey recap scene clips (~$16 if all Grok)? Takes 2–5 minutes.')) return;
    setRecapRenderLoading(true);
    setRecapRenderMsg('Rendering 4 segments (Grok video, ~2–5 min). Page polls every 3s…');
    try {
      await apiFetch('/api/sse/admin/studio/journey-recap/' + recapJobId + '/render-all', { method: 'POST' });
      pollRecapJob();
    } catch (e) {
      setRecapRenderLoading(false);
      setRecapRenderMsg('');
      alert('Render all failed: ' + e.message);
    }
  };

  const recapSummary = recapJobStatus ? recapClipSummary(recapJobStatus) : null;
  const recapClipCount = recapSummary ? recapSummary.ready : 0;

  const stitchJourneyRecap = async () => {
    if (!recapJobId) return;
    const clipN = recapClipCount;
    const need = recapJobStatus?.segment_count || 4;
    const msg = clipN < need
      ? `No Grok clips yet (${clipN}/${need}). Stitch will auto-build Ken Burns motion from panel stills + client audio. Continue?`
      : 'Stitch 4 segments + client audio into final 30s Journey Recap?';
    if (!confirm(msg)) return;
    setRecapStitchLoading(true);
    try {
      const d = await apiFetch('/api/sse/admin/studio/journey-recap/' + recapJobId + '/stitch', { method: 'POST' });
      setRecapOutputUrl(d.output_url || null);
      pollRecapJob();
    } catch (e) { alert('Recap stitch failed: ' + e.message); }
    setRecapStitchLoading(false);
  };

  useEffect(() => {
    if (!projectId) return;
    const iv = setInterval(() => {
      if (videoLoading) pollVideoStatus();
      if (stitchLoading) pollTrailerStatus();
    }, 10000);
    return () => clearInterval(iv);
  }, [projectId, videoLoading, stitchLoading, pollVideoStatus, pollTrailerStatus]);

  const generateRefs = async () => {
    const pid = await ensureProject(scenes);
    if (!pid) return;
    const est = 7 * 0.07;
    if (!confirm(`Generate 7 character reference images (~$${est.toFixed(2)})?`)) return;
    setRefsLoading(true);
    try {
      await apiFetch('/api/sse/admin/studio/generate-character-refs', {
        method: 'POST', ct: 'application/json',
        body: JSON.stringify({ project_id: pid })
      });
      setTimeout(async () => {
        try {
          const s = await apiFetch('/api/sse/admin/studio/projects/' + pid + '/trailer-status');
          if (s.character_refs) setCharRefs(s.character_refs);
        } catch(e) {}
        setRefsLoading(false);
        refreshCost();
      }, 50000);
    } catch (e) { alert('Ref generation failed: ' + e.message); setRefsLoading(false); }
  };

  const generateAllVideos = async () => {
    const pid = await ensureProject(scenes);
    if (!pid) return;
    if (!confirm('Generate motion video clips for all scenes (legacy independent mode)? Costs ~$4/scene.')) return;
    setVideoLoading(true);
    try {
      await apiFetch('/api/sse/admin/studio/generate-video-clips', {
        method: 'POST', ct: 'application/json',
        body: JSON.stringify({ project_id: pid })
      });
    } catch (e) { alert('Video generation failed: ' + e.message); setVideoLoading(false); }
  };

  const generateCongruent = async () => {
    const pid = await ensureProject(scenes);
    if (!pid) return;
    try {
      const est = await apiFetch(`/api/sse/admin/studio/cost-estimate/${pid}?mode=${genMode}`);
      const msg = `Generate ${genMode} trailer?\n\nEstimated cost: ${est.estimated_cost_usd}\n` +
        `Scenes: ${est.total_scenes} (${est.remaining_scenes} remaining)\n` +
        `LoRA: ${est.has_lora ? 'Yes (hero images will be regenerated)' : 'No'}\n` +
        `Daily cap: ${est.daily_cap_usd}\n\nProceed?`;
      if (!confirm(msg)) return;
    } catch (e) {
      if (!confirm(`Generate ${genMode} trailer? Cost estimate unavailable. Proceed anyway?`)) return;
    }
    setVideoLoading(true);
    try {
      const endpoint = genMode === 'interpolated' ? '/api/sse/admin/studio/generate-interpolated-trailer' : '/api/sse/admin/studio/generate-congruent-clips';
      const body = genMode === 'interpolated' ? { project_id: pid } : { project_id: pid, mode: genMode };
      await apiFetch(endpoint, { method: 'POST', ct: 'application/json', body: JSON.stringify(body) });
    } catch (e) { alert('Generation failed: ' + e.message); setVideoLoading(false); }
  };

  const resumeGeneration = async () => {
    const pid = await ensureProject(scenes);
    if (!pid) return;
    const resumeFrom = videoStatus?.chain_state?.last_completed_scene;
    if (!resumeFrom) return alert('No checkpoint found to resume from');
    setVideoLoading(true);
    try {
      await apiFetch('/api/sse/admin/studio/resume-generation', {
        method: 'POST', ct: 'application/json',
        body: JSON.stringify({ project_id: pid, mode: genMode, resume_from: resumeFrom + 1 })
      });
    } catch (e) { alert('Resume failed: ' + e.message); setVideoLoading(false); }
  };

  const stitchTrailer = async () => {
    const pid = await ensureProject(scenes);
    if (!pid) return;
    if (!confirm('Stitch all clips into a congruent trailer? This downloads clips, applies color grading, generates narration, and exports.')) return;
    setStitchLoading(true);
    try {
      await apiFetch('/api/sse/admin/studio/stitch-trailer', {
        method: 'POST', ct: 'application/json',
        body: JSON.stringify({ project_id: pid, ...stitchOpts })
      });
    } catch (e) { alert('Stitching failed: ' + e.message); setStitchLoading(false); }
  };

  if (!scenes.length) return <div className="empty-state">Load scenes in the Script tab first.</div>;

  const charNames = ['boy','serpent','dragon','girl','watcher','glowing_woman','knight'];

  return (
    <div>
      {recapJobId && (
        <div className="panel" style={{borderColor:'var(--gold)',borderWidth:1,borderStyle:'solid'}}>
          <h2>30s Journey Recap</h2>
          <p style={{fontSize:12,color:'var(--t2)',marginBottom:12}}>
            Job <span style={{fontFamily:'var(--mono)',fontSize:11}}>{recapJobId.slice(0,8)}…</span>
            {recapArchetype ? <> · Archetype: <strong style={{color:'var(--gold-b)'}}>{recapArchetype}</strong></> : null}
            {recapSummary ? <> · Clips: <strong>{recapSummary.ready}/{recapSummary.need}</strong>
              {recapSummary.grok > 0 ? <> · <span style={{color:'var(--green)'}}>{recapSummary.grok} Grok</span></> : null}
              {recapSummary.kb > 0 ? <> · <span style={{color:'var(--gold-d)'}}>{recapSummary.kb} Ken Burns</span></> : null}
            </> : null}
            {recapJobStatus?.status ? <> · <span style={{color:'var(--t3)'}}>{recapJobStatus.status}</span></> : null}
            {recapJobStatus?.audio_r2_key ? <> · <span style={{color:'var(--cyan)'}}>client audio attached</span></> : null}
          </p>
          {recapRenderMsg && (
            <p style={{fontSize:12,color: recapRenderLoading ? 'var(--cyan)' : 'var(--t2)',marginBottom:10}}>
              {recapRenderLoading ? <><span className="spinner" style={{marginRight:6}}/>{recapRenderMsg}</> : recapRenderMsg}
            </p>
          )}
          {recapSummary && (
            <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
              {Array.from({length: recapSummary.need}, (_, i) => {
                const c = recapSummary.clips[i];
                const st = c?.status || (c?.video_url || c?.r2_key ? 'ready' : 'pending');
                const color = st === 'grok' ? 'var(--green)' : st === 'ken_burns' ? 'var(--gold-d)' : st === 'failed' ? 'var(--red)' : 'var(--t3)';
                return <span key={i} style={{fontSize:10,padding:'3px 8px',borderRadius:4,border:'1px solid var(--border)',color}}>Seg {i}: {st}</span>;
              })}
            </div>
          )}
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12}}>
            <button className="btn" onClick={renderAllRecapSegments} disabled={recapRenderLoading}>
              {recapRenderLoading ? <><span className="spinner"/> Rendering…</> : 'Render All Scene Clips (Grok)'}
            </button>
            <button className="btn" onClick={stitchJourneyRecap} disabled={recapStitchLoading}>
              {recapStitchLoading ? <><span className="spinner"/> Stitching…</> : 'Stitch Recap + Client Audio'}
            </button>
          </div>
          {recapJobStatus && recapClipCount < (recapJobStatus.segment_count || 4) && (
            <p style={{fontSize:11,color:'var(--t3)',marginBottom:8}}>
              Stitch without Grok clips will use Ken Burns pan on panel stills (~30s, no extra Grok cost).
            </p>
          )}
          {recapOutputUrl && (
            <div>
              <video controls src={recapOutputUrl} style={{width:'100%',maxWidth:640,borderRadius:8,marginBottom:8}} />
              <a className="btn btn-sm" href={recapOutputUrl} target="_blank" rel="noopener">Download Recap</a>
            </div>
          )}
        </div>
      )}
      {/* Character References */}
      <div className="panel">
        <h2>Character References</h2>
        <p style={{fontSize:12,color:'var(--t2)',marginBottom:12}}>
          Generate reference images for all 7 characters to ensure visual consistency across scenes.
        </p>
        <button className="btn" onClick={generateRefs} disabled={refsLoading}>
          {refsLoading ? <><span className="spinner"/> Generating 7 refs (~40s)...</> : 'Generate Character Refs (~$0.49)'}
        </button>
        {charRefs && (
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))',gap:12,marginTop:16}}>
            {charNames.map(name => (
              <div key={name} style={{textAlign:'center'}}>
                {charRefs[name] ? (
                  <img src={charRefs[name]} alt={name} style={{width:'100%',borderRadius:6,border:'1px solid var(--border)'}} />
                ) : (
                  <div style={{width:'100%',aspectRatio:'1',background:'var(--bg)',borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--t3)',fontSize:11}}>Pending</div>
                )}
                <div style={{fontSize:11,color:'var(--gold-d)',marginTop:4}}>{name}</div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Congruent Video Generation */}
      <div className="panel">
        <h2>Motion Video Generation</h2>
        <p style={{fontSize:12,color:'var(--t2)',marginBottom:12}}>
          Generate 8s motion clips. Choose a generation mode based on quality vs cost tradeoff.
        </p>
        <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
          {[
            {id:'interpolated',label:'Interpolated ★',desc:'Start→End frame directed motion — best quality'},
            {id:'chain',label:'Chain',desc:'Each scene extends from previous last frame'},
            {id:'cel',label:'Cel Animation',desc:'Composite reference plates (character + storyboard + prev frame)'},
            {id:'independent',label:'Independent',desc:'Each scene generated separately (legacy)'},
          ].map(m => (
            <button key={m.id} className={'filter-tab' + (genMode===m.id?' active':'')} onClick={() => setGenMode(m.id)} title={m.desc}>
              {m.label}
            </button>
          ))}
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <button className="btn" onClick={generateCongruent} disabled={videoLoading}>
            {videoLoading ? <><span className="spinner"/> Generating {genMode} clips...</> : `Generate ${genMode.charAt(0).toUpperCase()+genMode.slice(1)} Clips`}
          </button>
          {videoStatus && videoStatus.chain_state && videoStatus.chain_state.last_completed_scene && !videoStatus.chain_state.awaiting_approval && (
            <button className="btn btn-sm" onClick={resumeGeneration} disabled={videoLoading}>
              Resume from Scene {videoStatus.chain_state.last_completed_scene + 1}
            </button>
          )}
          {videoStatus && videoStatus.chain_state && videoStatus.chain_state.awaiting_approval && (
            <div style={{display:'flex',gap:8,alignItems:'center',padding:'8px 12px',background:'#C9A96222',borderRadius:6,border:'1px solid var(--gold)'}}>
              <span style={{fontSize:12,color:'var(--gold-b)'}}>Branch Point — Scene {videoStatus.chain_state.branch_scene} awaiting approval</span>
              {videoStatus.chain_state.branch_preview_url && (
                <img src={videoStatus.chain_state.branch_preview_url} alt="Preview" style={{width:48,height:48,borderRadius:4,objectFit:'cover'}} />
              )}
              <button className="btn btn-sm" style={{background:'var(--green)'}} onClick={async () => {
                await apiFetch('/api/sse/admin/studio/approve-branch', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_id:projectId,action:'approve'})});
                pollVideoStatus();
              }}>Approve & Continue</button>
              <button className="btn btn-sm" style={{background:'var(--red)',opacity:.7}} onClick={async () => {
                await apiFetch('/api/sse/admin/studio/approve-branch', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_id:projectId,action:'reject'})});
                pollVideoStatus();
              }}>Reject</button>
            </div>
          )}
          <button className="btn btn-sm" onClick={generateAllVideos} disabled={videoLoading} style={{opacity:.6}}>
            Legacy Independent
          </button>
        </div>
        {videoStatus && videoStatus.clips && (
          <div style={{marginTop:16}}>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:8}}>
              <span style={{fontSize:12,color:'var(--t2)'}}>
                {videoStatus.success || 0}/{videoStatus.total || 0} clips complete
                {videoStatus.total_cost != null && ` — $${videoStatus.total_cost.toFixed(2)}`}
              </span>
              <button className="btn btn-sm" style={{fontSize:10,padding:'2px 8px',background:'var(--gold-dim)'}}
                onClick={async () => {
                  if (!confirm('Remove duplicate clips? Keeps only the latest version of each transition.')) return;
                  const r = await apiFetch('/api/sse/admin/studio/projects/' + projectId + '/deduplicate-clips', {method:'POST'});
                  if (r && r.removed > 0) {
                    alert('Removed ' + r.removed + ' duplicates (' + r.before + ' → ' + r.after + ')');
                    pollVideoStatus();
                  } else {
                    alert('No duplicates found');
                  }
                }}>
                Deduplicate
              </button>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:8}}>
              {videoStatus.clips.map((c,i) => (
                <div key={i} style={{padding:8,background:'var(--raised)',borderRadius:6,fontSize:11,position:'relative'}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:4,alignItems:'center'}}>
                    <span style={{color:'var(--gold)'}}>
                      {c.from_scene != null ? `${c.from_scene}→${c.to_scene || 'end'}` : `Scene ${c.scene || '?'}`}
                    </span>
                    <div style={{display:'flex',gap:4,alignItems:'center'}}>
                      <span className={'badge ' + (c.status==='success'?'badge-green':c.status==='ken_burns'?'badge-gold':'badge-red')}>
                        {c.status}
                      </span>
                      <button onClick={async () => {
                        if (!confirm('Delete this clip? It will not be included in the stitched trailer.')) return;
                        await apiFetch('/api/sse/admin/studio/projects/' + projectId + '/clips/' + i, {method:'DELETE'});
                        pollVideoStatus();
                      }} style={{background:'none',border:'none',color:'var(--red)',cursor:'pointer',fontSize:14,padding:'0 2px'}}
                        title="Delete clip">✕</button>
                    </div>
                  </div>
                  {c.video_url && <video controls src={c.video_url} style={{width:'100%',borderRadius:4}} />}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Trailer Stitching */}
      <div className="panel">
        <h2>Congruent Trailer Stitching</h2>
        <p style={{fontSize:12,color:'var(--t2)',marginBottom:12}}>
          Combine all clips into a single trailer with color grading, crossfades, narration overlay, and format conversion.
        </p>
        <div style={{display:'flex',gap:16,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
          <label style={{fontSize:12,color:'var(--t2)',display:'flex',alignItems:'center',gap:6}}>
            <input type="checkbox" checked={stitchOpts.include_color_grade}
              onChange={e => setStitchOpts(o => ({...o, include_color_grade: e.target.checked}))} />
            Color Grade
          </label>
          {stitchOpts.include_color_grade && (
            <select value={stitchOpts.color_preset} onChange={e => setStitchOpts(o => ({...o, color_preset: e.target.value}))}
              style={{width:'auto',fontSize:12,padding:'4px 8px'}}>
              <option value="ghibli_warm">Ghibli Warm</option>
              <option value="cool_night">Cool Night</option>
              <option value="neutral">Neutral</option>
              <option value="sunset_drama">Sunset Drama</option>
            </select>
          )}
          <label style={{fontSize:12,color:'var(--t2)',display:'flex',alignItems:'center',gap:6}}>
            <input type="checkbox" checked={stitchOpts.include_narration}
              onChange={e => setStitchOpts(o => ({...o, include_narration: e.target.checked}))} />
            Include Narration
          </label>
          <select value={stitchOpts.format} onChange={e => setStitchOpts(o => ({...o, format: e.target.value}))}
            style={{width:'auto',fontSize:12,padding:'4px 8px'}}>
            <option value="16:9">16:9 (YouTube)</option>
            <option value="9:16">9:16 (Reels/TikTok)</option>
            <option value="1:1">1:1 (Instagram)</option>
          </select>
        </div>
        <button className="btn" onClick={stitchTrailer} disabled={stitchLoading}>
          {stitchLoading ? <><span className="spinner"/> Stitching trailer...</> : 'Stitch Trailer'}
        </button>
        {trailerStatus && trailerStatus.trailer && (
          <div style={{marginTop:16,padding:16,background:'var(--raised)',borderRadius:6}}>
            <div style={{fontSize:13,color:'var(--green)',marginBottom:8}}>Trailer Complete</div>
            <video controls src={trailerStatus.trailer.trailer_url} style={{width:'100%',borderRadius:6,marginBottom:12}} />
            <div style={{fontSize:11,color:'var(--t2)'}}>
              {trailerStatus.trailer.clips_used} clips &middot; {trailerStatus.trailer.format} &middot;
              {(trailerStatus.trailer.size_bytes / 1024 / 1024).toFixed(1)} MB
              {trailerStatus.trailer.has_narration && ' &middot; with narration'}
            </div>
            <a className="btn btn-sm" href={trailerStatus.trailer.trailer_url} target="_blank" rel="noopener" style={{marginTop:8,display:'inline-block'}}>
              Download Trailer
            </a>
          </div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
//  VOICE MAPPING PANEL
// ═══════════════════════════════════════════════════════════════════
function VoiceMappingPanel({ projectId, ensureProject }) {
  const [voiceCfg, setVoiceCfg] = useState(null);
  const [availVoices, setAvailVoices] = useState([]);
  const [saving, setSaving] = useState(null);

  const loadVoices = useCallback(async () => {
    if (!projectId) return;
    try {
      const d = await apiFetch('/api/sse/admin/studio/voice-config/' + projectId);
      setVoiceCfg(d.voices || {});
      setAvailVoices(d.available_voices || []);
    } catch (e) { console.warn('voice-config load failed', e); }
  }, [projectId]);

  useEffect(() => { loadVoices(); }, [loadVoices]);

  const saveVoice = async (charKey, voice, instructions) => {
    const pid = await ensureProject();
    setSaving(charKey);
    try {
      await apiFetch('/api/sse/admin/studio/voice-config', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ project_id: pid, character: charKey, voice, instructions: instructions || null })
      });
      await loadVoices();
    } catch (e) { alert('Save failed: ' + e.message); }
    setSaving(null);
  };

  if (!voiceCfg) return e('div', {className:'panel'}, e('p',{style:{color:'var(--t2)',fontSize:12}},'Load a project to configure voices.'));

  const chars = Object.entries(voiceCfg);
  return e('div', {className:'panel'},
    e('h2', null, 'Voice Mapping'),
    e('p', {style:{fontSize:12,color:'var(--t2)',marginBottom:12}}, 'Assign TTS voices to each character for narration generation.'),
    e('div', {style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:12}},
      chars.map(([key, cfg]) =>
        e('div', {key, style:{padding:12,background:'var(--raised)',borderRadius:6,border:'1px solid var(--border)'}},
          e('div', {style:{fontSize:13,color:'var(--gold-b)',marginBottom:6}}, key.replace(/_/g,' ')),
          e('div', {style:{display:'flex',gap:6,alignItems:'center',marginBottom:6}},
            e('select', {
              value: cfg.voice || 'shimmer',
              onChange: ev => saveVoice(key, ev.target.value, cfg.instructions),
              style:{flex:1,fontSize:12,padding:'4px 8px'},
              disabled: saving === key,
            }, availVoices.map(v => e('option', {key:v, value:v}, v))),
            saving === key && e('span', {className:'spinner',style:{width:14,height:14}}),
          ),
          e('input', {
            type:'text',
            placeholder:'Voice instructions (e.g., "gentle, wise tone")',
            defaultValue: cfg.instructions || '',
            onBlur: ev => { if (ev.target.value !== (cfg.instructions || '')) saveVoice(key, cfg.voice, ev.target.value); },
            style:{fontSize:11,width:'100%'},
          })
        )
      )
    )
  );
}

// ═══════════════════════════════════════════════════════════════════
//  CHARACTER LAB TAB (LoRA training + testing)
// ═══════════════════════════════════════════════════════════════════
function CharacterLabTab({ projectId, ensureProject, scenes, refreshCost }) {
  const [selectedChar, setSelectedChar] = useState('boy');
  const [trainingImages, setTrainingImages] = useState([]);
  const [trainingId, setTrainingId] = useState(null);
  const [trainingStatus, setTrainingStatus] = useState(null);
  const [loraUrl, setLoraUrl] = useState('');
  const [testImages, setTestImages] = useState([]);
  const [testPrompt, setTestPrompt] = useState('');
  const [loading, setLoading] = useState('');

  const charNames = ['boy','serpent','dragon','girl','watcher','glowing_woman','knight'];

  const generateTrainingSet = async () => {
    const pid = await ensureProject(scenes);
    if (!pid) return;
    if (!confirm(`Generate 20 training images for "${selectedChar}"? (~$1.40)`)) return;
    setLoading('gen_training');
    try {
      await apiFetch('/api/sse/admin/studio/lora/training-images', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ character_key: selectedChar, project_id: pid })
      });
      alert('Training image generation started — check Library tab in ~2 minutes.\nOnce done, click "Auto-Zip" to prepare for training.');
      refreshCost();
    } catch (e) { alert('Failed: ' + e.message); }
    setLoading('');
  };

  const autoZipTrainingImages = async () => {
    const pid = await ensureProject(scenes);
    if (!pid) return;
    setLoading('zip');
    try {
      const d = await apiFetch('/api/sse/admin/studio/lora/zip-training-images', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ character_key: selectedChar, project_id: pid })
      });
      if (d.zip_url) {
        setLoraUrl(d.zip_url);
        alert('Training images zipped! URL auto-filled. Click "Train LoRA" to start.');
      }
    } catch (e) { alert('Failed: ' + e.message); }
    setLoading('');
  };

  const startTraining = async () => {
    if (!loraUrl.trim()) return alert('Enter the training images .zip URL');
    setLoading('train');
    try {
      const d = await apiFetch('/api/sse/admin/studio/lora/train', {
        method: 'POST', ct: 'application/json',
        body: JSON.stringify({ character_key: selectedChar, training_images_zip_url: loraUrl })
      });
      setTrainingId(d.training_id);
      setTrainingStatus(d);
    } catch (e) { alert('Training failed: ' + e.message); }
    setLoading('');
  };

  const pollTraining = async () => {
    if (!trainingId) return;
    setLoading('poll');
    try {
      const pid = await ensureProject();
      const d = await apiFetch('/api/sse/admin/studio/lora/status/' + trainingId + '?project_id=' + encodeURIComponent(pid) + '&character_key=' + encodeURIComponent(selectedChar));
      setTrainingStatus(d);
      if (d.status === 'succeeded') alert('LoRA training complete! Character lock saved to project. All scene generation will now use this LoRA.');
    } catch (e) { alert('Poll failed: ' + e.message); }
    setLoading('');
  };

  const testLora = async () => {
    if (!testPrompt.trim()) return alert('Enter a test prompt');
    const urls = loraUrl ? [loraUrl] : (trainingStatus?.output ? [trainingStatus.output] : []);
    if (!urls.length) return alert('No LoRA weights URL available — train first or paste URL');
    setLoading('test');
    try {
      const d = await apiFetch('/api/sse/admin/studio/lora/test', {
        method: 'POST', ct: 'application/json',
        body: JSON.stringify({ prompt: testPrompt, lora_urls: urls })
      });
      setTestImages(d.test_images || []);
    } catch (e) { alert('Test failed: ' + e.message); }
    setLoading('');
  };

  return (
    <div>
      <div className="panel">
        <h2>Character Lab — LoRA Training</h2>
        <p style={{fontSize:12,color:'var(--t2)',marginBottom:16}}>
          Train character-specific LoRA weights to ensure identical character appearance across all scenes.
          Requires <span style={{fontFamily:'var(--mono)',color:'var(--gold)'}}>REPLICATE_API_TOKEN</span> env var.
        </p>

        <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
          {charNames.map(c => (
            <button key={c} className={'filter-tab' + (selectedChar===c?' active':'')} onClick={() => setSelectedChar(c)}>
              {c}
            </button>
          ))}
        </div>

        <div style={{display:'flex',gap:16,marginBottom:16,flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:300}}>
            <div style={{fontSize:13,color:'var(--gold-b)',marginBottom:8}}>Step 1: Generate Training Images</div>
            <p style={{fontSize:11,color:'var(--t3)',marginBottom:8}}>Generate 20 diverse poses/angles of {selectedChar} for LoRA fine-tuning.</p>
            <div style={{display:'flex',gap:8}}>
              <button className="btn" onClick={generateTrainingSet} disabled={loading==='gen_training'}>
                {loading==='gen_training' ? <span className="spinner"/> : `Generate 20 Images (~$1.40)`}
              </button>
              <button className="btn btn-sm" onClick={autoZipTrainingImages} disabled={loading==='zip'}>
                {loading==='zip' ? <span className="spinner"/> : 'Auto-Zip for Training'}
              </button>
            </div>
          </div>

          <div style={{flex:1,minWidth:300}}>
            <div style={{fontSize:13,color:'var(--gold-b)',marginBottom:8}}>Step 2: Train LoRA</div>
            <p style={{fontSize:11,color:'var(--t3)',marginBottom:8}}>Zip URL auto-filled after Step 1 zip, or paste manually.</p>
            <input type="text" placeholder="Training images .zip URL..." value={loraUrl} onChange={e => setLoraUrl(e.target.value)} style={{marginBottom:8}} />
            <div style={{display:'flex',gap:8}}>
              <button className="btn" onClick={startTraining} disabled={loading==='train'}>
                {loading==='train' ? <span className="spinner"/> : 'Start Training'}
              </button>
              {trainingId && (
                <button className="btn btn-sm" onClick={pollTraining} disabled={loading==='poll'}>
                  {loading==='poll' ? <span className="spinner"/> : 'Check Status'}
                </button>
              )}
            </div>
          </div>
        </div>

        {trainingStatus && (
          <div style={{padding:12,background:'var(--raised)',borderRadius:6,marginBottom:16}}>
            <div style={{display:'flex',gap:12,alignItems:'center',marginBottom:8}}>
              <span style={{fontSize:12,color:'var(--t1)'}}>Training: {trainingStatus.training_id?.slice(0,12)}...</span>
              <span className={'badge ' + (trainingStatus.status==='succeeded'?'badge-green':trainingStatus.status==='failed'?'badge-red':'badge-gold')}>
                {trainingStatus.status}
              </span>
            </div>
            {trainingStatus.logs_tail && (
              <pre style={{fontSize:10,color:'var(--t3)',whiteSpace:'pre-wrap',maxHeight:100,overflow:'auto'}}>{trainingStatus.logs_tail}</pre>
            )}
            {trainingStatus.output && (
              <div style={{fontSize:11,color:'var(--green)',marginTop:8}}>LoRA weights: <span style={{fontFamily:'var(--mono)'}}>{typeof trainingStatus.output === 'string' ? trainingStatus.output.slice(0,60) : JSON.stringify(trainingStatus.output).slice(0,60)}...</span></div>
            )}
          </div>
        )}
      </div>

      <div className="panel">
        <h2>Test LoRA Generation</h2>
        <p style={{fontSize:12,color:'var(--t2)',marginBottom:12}}>
          Test your trained LoRA by generating images with a prompt. The character should look consistent.
        </p>
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <input type="text" placeholder="Test prompt (e.g., 'THERA_BOY standing on a mountain top')" value={testPrompt} onChange={e => setTestPrompt(e.target.value)} style={{flex:1}} />
          <button className="btn" onClick={testLora} disabled={loading==='test'}>
            {loading==='test' ? <span className="spinner"/> : 'Generate Test'}
          </button>
        </div>
        {testImages.length > 0 && (
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:12}}>
            {testImages.map((url, i) => (
              <img key={i} src={url} alt={`Test ${i+1}`} style={{width:'100%',borderRadius:6,border:'1px solid var(--border)'}} />
            ))}
          </div>
        )}
      </div>

      <VoiceMappingPanel projectId={projectId} ensureProject={ensureProject} />
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
//  APP ROOT
// ═══════════════════════════════════════════════════════════════════
function App() {
  const [tab, setTab] = useState('script');
  const [scenes, setScenes] = useState([]);
  const [projectId, setProjectId] = useState(null);
  const projectIdRef = useRef(null);
  const projectPromiseRef = useRef(null);
  const [costInfo, setCostInfo] = useState(null);
  const [recapJobId, setRecapJobId] = useState(null);
  const [recapArchetype, setRecapArchetype] = useState('');

  const setProjectIdSync = useCallback((id) => {
    projectIdRef.current = id;
    setProjectId(id);
  }, []);

  const ensureProjectGlobal = useCallback(async (scenesForCreate) => {
    if (projectIdRef.current) return projectIdRef.current;
    if (projectPromiseRef.current) return projectPromiseRef.current;
    projectPromiseRef.current = (async () => {
      try {
        const d = await apiFetch('/api/sse/admin/studio/projects', {
          method: 'POST', ct: 'application/json',
          body: JSON.stringify({ title: 'Studio Project ' + new Date().toISOString().slice(0,16), scenes: scenesForCreate })
        });
        setProjectIdSync(d.project_id);
        return d.project_id;
      } catch (e) { alert('Failed to create project: ' + e.message); return null; }
      finally { projectPromiseRef.current = null; }
    })();
    return projectPromiseRef.current;
  }, [setProjectIdSync]);

  const refreshCost = useCallback(async () => {
    try { setCostInfo(await apiFetch('/api/sse/admin/studio/cost-status')); } catch(e) {}
  }, []);

  useEffect(() => { refreshCost(); const iv = setInterval(refreshCost, 30000); return () => clearInterval(iv); }, [refreshCost]);

  const loadProject = useCallback(async (pid) => {
    try {
      const proj = await apiFetch('/api/sse/admin/studio/projects/' + pid + '?hydrate=true');
      const manifest = proj.manifest || {};
      const sc = manifest.scenes || [];
      setScenes(sc);
      setProjectIdSync(pid);
      setTab('scenes');
    } catch (e) { alert('Failed to load project: ' + e.message); }
  }, [setProjectIdSync]);

  return (
    <div>
      <div className="topbar">
        <a className="nav-link" href="javascript:void(0)" onClick={() => navTo('sse_monitoring.html')}>&larr; SSE Monitor</a>
        <h1>Thera-World Studio</h1>
        <a className="nav-link" href="javascript:void(0)" onClick={() => navTo('command.html')}>&larr; Command</a>
        {costInfo && (
          <div className="cost-banner">
            Today: ${(costInfo.spent_cents/100).toFixed(2)} / ${(costInfo.cap_cents/100).toFixed(2)}
            {costInfo.remaining_cents <= 0 && <span style={{color:'var(--red)',marginLeft:8}}>LIMIT REACHED</span>}
          </div>
        )}
      </div>
      <div className="tab-bar">
        {['script','scenes','pipeline','charlab','library'].map(t => (
          <button key={t} className={'tab-btn' + (tab===t?' active':'')} onClick={() => setTab(t)}>
            {t === 'script' ? 'Script' : t === 'scenes' ? `Scenes (${scenes.length})` : t === 'pipeline' ? 'Pipeline' : t === 'charlab' ? 'Character Lab' : 'Library'}
          </button>
        ))}
      </div>
      <div className="main">
        {tab === 'script' && <ScriptTab scenes={scenes} setScenes={setScenes} setTab={setTab} setRecapJobId={setRecapJobId} setRecapArchetype={setRecapArchetype} recapJobId={recapJobId} />}
        {tab === 'scenes' && <ScenesTab scenes={scenes} setScenes={setScenes} projectId={projectId} ensureProject={ensureProjectGlobal} costInfo={costInfo} refreshCost={refreshCost} recapJobId={recapJobId} />}
        {tab === 'pipeline' && <PipelineTab projectId={projectId} ensureProject={ensureProjectGlobal} scenes={scenes} costInfo={costInfo} refreshCost={refreshCost} recapJobId={recapJobId} recapArchetype={recapArchetype} />}
        {tab === 'charlab' && <CharacterLabTab projectId={projectId} ensureProject={ensureProjectGlobal} scenes={scenes} refreshCost={refreshCost} />}
        {tab === 'library' && <LibraryTab onLoadProject={loadProject} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
