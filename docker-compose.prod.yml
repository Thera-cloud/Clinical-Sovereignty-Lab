services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    # Pin to specific minor version for reproducibility; update deliberately
    image: postgres:15.10-alpine
    container_name: nate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-little_nate}
      POSTGRES_USER: ${POSTGRES_USER:-nate_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    # No ports exposed — only reachable by backend/bridge via nate_network (postgres:5432)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nate_admin} -d ${POSTGRES_DB:-little_nate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - nate_network

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    # Pin to specific minor version for reproducibility; update deliberately
    image: redis:7.4-alpine
    container_name: nate_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:?Redis password required}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    # No ports exposed — only reachable by backend/bridge via nate_network (redis:6379)
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - nate_network

  # ---------------------------------------------------------------------------
  # PgBouncer — Connection Pooler (SESSION mode, deployed 2026-04-26)
  #
  # Routes the FastAPI backend's DB traffic through a single shared pool to
  # protect PostgreSQL from connection storms during burst load. SESSION mode
  # was chosen over TRANSACTION mode because the codebase has four hard
  # blockers that incompatible with transaction-scoped pooling. See
  # .cursor/rules/pgbouncer-session-mode.mdc for the full migration plan.
  #
  # CURRENT ROUTING (2026-04-26):
  #   backend → pgbouncer:6432 → postgres:5432  ✅ pooled
  #   bridge  → postgres:5432  (direct)         ❌ bypasses pgbouncer
  #
  # The bridge is intentionally NOT routed through pgbouncer because
  # bridge_server.py (a protected file, lines 29197-29199) hardcodes
  # `_pg_host = "postgres"` and reverts any other value. Touching this
  # without a feature flag and review is forbidden by `.cursorrules`. The
  # bridge runs a small fixed pool (min_size=2, max_size=40) so pooling
  # gives marginal benefit there anyway — see load-test-performance-baseline.mdc.
  #
  # FOUR BLOCKERS for switching to POOL_MODE: transaction (DO NOT toggle yet):
  #   1. db_encryption_middleware.py uses SESSION-scoped `SET app.pii_key`.
  #      Under transaction pooling, pgcrypto triggers (migration 105) lose
  #      the GUC between transactions and start emitting NULL/garbage on
  #      every INSERT/UPDATE that touches encrypted columns. Must convert
  #      to `SET LOCAL app.pii_key` inside an explicit BEGIN/COMMIT wrapper
  #      around each query that needs PII access — every single one.
  #   2. asyncpg pools default to statement_cache_size=100 (server-side
  #      prepared statements). Transaction pooling rotates the underlying
  #      server connection between client transactions, so prepared
  #      statement IDs go stale and fail with
  #      `prepared statement "__asyncpg_stmt_NNN__" does not exist`.
  #      Every `asyncpg.create_pool(...)` call site (50+ across backend)
  #      must add `statement_cache_size=0` before transaction mode flips on.
  #   3. backend/app/main.py (PROTECTED) infers DB host from a `@postgres:`
  #      substring of DATABASE_URL, falling back to settings.POSTGRES_HOST.
  #      We work around this today by setting POSTGRES_HOST=pgbouncer below.
  #      Transaction mode would not change this requirement, but cleaning it
  #      up belongs in the same migration.
  #   4. backend/app/websocket/bridge_server.py (PROTECTED) hardcodes
  #      `_pg_host = "postgres"`. Bridge cannot route through pgbouncer
  #      until this override is gated behind a feature flag with a
  #      # SOVEREIGN-VOICE comment per .cursorrules.
  #
  # Estimated migration effort to TRANSACTION mode: 1–2 weeks of careful
  # refactoring + a dedicated load-test pass. Do NOT start that work as a
  # side effect of any unrelated change.
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: nate_pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nate_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-little_nate}
      # edoburu/pgbouncer defaults listen_port to 5432; force the canonical
      # pgbouncer port so healthcheck and clients can reach it at :6432.
      LISTEN_PORT: 6432
      POOL_MODE: session
      DEFAULT_POOL_SIZE: 100
      MAX_CLIENT_CONN: 500
      RESERVE_POOL_SIZE: 20
      RESERVE_POOL_TIMEOUT: 5
      SERVER_LIFETIME: 3600
      SERVER_IDLE_TIMEOUT: 600
      AUTH_TYPE: scram-sha-256
      # STATS_USERS grants read-only access to the pgbouncer admin DB (-d pgbouncer)
      # for SHOW STATS / SHOW POOLS / SHOW SERVERS only — no RELOAD/SHUTDOWN/PAUSE.
      # Required by the 48h monitoring cron (pgbouncer-48h-monitor.log). Without
      # this, `psql -d pgbouncer` returns `FATAL: not allowed`. Added 2026-04-26.
      STATS_USERS: ${POSTGRES_USER:-nate_admin}
    # WireGuard IP only (GREEN wg0). Hetzner crystal-factory reaches pooled DB here.
    # Never bind 0.0.0.0:6432 — pair with UFW: allow 10.13.13.5/32 only, deny others.
    ports:
      - "10.13.13.2:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "${POSTGRES_USER:-nate_admin}"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - nate_network

  # ---------------------------------------------------------------------------
  # Backend API Server (FastAPI) — bind to localhost; Nginx terminates TLS
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nate_backend
    restart: unless-stopped
    env_file:
      - .env
    # CRITICAL: These override .env values with Docker-internal hostnames.
    # .env contains LAN IPs (10.0.0.81) unreachable inside the container network.
    # Do NOT remove — see learned-integration-patterns rule #14.
    #
    # PgBouncer routing (2026-04-26): Backend connects through pgbouncer:6432
    # in SESSION mode. We set DATABASE_URL *and* POSTGRES_HOST/PORT because
    # backend/app/main.py (PROTECTED) infers the asyncpg host via a
    # `@postgres:` substring of DATABASE_URL — any other value falls back to
    # settings.POSTGRES_HOST. Setting both env vars makes both code paths
    # deterministically land on pgbouncer. See pgbouncer-session-mode.mdc.
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nate_admin}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-little_nate}
      - POSTGRES_HOST=pgbouncer
      - POSTGRES_PORT=6432
      - POSTGRES_USER=${POSTGRES_USER:-nate_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-little_nate}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
      - SANDBOX_URL=http://10.13.13.4:9090
      - SANDBOX_HMAC_KEY=${SANDBOX_HMAC_KEY:-}
      - ENVIRONMENT=production
      - ENABLE_VOICE_TRANSCRIPT_CRYSTALLIZATION=true
      - DEBUG=false
      - MAC_AGENT_URL=https://twin-agent.sovereignsanctuary.net
      - MAC_AGENT_TOKEN=${MAC_AGENT_TOKEN:-}
      - WEB_CONCURRENCY=2
      # ---- Three-node compute routing for classroom video pipeline ----
      # See .cursor/rules/three-node-sync-discipline.mdc.
      # GREEN owns orchestration only. Heavy ML lives on ORANGE/BLUE.
      - NODE_COLOR=green
      # Hard guard: never load wav2vec2 (~1.5 GB) inside this 6 GB
      # container. Force VoiceEmotionAnalyzer into librosa-rules mode
      # whenever ORANGE is unreachable. Flip to "0" once ORANGE is live.
      # GREEN: keep 1 so local fallback never loads wav2vec2. ORANGE owns transformer.
      # Override in .env only if you accept OOM risk on this 6G container.
      - VOICE_EMOTION_FORCE_LIBROSA=${VOICE_EMOTION_FORCE_LIBROSA:-1}
      # ORANGE (Hetzner CAX41 over WireGuard) — wav2vec2 voice-emotion server.
      # Stays unset until backend/scripts/orange/voice_emotion_server.py
      # is deployed; classroom_remote_dispatch.voice_emotion_remote_enabled()
      # gates the dispatch.
      - CLASSROOM_VOICE_REMOTE_URL=${CLASSROOM_VOICE_REMOTE_URL:-}
      # BLUE (Mac via Twin Engine tunnel + overseer-manifold VPC) —
      # Apple GPU visual frame analysis server. Stays unset until the
      # Mac-side server is running and the tunnel route is wired.
      - CLASSROOM_VISUAL_REMOTE_URL=${CLASSROOM_VISUAL_REMOTE_URL:-}
      # Shared bearer between GREEN, ORANGE, and BLUE for the dispatch
      # endpoints. Generate once with `openssl rand -hex 32` and set on
      # all three nodes. Empty = no auth (only safe over WireGuard/tunnel).
      - CLASSROOM_REMOTE_AUTH_TOKEN=${CLASSROOM_REMOTE_AUTH_TOKEN:-}
      - CLASSROOM_REMOTE_TIMEOUT_SEC=${CLASSROOM_REMOTE_TIMEOUT_SEC:-300}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro    # Mount source code so scp+restart picks up changes
      - ./backend/assets:/app/assets:ro  # Backchannel clips + static assets
      - ./data/backend:/app/data
      - ./data/bridge:/app/bridge_data:ro  # Bridge metrics (PMB, Nevedal state) for dashboard read
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 6G
        reservations:
          memory: 768M
    networks:
      - nate_network

  # ---------------------------------------------------------------------------
  # WebSocket Bridge Server — bind to localhost; Nginx upgrades to WSS
  # ---------------------------------------------------------------------------
  bridge:
    build:
      context: ./backend
      dockerfile: Dockerfile.bridge
    container_name: nate_bridge
    restart: unless-stopped
    env_file:
      - .env
    # CRITICAL: These override .env values with Docker-internal hostnames.
    # Do NOT remove — see learned-integration-patterns rule #14.
    #
    # PgBouncer routing (2026-04-26): Bridge connects DIRECTLY to postgres,
    # NOT through pgbouncer. This is intentional. backend/app/websocket/
    # bridge_server.py (PROTECTED) hardcodes `_pg_host = "postgres"` at
    # lines 29197-29199 and reverts any other value, so pointing this env
    # at pgbouncer would have no effect and would silently drift the YAML
    # away from runtime reality. See pgbouncer-session-mode.mdc.
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nate_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-little_nate}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-nate_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-little_nate}
      - DATA_DIR=/app/data
      # Both bridge and backend share the SAME classroom_sessions.json
      # (backend's data dir is cross-mounted at /app/backend_data here).
      # Without this, bridge writes/reads diverge from the backend's
      # authoritative file and the Coach Command dropdown desyncs.
      - CLASSROOM_SESSIONS_FILE=/app/backend_data/classroom_sessions.json
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - ENABLE_VOICE_TRANSCRIPT_CRYSTALLIZATION=true
      - ENABLE_SUBCONSCIOUS=true
    ports:
      - "127.0.0.1:${WEBSOCKET_PORT:-8765}:8765"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro    # Mount source code so scp+restart picks up changes
      - ./backend/assets:/app/assets:ro  # Backchannel clips + static assets
      - ./data/bridge:/app/data
      # Read backend scheduling + Zoom join_url without duplicating stores
      - ./data/backend:/app/backend_data:ro
      - bridge_logs:/app/logs
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8765)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          memory: 768M
    networks:
      - nate_network

  # ---------------------------------------------------------------------------
  # Admin Console (React) — served by Nginx in production
  # ---------------------------------------------------------------------------
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: nate_admin
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=https://api.sovereignsanctuary.net
      - REACT_APP_API_BASE_URL=https://api.sovereignsanctuary.net
      - REACT_APP_WS_URL=wss://api.sovereignsanctuary.net/ws
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3000}:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - nate_network

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy — TLS termination + routing
  # ---------------------------------------------------------------------------
  nginx:
    # Pin to specific minor version for reproducibility; update deliberately
    image: nginx:1.27-alpine
    container_name: nate_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./mobile/build/web:/var/www/flutter-web:ro        # Flutter client/coach portal
      - ./dashboard:/var/www/dashboard:ro                  # Admin command portal
      - /var/www/certbot:/var/www/certbot:ro               # ACME challenges
    depends_on:
      backend:
        condition: service_healthy
      bridge:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - nate_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  bridge_logs:
    driver: local

networks:
  nate_network:
    driver: bridge
