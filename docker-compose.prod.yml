services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    # Pin to specific minor version for reproducibility; update deliberately
    image: postgres:15.10-alpine
    container_name: nate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-little_nate}
      POSTGRES_USER: ${POSTGRES_USER:-nate_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    # VPC port binding: allows clone VPS (10.120.0.6) to connect via DO VPC peering
    # Public internet cannot reach this — 10.120.0.2 is only accessible within the VPC subnet
    # UFW: 5432/tcp ALLOW 10.120.0.0/20 is already in place
    ports:
      - "10.120.0.2:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nate_admin} -d ${POSTGRES_DB:-little_nate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - nate_network

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    # Pin to specific minor version for reproducibility; update deliberately
    image: redis:7.4-alpine
    container_name: nate_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:?Redis password required}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    # VPC port binding: allows clone VPS (10.120.0.6) to connect via DO VPC peering
    # UFW already allows 6379/tcp from 10.120.0.0/20 for this purpose
    ports:
      - "10.120.0.2:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - nate_network

  # ---------------------------------------------------------------------------
  # PgBouncer — Connection Pooler (SESSION mode, deployed 2026-04-26)
  #
  # Routes the FastAPI backend's DB traffic through a single shared pool to
  # protect PostgreSQL from connection storms during burst load. SESSION mode
  # was chosen over TRANSACTION mode because the codebase has four hard
  # blockers that incompatible with transaction-scoped pooling. See
  # .cursor/rules/pgbouncer-session-mode.mdc for the full migration plan.
  #
  # CURRENT ROUTING (2026-04-26):
  #   backend → pgbouncer:6432 → postgres:5432  ✅ pooled
  #   bridge  → postgres:5432  (direct)         ❌ bypasses pgbouncer
  #
  # The bridge is intentionally NOT routed through pgbouncer because
  # bridge_server.py (a protected file, lines 29197-29199) hardcodes
  # `_pg_host = "postgres"` and reverts any other value. Touching this
  # without a feature flag and review is forbidden by `.cursorrules`. The
  # bridge runs a small fixed pool (min_size=2, max_size=40) so pooling
  # gives marginal benefit there anyway — see load-test-performance-baseline.mdc.
  #
  # FOUR BLOCKERS for switching to POOL_MODE: transaction (DO NOT toggle yet):
  #   1. db_encryption_middleware.py uses SESSION-scoped `SET app.pii_key`.
  #      Under transaction pooling, pgcrypto triggers (migration 105) lose
  #      the GUC between transactions and start emitting NULL/garbage on
  #      every INSERT/UPDATE that touches encrypted columns. Must convert
  #      to `SET LOCAL app.pii_key` inside an explicit BEGIN/COMMIT wrapper
  #      around each query that needs PII access — every single one.
  #   2. asyncpg pools default to statement_cache_size=100 (server-side
  #      prepared statements). Transaction pooling rotates the underlying
  #      server connection between client transactions, so prepared
  #      statement IDs go stale and fail with
  #      `prepared statement "__asyncpg_stmt_NNN__" does not exist`.
  #      Every `asyncpg.create_pool(...)` call site (50+ across backend)
  #      must add `statement_cache_size=0` before transaction mode flips on.
  #   3. backend/app/main.py (PROTECTED) infers DB host from a `@postgres:`
  #      substring of DATABASE_URL, falling back to settings.POSTGRES_HOST.
  #      We work around this today by setting POSTGRES_HOST=pgbouncer below.
  #      Transaction mode would not change this requirement, but cleaning it
  #      up belongs in the same migration.
  #   4. backend/app/websocket/bridge_server.py (PROTECTED) hardcodes
  #      `_pg_host = "postgres"`. Bridge cannot route through pgbouncer
  #      until this override is gated behind a feature flag with a
  #      # SOVEREIGN-VOICE comment per .cursorrules.
  #
  # Estimated migration effort to TRANSACTION mode: 1–2 weeks of careful
  # refactoring + a dedicated load-test pass. Do NOT start that work as a
  # side effect of any unrelated change.
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: nate_pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nate_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-little_nate}
      # edoburu/pgbouncer defaults listen_port to 5432; force the canonical
      # pgbouncer port so healthcheck and clients can reach it at :6432.
      LISTEN_PORT: 6432
      POOL_MODE: session
      DEFAULT_POOL_SIZE: 100
      MAX_CLIENT_CONN: 500
      RESERVE_POOL_SIZE: 20
      RESERVE_POOL_TIMEOUT: 5
      SERVER_LIFETIME: 3600
      SERVER_IDLE_TIMEOUT: 600
      AUTH_TYPE: scram-sha-256
      # STATS_USERS grants read-only access to the pgbouncer admin DB (-d pgbouncer)
      # for SHOW STATS / SHOW POOLS / SHOW SERVERS only — no RELOAD/SHUTDOWN/PAUSE.
      # Required by the 48h monitoring cron (pgbouncer-48h-monitor.log). Without
      # this, `psql -d pgbouncer` returns `FATAL: not allowed`. Added 2026-04-26.
      STATS_USERS: ${POSTGRES_USER:-nate_admin}
    # WireGuard IP only (GREEN wg0). Hetzner crystal-factory reaches pooled DB here.
    # Never bind 0.0.0.0:6432 — pair with UFW: allow 10.13.13.5/32 only, deny others.
    ports:
      - "10.13.13.2:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "${POSTGRES_USER:-nate_admin}"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - nate_network

  # ---------------------------------------------------------------------------
  # Backend API Server (FastAPI) — bind to localhost; Nginx terminates TLS
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nate_backend
    restart: unless-stopped
    env_file:
      - .env
    # CRITICAL: These override .env values with Docker-internal hostnames.
    # .env contains LAN IPs (10.0.0.81) unreachable inside the container network.
    # Do NOT remove — see learned-integration-patterns rule #14.
    #
    # PgBouncer routing (2026-04-26): Backend connects through pgbouncer:6432
    # in SESSION mode. We set DATABASE_URL *and* POSTGRES_HOST/PORT because
    # backend/app/main.py (PROTECTED) infers the asyncpg host via a
    # `@postgres:` substring of DATABASE_URL — any other value falls back to
    # settings.POSTGRES_HOST. Setting both env vars makes both code paths
    # deterministically land on pgbouncer. See pgbouncer-session-mode.mdc.
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nate_admin}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-little_nate}
      - POSTGRES_HOST=pgbouncer
      - POSTGRES_PORT=6432
      - POSTGRES_USER=${POSTGRES_USER:-nate_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-little_nate}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
      - SANDBOX_URL=http://10.13.13.4:9090
      - SANDBOX_HMAC_KEY=${SANDBOX_HMAC_KEY:-}
      - ENVIRONMENT=production
      # QUANTUM-CRYSTAL-ARCH — LN7 Step 0 weld tree (W13); host dir is SA-unwritable
      - FROZEN_CONFIG_DIR=/opt/ln7/frozen-config
      - ENABLE_VOICE_TRANSCRIPT_CRYSTALLIZATION=true
      # SOVEREIGN-VOICE — call identity / avatar sync / emotion pacing / guest intro
      - ENABLE_VOICE_IDENTITY=${ENABLE_VOICE_IDENTITY:-true}
      - ENABLE_VOICE_AVATAR_SYNC=${ENABLE_VOICE_AVATAR_SYNC:-true}
      - ENABLE_VOICE_EMOTION_PACE=${ENABLE_VOICE_EMOTION_PACE:-true}
      - ENABLE_VOICE_GUEST_INTRO=${ENABLE_VOICE_GUEST_INTRO:-true}
      # QUANTUM-CRYSTAL-ARCH: high-risk occupational crisis engine flags (pinned)
      - ENABLE_POPULATION_CRISIS_RESOURCES=${ENABLE_POPULATION_CRISIS_RESOURCES:-true}
      - ENABLE_NIGHT_REGISTER=${ENABLE_NIGHT_REGISTER:-true}
      - ENABLE_PEER_CULTURE_VOICE=${ENABLE_PEER_CULTURE_VOICE:-true}
      - ENABLE_CHECKIN_RISK_WINDOWS=${ENABLE_CHECKIN_RISK_WINDOWS:-true}
      - ENABLE_LETHAL_MEANS_GUIDANCE=${ENABLE_LETHAL_MEANS_GUIDANCE:-false}
      # QUANTUM-CRYSTAL-ARCH: CrystalGraph rebuild + constellation (Phase 5d; default off)
      - ENABLE_CRYSTAL_GRAPH=${ENABLE_CRYSTAL_GRAPH:-false}
      - CRYSTAL_GRAPH_MAX_EDGE_NODES=${CRYSTAL_GRAPH_MAX_EDGE_NODES:-20000}
      # QUANTUM-CRYSTAL-ARCH: SSE Grok Imagine cost controls (journey/daily/weekly/monthly)
      - SSE_IMAGERY_GENERATION_ENABLED=${SSE_IMAGERY_GENERATION_ENABLED:-false}
      - SSE_WEEKLY_CLIPS_ENABLED=${SSE_WEEKLY_CLIPS_ENABLED:-false}
      # xAI Management API (prepaid balance for /api/sse/monitor/provider-credits)
      - XAI_MANAGEMENT_KEY=${XAI_MANAGEMENT_KEY:-}
      - XAI_TEAM_ID=${XAI_TEAM_ID:-}
      - SSE_MONTHLY_RECAP_ENABLED=${SSE_MONTHLY_RECAP_ENABLED:-false}
      - ENABLE_INTAKE_SYSTEM=${ENABLE_INTAKE_SYSTEM:-true}
      - ENABLE_INTAKE_WALKTHROUGH=${ENABLE_INTAKE_WALKTHROUGH:-false}
      - INTAKE_SEMANTIC_CLASSIFIER=${INTAKE_SEMANTIC_CLASSIFIER:-true}
      - INTAKE_SEMANTIC_TIMEOUT_S=${INTAKE_SEMANTIC_TIMEOUT_S:-2.5}
      - INTAKE_SEMANTIC_CONF_FLOOR=${INTAKE_SEMANTIC_CONF_FLOOR:-0.62}
      - DEBUG=false
      - MAC_AGENT_URL=https://twin-agent.sovereignsanctuary.net
      - MAC_AGENT_TOKEN=${MAC_AGENT_TOKEN:-}
      # QUANTUM-CRYSTAL-ARCH — CLI neuro-symbolic + Mac↔Cloud task bus (Agents API / partner runs)
      - ENABLE_ASK_NATE_SYMBOLIC=${ENABLE_ASK_NATE_SYMBOLIC:-true}
      # QUANTUM-CRYSTAL-ARCH — Phase 5a/5b: defaults FALSE per roadmap phase gate;
      # explicit .env entry (with sign-off date) is what enables them. 5c/5d separate.
      - ENABLE_SYMBOLIC_EXTRACTION=${ENABLE_SYMBOLIC_EXTRACTION:-false}
      - ENABLE_SYMBOLIC_VERIFIER=${ENABLE_SYMBOLIC_VERIFIER:-false}
      - ENABLE_FORWARD_REASONING=${ENABLE_FORWARD_REASONING:-false}
      - ENABLE_CRYSTAL_GRAPH=${ENABLE_CRYSTAL_GRAPH:-false}
      - CRYSTAL_GRAPH_MAX_EDGE_NODES=${CRYSTAL_GRAPH_MAX_EDGE_NODES:-20000}
      - CLI_TASK_BUS_ENABLED=${CLI_TASK_BUS_ENABLED:-true}
      - CLI_TASK_BUS_CONSUMER_ENABLED=${CLI_TASK_BUS_CONSUMER_ENABLED:-true}
      - CLI_DUAL_COO_ENABLED=${CLI_DUAL_COO_ENABLED:-true}
      - ENABLE_SIX_QUOTIENT_BATTERY=${ENABLE_SIX_QUOTIENT_BATTERY:-false}
      - ENABLE_SIX_QUOTIENT_LIVING_BATTERY=${ENABLE_SIX_QUOTIENT_LIVING_BATTERY:-false}
      - ENABLE_SIX_QUOTIENT_MULTI_TURN=${ENABLE_SIX_QUOTIENT_MULTI_TURN:-true}
      - ENABLE_SIX_QUOTIENT_STANDARDS_INDEX=${ENABLE_SIX_QUOTIENT_STANDARDS_INDEX:-false}
      - ENABLE_SIX_QUOTIENT_SCENARIO_GEN=${ENABLE_SIX_QUOTIENT_SCENARIO_GEN:-false}
      # QUANTUM-CRYSTAL-ARCH — bi-weekly self-dev proposals → CEO YELLOW inbox
      - ENABLE_SIX_QUOTIENT_SELF_DEV=${ENABLE_SIX_QUOTIENT_SELF_DEV:-false}
      # QUANTUM-CRYSTAL-ARCH — live WS battery (needs audit_client)
      - SIX_QUOTIENT_BATTERY_LIVE_WS=${SIX_QUOTIENT_BATTERY_LIVE_WS:-false}
      # QUANTUM-CRYSTAL-ARCH — Sunday weekly live requires BOTH LIVE_WS and WEEKLY_LIVE
      - SIX_QUOTIENT_WEEKLY_LIVE=${SIX_QUOTIENT_WEEKLY_LIVE:-false}
      - SIX_QUOTIENT_BATTERY_ENV=${SIX_QUOTIENT_BATTERY_ENV:-production}
      - ENABLE_SIX_QUOTIENT_LIVE_CONTEXT=${ENABLE_SIX_QUOTIENT_LIVE_CONTEXT:-false}
      # QUANTUM-CRYSTAL-ARCH — D.14b battery→crystal quarantine (default on)
      - SIX_QUOTIENT_BATTERY_QUARANTINE=${SIX_QUOTIENT_BATTERY_QUARANTINE:-true}
      # QUANTUM-CRYSTAL-ARCH — D.12 nightly measure (default off)
      - SIX_QUOTIENT_NIGHTLY_MEASURE=${SIX_QUOTIENT_NIGHTLY_MEASURE:-false}
      # QUANTUM-CRYSTAL-ARCH — D.14b intra-rater gap (14 default; 0 = ops override for finalize)
      - TIER1_RECHECK_MIN_GAP_DAYS=${TIER1_RECHECK_MIN_GAP_DAYS:-14}
      # QUANTUM-CRYSTAL-ARCH — D.14b calendar soak waiver (operator-approved; default off)
      - TIER1_SOAK_WAIVED=${TIER1_SOAK_WAIVED:-false}
      # QUANTUM-CRYSTAL-ARCH — D.13 cycle/PGSD/PMB acceleration (default off)
      - ENABLE_SIX_QUOTIENT_ACCELERATION=${ENABLE_SIX_QUOTIENT_ACCELERATION:-false}
      # QUANTUM-CRYSTAL-ARCH — Tier 2 PGSD ladder (FIELD stays false until ACCESS smoke)
      - PGSD_ENABLED=${PGSD_ENABLED:-false}
      - ENABLE_PGSD_HEARTBEAT=${ENABLE_PGSD_HEARTBEAT:-false}
      - ENABLE_PGSD_ACCESS=${ENABLE_PGSD_ACCESS:-false}
      - ENABLE_PGSD_FIELD=${ENABLE_PGSD_FIELD:-false}
      - ENABLE_PGSD_HELIX_HINT=${ENABLE_PGSD_HELIX_HINT:-false}
      - TIER2_REQUIRE_SURFACE_HITS=${TIER2_REQUIRE_SURFACE_HITS:-true}
      - SIX_QUOTIENT_BRIDGE_WS_URL=${SIX_QUOTIENT_BRIDGE_WS_URL:-ws://bridge:8765/ws}
      - TEST_USERNAME=${TEST_USERNAME:-audit_client}
      - TEST_PASSWORD=${TEST_PASSWORD:-AuditClient2026!}
      - AUDIT_CLIENT_PASSWORD=${AUDIT_CLIENT_PASSWORD:-AuditClient2026!}
      - CRYSTAL_OUTCOME_APPLY_ENABLED=${CRYSTAL_OUTCOME_APPLY_ENABLED:-true}
      - CRYSTAL_OUTCOME_APPLY_INTERVAL_H=${CRYSTAL_OUTCOME_APPLY_INTERVAL_H:-24}
      # QUANTUM-CRYSTAL-ARCH — L4 auto-draft + L5 observe sandbox (soft gates only)
      - ENABLE_LN_RULE_LOOP=${ENABLE_LN_RULE_LOOP:-true}
      - LN_RULE_LOOP_APPLY=${LN_RULE_LOOP_APPLY:-true}
      - ENABLE_LN_RULE_AUTO_DRAFT=${ENABLE_LN_RULE_AUTO_DRAFT:-true}
      - LN_RULE_DUAL_COO_NOTIFY=${LN_RULE_DUAL_COO_NOTIFY:-true}
      - LN_RULE_PROMOTE_REQUIRES_CEO=${LN_RULE_PROMOTE_REQUIRES_CEO:-false}
      - LN_RULE_FP_DRAFT_MIN_N=${LN_RULE_FP_DRAFT_MIN_N:-3}
      - LN_RULE_FP_DRAFT_MAX_CONF=${LN_RULE_FP_DRAFT_MAX_CONF:-0.45}
      - LN_RULE_PROMOTE_MIN_N=${LN_RULE_PROMOTE_MIN_N:-5}
      - LN_RULE_PROMOTE_CONFIDENCE=${LN_RULE_PROMOTE_CONFIDENCE:-0.55}
      - LN_RULE_ROLLBACK_CONFIDENCE=${LN_RULE_ROLLBACK_CONFIDENCE:-0.25}
      - LN_RULE_SHADOW_PROMOTE_MIN=${LN_RULE_SHADOW_PROMOTE_MIN:-3}
      - LN_RULE_SHADOW_SCORE_PROMOTE_MIN=${LN_RULE_SHADOW_SCORE_PROMOTE_MIN:-3}
      - LN_RULE_ACCURACY_PROMOTE_FLOOR=${LN_RULE_ACCURACY_PROMOTE_FLOOR:-0.0}
      - LN_RULE_ACCURACY_PROMOTE_MIN_SCORED=${LN_RULE_ACCURACY_PROMOTE_MIN_SCORED:-5}
      - ENABLE_GATE_CONFIDENCE_FEEDBACK=${ENABLE_GATE_CONFIDENCE_FEEDBACK:-true}
      - ENABLE_L5_OBSERVE=${ENABLE_L5_OBSERVE:-true}
      - ENABLE_L5_ADAPT=${ENABLE_L5_ADAPT:-true}
      - DUAL_COO_LOOP_CLOSER_ENABLED=${DUAL_COO_LOOP_CLOSER_ENABLED:-true}
      - ENABLE_PATENT_REFLECTIONS=${ENABLE_PATENT_REFLECTIONS:-false}
      # QUANTUM-CRYSTAL-ARCH — Adaptive Growth Engine (Phase 1; default off)
      - ENABLE_GROWTH_ENGINE=${ENABLE_GROWTH_ENGINE:-false}
      - ENABLE_GROWTH_DIAGNOSTICS=${ENABLE_GROWTH_DIAGNOSTICS:-false}
      - ENABLE_CONTENT_FACTORY=${ENABLE_CONTENT_FACTORY:-false}
      - ENABLE_OUTREACH_ENGINE=${ENABLE_OUTREACH_ENGINE:-false}
      - ENABLE_BWAS=${ENABLE_BWAS:-false}
      - ENABLE_TRY_THEME_TELEMETRY=${ENABLE_TRY_THEME_TELEMETRY:-false}
      - OUTREACH_SENDER_DOMAINS=${OUTREACH_SENDER_DOMAINS:-}
      - INSTANTLY_API_KEY=${INSTANTLY_API_KEY:-}
      - GROWTH_PUBLIC_SITE_ROOT=${GROWTH_PUBLIC_SITE_ROOT:-/app/public_site}
      - PATENT_IDEA_STUDY_MAX_PER_DAY=${PATENT_IDEA_STUDY_MAX_PER_DAY:-3}
      - PATENT_IDEA_PROMOTE_MIN=${PATENT_IDEA_PROMOTE_MIN:-90}
      - PATENT_CORPUS_ROOT=${PATENT_CORPUS_ROOT:-/app/patent}
      - PATENT_SANDBOX_ROOT=${PATENT_SANDBOX_ROOT:-/app/data/patent_sandbox}
      - ENABLE_COACH_NATE_CHECKIN=${ENABLE_COACH_NATE_CHECKIN:-true}
      - COACH_NATE_CHECKIN_BILLING_ENABLED=${COACH_NATE_CHECKIN_BILLING_ENABLED:-false}
      - COACH_NATE_CHECKIN_VOICE_RECHECK_S=${COACH_NATE_CHECKIN_VOICE_RECHECK_S:-300}
      - COACH_NATE_CHECKIN_COST_CENTS_PER_MIN=${COACH_NATE_CHECKIN_COST_CENTS_PER_MIN:-5}
      - VOICE_SILENCE_COMPANION_ENABLED=${VOICE_SILENCE_COMPANION_ENABLED:-true}
      - VOICE_SILENCE_CHECKIN_S=${VOICE_SILENCE_CHECKIN_S:-25}
      - VOICE_SILENCE_FINAL_WAIT_S=${VOICE_SILENCE_FINAL_WAIT_S:-60}
      - VOICE_SILENCE_MAX_SOFT=${VOICE_SILENCE_MAX_SOFT:-3}
      - VOICE_SILENCE_STARTUP_GRACE_S=${VOICE_SILENCE_STARTUP_GRACE_S:-15}
      - ENABLE_CRYSTAL_ATTRIBUTION=${ENABLE_CRYSTAL_ATTRIBUTION:-true}
      - SOVEREIGN_STANDARD_GATE_ENABLED=${SOVEREIGN_STANDARD_GATE_ENABLED:-true}
      # QUANTUM-CRYSTAL-ARCH: mailto/SMS/HTTPS on prod API can apply staging negotiations
      - ENABLE_STAGING_NEGOTIATION_INBOUND_FALLBACK=${ENABLE_STAGING_NEGOTIATION_INBOUND_FALLBACK:-false}
      - STAGING_NEGOTIATION_DATABASE_URL=${STAGING_NEGOTIATION_DATABASE_URL:-}
      # QUANTUM-CRYSTAL-ARCH — Agentic Phase 0–4 + N.3. Roadmap: "flags stay off in
      # production until that phase's exit checklist passes. Deployed != enabled."
      # Defaults are therefore FALSE — a phase is live only via an explicit .env entry
      # (see the phase-gate sign-off block in .env / .env.template). Never flip to :-true.
      - ENABLE_PROACTIVE_TOUCH_POLICY=${ENABLE_PROACTIVE_TOUCH_POLICY:-false}
      - ENABLE_PROACTIVE_COMMITMENTS=${ENABLE_PROACTIVE_COMMITMENTS:-false}
      - ENABLE_NATE_TOOL_EXECUTOR=${ENABLE_NATE_TOOL_EXECUTOR:-false}
      - ENABLE_THERAPEUTIC_PLANS=${ENABLE_THERAPEUTIC_PLANS:-false}
      - ENABLE_CYCLE_SKILL_PLANS=${ENABLE_CYCLE_SKILL_PLANS:-false}
      - ENABLE_CLINICAL_TECHNIQUE_DIRECTORY=${ENABLE_CLINICAL_TECHNIQUE_DIRECTORY:-false}
      - ENABLE_CLINICAL_DIRECTORY_WEB_ENRICH=${ENABLE_CLINICAL_DIRECTORY_WEB_ENRICH:-false}
      - CYCLE_SKILL_EMAILS=${CYCLE_SKILL_EMAILS:-}
      - CYCLE_SKILL_COACH_EMAILS=${CYCLE_SKILL_COACH_EMAILS:-}
      - ENABLE_NATE_SESSION_NEGOTIATION=${ENABLE_NATE_SESSION_NEGOTIATION:-false}
      - ENABLE_SELF_MONITOR_AGENT=${ENABLE_SELF_MONITOR_AGENT:-false}
      - ENABLE_SELF_MONITOR_COACH_ALERT=${ENABLE_SELF_MONITOR_COACH_ALERT:-false}
      - ENABLE_SELF_MONITOR_TOUCH=${ENABLE_SELF_MONITOR_TOUCH:-false}
      # QUANTUM-CRYSTAL-ARCH — learning loop. Same phase-gate rule: default FALSE,
      # enabled only by an explicit .env entry with a dated sign-off.
      # Crystallizer loop runs on the BACKEND only (bridge holds a second instance
      # that must stay dormant or harvest double-counts).
      - ENABLE_CRYSTALLIZER_LOOP=${ENABLE_CRYSTALLIZER_LOOP:-false}
      # Singleton guard: PG advisory lock so only one process ever owns the loop
      # (covers the bridge instance and the clone VPS). Keep true.
      - ENABLE_CRYSTALLIZER_LOOP_GUARD=${ENABLE_CRYSTALLIZER_LOOP_GUARD:-true}
      - CRYSTALLIZER_COLD_START_LOOKBACK_DAYS=${CRYSTALLIZER_COLD_START_LOOKBACK_DAYS:-7}
      - ENABLE_DOMAIN_AGENTS=${ENABLE_DOMAIN_AGENTS:-false}
      # QUANTUM-CRYSTAL-ARCH: must stay 1 — each uvicorn worker runs the full lifespan,
      # so >1 duplicates every background agent/auditor (duplicate audits, login collisions)
      - WEB_CONCURRENCY=1
      # ---- Three-node compute routing for classroom video pipeline ----
      # See .cursor/rules/three-node-sync-discipline.mdc.
      # GREEN owns orchestration only. Heavy ML lives on ORANGE/BLUE.
      - NODE_COLOR=green
      # Hard guard: never load wav2vec2 (~1.5 GB) inside this 6 GB
      # container. Force VoiceEmotionAnalyzer into librosa-rules mode
      # whenever ORANGE is unreachable. Flip to "0" once ORANGE is live.
      # GREEN: keep 1 so local fallback never loads wav2vec2. ORANGE owns transformer.
      # Override in .env only if you accept OOM risk on this 6G container.
      - VOICE_EMOTION_FORCE_LIBROSA=${VOICE_EMOTION_FORCE_LIBROSA:-1}
      # ORANGE (Hetzner CAX41 over WireGuard) — wav2vec2 voice-emotion server.
      # Stays unset until backend/scripts/orange/voice_emotion_server.py
      # is deployed; classroom_remote_dispatch.voice_emotion_remote_enabled()
      # gates the dispatch.
      - CLASSROOM_VOICE_REMOTE_URL=${CLASSROOM_VOICE_REMOTE_URL:-}
      # BLUE (Mac via Twin Engine tunnel + overseer-manifold VPC) —
      # Apple GPU visual frame analysis server. Stays unset until the
      # Mac-side server is running and the tunnel route is wired.
      - CLASSROOM_VISUAL_REMOTE_URL=${CLASSROOM_VISUAL_REMOTE_URL:-}
      # Shared bearer between GREEN, ORANGE, and BLUE for the dispatch
      # endpoints. Generate once with `openssl rand -hex 32` and set on
      # all three nodes. Empty = no auth (only safe over WireGuard/tunnel).
      - CLASSROOM_REMOTE_AUTH_TOKEN=${CLASSROOM_REMOTE_AUTH_TOKEN:-}
      - CLASSROOM_REMOTE_TIMEOUT_SEC=${CLASSROOM_REMOTE_TIMEOUT_SEC:-300}
      # SkyEye LinkedIn Gemini hero images (ORIG/PERS at publish; GEMINI_API_KEY from .env)
      - ENABLE_SKYEYE_LINKEDIN_IMAGES=${ENABLE_SKYEYE_LINKEDIN_IMAGES:-false}
      - GEMINI_IMAGE_MODEL=${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-image}
      - GEMINI_LINKEDIN_ASPECT=${GEMINI_LINKEDIN_ASPECT:-16:9}
      - GEMINI_LINKEDIN_IMAGE_SIZE=${GEMINI_LINKEDIN_IMAGE_SIZE:-2K}
      - SKYEYE_LINKEDIN_BRAND_STYLE=${SKYEYE_LINKEDIN_BRAND_STYLE:-true}
      - SKYEYE_LINKEDIN_BRAND_REFS=${SKYEYE_LINKEDIN_BRAND_REFS:-true}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro    # Mount source code so scp+restart picks up changes
      - ./backend/tests:/app/tests:ro  # QUANTUM-CRYSTAL-ARCH: parity fixtures track git, not image
      - ./backend/scripts:/app/scripts:ro  # QUANTUM-CRYSTAL-ARCH backfill / audit scripts (docker exec)
      - ./backend/assets:/app/assets:ro  # Backchannel clips + static assets
      - ./dashboard:/app/dashboard:ro  # QUANTUM-CRYSTAL-ARCH: CLI-Cloud discovery (Nevedal Lab UI)
      - ./mobile/lib:/app/mobile/lib:ro  # QUANTUM-CRYSTAL-ARCH: CLI-Cloud discovery (Flutter)
      - ./backend/migrations:/app/migrations:ro  # QUANTUM-CRYSTAL-ARCH: CLI-Cloud discovery (schema)
      - ./patent:/app/patent:ro  # QUANTUM-CRYSTAL-ARCH: Dual-COO patent idea corpus (read-only)
      - ./frozen-config:/opt/ln7/frozen-config:ro  # QUANTUM-CRYSTAL-ARCH — Step 0 fence (W13)
      - ./data/backend:/app/data
      - ./data/bridge:/app/bridge_data:ro  # Bridge metrics (PMB, Nevedal state) for dashboard read
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 6G
        reservations:
          memory: 768M
    networks:
      - nate_network

  # ---------------------------------------------------------------------------
  # WebSocket Bridge Server — bind to localhost; Nginx upgrades to WSS
  # ---------------------------------------------------------------------------
  bridge:
    build:
      context: ./backend
      dockerfile: Dockerfile.bridge
    container_name: nate_bridge
    restart: unless-stopped
    env_file:
      - .env
    # CRITICAL: These override .env values with Docker-internal hostnames.
    # Do NOT remove — see learned-integration-patterns rule #14.
    #
    # PgBouncer routing (2026-04-26): Bridge connects DIRECTLY to postgres,
    # NOT through pgbouncer. This is intentional. backend/app/websocket/
    # bridge_server.py (PROTECTED) hardcodes `_pg_host = "postgres"` at
    # lines 29197-29199 and reverts any other value, so pointing this env
    # at pgbouncer would have no effect and would silently drift the YAML
    # away from runtime reality. See pgbouncer-session-mode.mdc.
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nate_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-little_nate}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-nate_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-little_nate}
      - DATA_DIR=/app/data
      # Both bridge and backend share the SAME classroom_sessions.json
      # (backend's data dir is cross-mounted at /app/backend_data here).
      # Without this, bridge writes/reads diverge from the backend's
      # authoritative file and the Coach Command dropdown desyncs.
      - CLASSROOM_SESSIONS_FILE=/app/backend_data/classroom_sessions.json
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      # Coaching scope gate stack — dark-launch defaults; flip after 48h review + clinical sign-off
      - ENABLE_COACHING_SCOPE_GATE=${ENABLE_COACHING_SCOPE_GATE:-false}
      - ENABLE_CLASSIFIER_LAYER=${ENABLE_CLASSIFIER_LAYER:-false}
      # QUANTUM-CRYSTAL-ARCH — LetsGoLisa direct-first / mode-switch style overrides
      - ENABLE_CLIENT_STYLE_OVERRIDES=${ENABLE_CLIENT_STYLE_OVERRIDES:-true}
      - ENABLE_ARC_MEMORY=${ENABLE_ARC_MEMORY:-false}
      - ENABLE_STANCE_RESOLVER=${ENABLE_STANCE_RESOLVER:-false}
      - ENABLE_STALL_SUPPRESSION=${ENABLE_STALL_SUPPRESSION:-false}
      - ENABLE_MED_ADJUST_REDIRECT=${ENABLE_MED_ADJUST_REDIRECT:-false}
      - ENABLE_TRAFFICKING_RECAL=${ENABLE_TRAFFICKING_RECAL:-false}
      - ENABLE_DAILY_RECONNECT=${ENABLE_DAILY_RECONNECT:-false}
      - ENABLE_TRAINING_GROUND=${ENABLE_TRAINING_GROUND:-false}
      - ENABLE_VOICE_TRANSCRIPT_CRYSTALLIZATION=true
      - ENABLE_VOICE_IDENTITY=${ENABLE_VOICE_IDENTITY:-true}
      - ENABLE_VOICE_AVATAR_SYNC=${ENABLE_VOICE_AVATAR_SYNC:-true}
      - ENABLE_VOICE_EMOTION_PACE=${ENABLE_VOICE_EMOTION_PACE:-true}
      - ENABLE_VOICE_GUEST_INTRO=${ENABLE_VOICE_GUEST_INTRO:-true}
      - ENABLE_CRYSTAL_ATTRIBUTION=${ENABLE_CRYSTAL_ATTRIBUTION:-true}
      - ENABLE_SUBCONSCIOUS=true
      - ENABLE_INTAKE_SYSTEM=${ENABLE_INTAKE_SYSTEM:-true}
      - ENABLE_INTAKE_WALKTHROUGH=${ENABLE_INTAKE_WALKTHROUGH:-false}
      - INTAKE_SEMANTIC_CLASSIFIER=${INTAKE_SEMANTIC_CLASSIFIER:-true}
      - INTAKE_SEMANTIC_TIMEOUT_S=${INTAKE_SEMANTIC_TIMEOUT_S:-2.5}
      - INTAKE_SEMANTIC_CONF_FLOOR=${INTAKE_SEMANTIC_CONF_FLOOR:-0.62}
      - WORKERS_AI_URL=${WORKERS_AI_URL:-}
      - WORKERS_AI_TOKEN=${WORKERS_AI_TOKEN:-}
      - WORKERS_AI_MODEL=${WORKERS_AI_MODEL:-@cf/meta/llama-3.1-8b-instruct}
      - NATE_CHAT_URL=${NATE_CHAT_URL:-}
      - NATE_CHAT_KEY=${NATE_CHAT_KEY:-}
      - NATE_CHAT_MODEL=${NATE_CHAT_MODEL:-grok-4-1-fast-non-reasoning}
      # QUANTUM-CRYSTAL-ARCH — Phase A0: Grok 4.5 for LN-FAB/DEBUG (ASK/PLAN keep NATE_CHAT_MODEL)
      - NATE_CLI_REASONING_MODEL=${NATE_CLI_REASONING_MODEL:-}
      - NATE_CLI_CODE_MODEL=${NATE_CLI_CODE_MODEL:-}
      - NATE_CLI_CODE_URL=${NATE_CLI_CODE_URL:-}
      - NATE_CLI_CODE_KEY=${NATE_CLI_CODE_KEY:-}
      - CLI_REASONING_PREFER_AZURE=${CLI_REASONING_PREFER_AZURE:-0}
      - ENABLE_WORKSPACE_PROVIDER=${ENABLE_WORKSPACE_PROVIDER:-0}
      # QUANTUM-CRYSTAL-ARCH — CLI neuro-symbolic + Mac↔Cloud shared task bus (bridge CLI path)
      - ENABLE_ASK_NATE_SYMBOLIC=${ENABLE_ASK_NATE_SYMBOLIC:-true}
      # QUANTUM-CRYSTAL-ARCH — Phase 5a/5b defaults FALSE (mirror backend); .env enables
      - ENABLE_SYMBOLIC_EXTRACTION=${ENABLE_SYMBOLIC_EXTRACTION:-false}
      - ENABLE_SYMBOLIC_VERIFIER=${ENABLE_SYMBOLIC_VERIFIER:-false}
      - ENABLE_FORWARD_REASONING=${ENABLE_FORWARD_REASONING:-false}
      # QUANTUM-CRYSTAL-ARCH — D.14b: bridge therapy uses live_context + quarantine
      - ENABLE_SIX_QUOTIENT_LIVE_CONTEXT=${ENABLE_SIX_QUOTIENT_LIVE_CONTEXT:-false}
      - SIX_QUOTIENT_BATTERY_QUARANTINE=${SIX_QUOTIENT_BATTERY_QUARANTINE:-true}
      # QUANTUM-CRYSTAL-ARCH — Tier 2 PGSD ladder (mirror backend; FIELD off)
      - PGSD_ENABLED=${PGSD_ENABLED:-false}
      - ENABLE_PGSD_HEARTBEAT=${ENABLE_PGSD_HEARTBEAT:-false}
      - ENABLE_PGSD_ACCESS=${ENABLE_PGSD_ACCESS:-false}
      - ENABLE_PGSD_FIELD=${ENABLE_PGSD_FIELD:-false}
      - ENABLE_PGSD_HELIX_HINT=${ENABLE_PGSD_HELIX_HINT:-false}
      - TIER2_REQUIRE_SURFACE_HITS=${TIER2_REQUIRE_SURFACE_HITS:-true}
      - CLI_TASK_BUS_ENABLED=${CLI_TASK_BUS_ENABLED:-true}
      # QUANTUM-CRYSTAL-ARCH — SI/violence coach alert default on (opt-out with =false)
      - ENABLE_UNIVERSAL_SI_COACH_ALERT=${ENABLE_UNIVERSAL_SI_COACH_ALERT:-true}
      - SI_COACH_ALERT_DEDUP_HOURS=${SI_COACH_ALERT_DEDUP_HOURS:-24}
      # QUANTUM-CRYSTAL-ARCH — high-risk occupational crisis flags (mirror backend)
      - ENABLE_POPULATION_CRISIS_RESOURCES=${ENABLE_POPULATION_CRISIS_RESOURCES:-true}
      - ENABLE_NIGHT_REGISTER=${ENABLE_NIGHT_REGISTER:-true}
      - ENABLE_PEER_CULTURE_VOICE=${ENABLE_PEER_CULTURE_VOICE:-true}
      - ENABLE_CHECKIN_RISK_WINDOWS=${ENABLE_CHECKIN_RISK_WINDOWS:-true}
      - ENABLE_LETHAL_MEANS_GUIDANCE=${ENABLE_LETHAL_MEANS_GUIDANCE:-false}
      # QUANTUM-CRYSTAL-ARCH — Public Trial Funnel: dark-launch default false
      - PUBLIC_TRIAL_ENABLED=${PUBLIC_TRIAL_ENABLED:-false}
      - MAX_TRIAL_TURNS_PER_DAY=${MAX_TRIAL_TURNS_PER_DAY:-2000}
      # QUANTUM-CRYSTAL-ARCH — Agentic Phase 0–4 + N.3 (mirror backend).
      # Defaults FALSE per roadmap phase gate; explicit .env entry is the enable record.
      - ENABLE_PROACTIVE_TOUCH_POLICY=${ENABLE_PROACTIVE_TOUCH_POLICY:-false}
      - ENABLE_PROACTIVE_COMMITMENTS=${ENABLE_PROACTIVE_COMMITMENTS:-false}
      - ENABLE_NATE_TOOL_EXECUTOR=${ENABLE_NATE_TOOL_EXECUTOR:-false}
      - ENABLE_THERAPEUTIC_PLANS=${ENABLE_THERAPEUTIC_PLANS:-false}
      - ENABLE_CYCLE_SKILL_PLANS=${ENABLE_CYCLE_SKILL_PLANS:-false}
      - ENABLE_CLINICAL_TECHNIQUE_DIRECTORY=${ENABLE_CLINICAL_TECHNIQUE_DIRECTORY:-false}
      - ENABLE_CLINICAL_DIRECTORY_WEB_ENRICH=${ENABLE_CLINICAL_DIRECTORY_WEB_ENRICH:-false}
      - CYCLE_SKILL_EMAILS=${CYCLE_SKILL_EMAILS:-}
      - CYCLE_SKILL_COACH_EMAILS=${CYCLE_SKILL_COACH_EMAILS:-}
      - ENABLE_NATE_SESSION_NEGOTIATION=${ENABLE_NATE_SESSION_NEGOTIATION:-false}
      - ENABLE_SELF_MONITOR_AGENT=${ENABLE_SELF_MONITOR_AGENT:-false}
      - ENABLE_SELF_MONITOR_COACH_ALERT=${ENABLE_SELF_MONITOR_COACH_ALERT:-false}
      - ENABLE_SELF_MONITOR_TOUCH=${ENABLE_SELF_MONITOR_TOUCH:-false}
      # QUANTUM-CRYSTAL-ARCH — bridge_enrichment tiers. LN_ENRICHMENT is the master
      # switch; LN_T2_ENRICH gates federated recall + HelixOrchestrator.think() on the
      # chat path. Default FALSE per phase gate; enable via explicit .env entry.
      - LN_ENRICHMENT=${LN_ENRICHMENT:-false}
      - LN_T1_ENRICH=${LN_T1_ENRICH:-}
      - LN_T2_ENRICH=${LN_T2_ENRICH:-}
      # QUANTUM-CRYSTAL-ARCH — L4 auto-draft + L5 observe (bridge soft-gate path)
      - ENABLE_LN_RULE_LOOP=${ENABLE_LN_RULE_LOOP:-true}
      - LN_RULE_LOOP_APPLY=${LN_RULE_LOOP_APPLY:-true}
      - ENABLE_LN_RULE_AUTO_DRAFT=${ENABLE_LN_RULE_AUTO_DRAFT:-true}
      - LN_RULE_DUAL_COO_NOTIFY=${LN_RULE_DUAL_COO_NOTIFY:-true}
      - LN_RULE_PROMOTE_REQUIRES_CEO=${LN_RULE_PROMOTE_REQUIRES_CEO:-false}
      - LN_RULE_FP_DRAFT_MIN_N=${LN_RULE_FP_DRAFT_MIN_N:-3}
      - LN_RULE_FP_DRAFT_MAX_CONF=${LN_RULE_FP_DRAFT_MAX_CONF:-0.45}
      - LN_RULE_PROMOTE_MIN_N=${LN_RULE_PROMOTE_MIN_N:-5}
      - LN_RULE_PROMOTE_CONFIDENCE=${LN_RULE_PROMOTE_CONFIDENCE:-0.55}
      - LN_RULE_ROLLBACK_CONFIDENCE=${LN_RULE_ROLLBACK_CONFIDENCE:-0.25}
      - LN_RULE_SHADOW_PROMOTE_MIN=${LN_RULE_SHADOW_PROMOTE_MIN:-3}
      - LN_RULE_SHADOW_SCORE_PROMOTE_MIN=${LN_RULE_SHADOW_SCORE_PROMOTE_MIN:-3}
      - LN_RULE_ACCURACY_PROMOTE_FLOOR=${LN_RULE_ACCURACY_PROMOTE_FLOOR:-0.0}
      - LN_RULE_ACCURACY_PROMOTE_MIN_SCORED=${LN_RULE_ACCURACY_PROMOTE_MIN_SCORED:-5}
      - ENABLE_GATE_CONFIDENCE_FEEDBACK=${ENABLE_GATE_CONFIDENCE_FEEDBACK:-true}
      - ENABLE_L5_OBSERVE=${ENABLE_L5_OBSERVE:-true}
      - ENABLE_L5_ADAPT=${ENABLE_L5_ADAPT:-true}
    ports:
      - "127.0.0.1:${WEBSOCKET_PORT:-8765}:8765"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro    # Mount source code so scp+restart picks up changes
      - ./backend/assets:/app/assets:ro  # Backchannel clips + static assets
      - ./dashboard:/app/dashboard:ro  # QUANTUM-CRYSTAL-ARCH: CLI-Cloud discovery (Nevedal Lab UI)
      - ./mobile/lib:/app/mobile/lib:ro  # QUANTUM-CRYSTAL-ARCH: CLI-Cloud discovery (Flutter)
      - ./backend/migrations:/app/migrations:ro  # QUANTUM-CRYSTAL-ARCH: CLI-Cloud discovery (schema)
      - ./data/bridge:/app/data
      # Read backend scheduling + Zoom join_url without duplicating stores
      - ./data/backend:/app/backend_data:ro
      - bridge_logs:/app/logs
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8765)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          memory: 768M
    networks:
      - nate_network

  # ---------------------------------------------------------------------------
  # Admin Console (React) — served by Nginx in production
  # ---------------------------------------------------------------------------
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: nate_admin
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=https://api.sovereignsanctuary.net
      - REACT_APP_API_BASE_URL=https://api.sovereignsanctuary.net
      - REACT_APP_WS_URL=wss://api.sovereignsanctuary.net/ws
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3000}:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - nate_network

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy — TLS termination + routing
  # ---------------------------------------------------------------------------
  nginx:
    # Pin to specific minor version for reproducibility; update deliberately
    image: nginx:1.27-alpine
    container_name: nate_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./mobile/build/web:/var/www/flutter-web:ro        # Flutter client/coach portal
      - ./dashboard:/var/www/dashboard:ro                  # Admin command portal
      - /var/www/certbot:/var/www/certbot:ro               # ACME challenges
    depends_on:
      backend:
        condition: service_healthy
      bridge:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - nate_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  bridge_logs:
    driver: local

networks:
  nate_network:
    driver: bridge
