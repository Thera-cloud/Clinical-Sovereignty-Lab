# Brand SSR for www only. Root is NOT Flutter (sovereignsanctuary-web).
# Apex 301s to www if this host ever receives apex traffic.

server {
    listen 80;
    server_name sovereignsanctuary.net;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://www.sovereignsanctuary.net$request_uri;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name www.sovereignsanctuary.net;

    ssl_certificate     /etc/ssl/certs/www.sovereignsanctuary.net.crt;
    ssl_certificate_key /etc/ssl/private/www.sovereignsanctuary.net.key;

    root /var/www/sovereign-brand;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /home { return 301 /; }
    location = /new-page { return 301 /safety; }
    location = /clinical-safety { return 301 /safety; }
    location = /cart { return 301 /pricing; }

    location /coaches/ {
        try_files $uri $uri/index.html $uri/ @disco_coaches;
    }
    location @disco_coaches {
        rewrite ^/coaches/(.*)$ /api/v1/public/disco/coaches/$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
