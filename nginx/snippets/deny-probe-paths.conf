# Probe names are remembered by Hive, then answered 404.
# A repeated wordlist receives a canary page. Real routes stay on the site fallback.
# Include inside the HTTPS server, next to location /. Exact locations win over these.
# The token file is created on the host and is not in git.

include /etc/nginx/snippets/edge-probe-token.conf;

location @probe_closed {
    internal;
    return 404;
}

location ^~ /.well-known/ {
    try_files $uri =404;
}

location ~ /\. {
    include /etc/nginx/snippets/edge-probe-proxy.conf;
}

location ~* \.(php|phtml|phar)$ {
    include /etc/nginx/snippets/edge-probe-proxy.conf;
}

location ~* /(wp-admin|wp-login|wp-config|wp-content|wp-includes|xmlrpc|phpunit|cgi-bin) {
    include /etc/nginx/snippets/edge-probe-proxy.conf;
}
