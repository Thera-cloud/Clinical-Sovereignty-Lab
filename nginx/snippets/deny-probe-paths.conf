# Probe names return 404. Real routes still use the vhost's site-page fallback.
# Include inside the HTTPS server, next to location /. Exact locations win over these.

location ^~ /.well-known/ {
    try_files $uri =404;
}

location ~ /\. {
    return 404;
}

location ~* \.(php|phtml|phar)$ {
    return 404;
}

location ~* /(wp-admin|wp-login|wp-config|wp-content|wp-includes|xmlrpc|phpunit|cgi-bin) {
    return 404;
}
