location = /index.html {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src https://*.r2.cloudflarestorage.com https://vault.sovereign-sanctuary.com https://fonts.gstatic.com https://fonts.googleapis.com https://www.gstatic.com 'self' wss://api.sovereignsanctuary.net https://api.sovereignsanctuary.net wss://app.sovereignsanctuary.net https://challenges.cloudflare.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; worker-src 'self' blob:; object-src 'none';" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}
location = /flutter_service_worker.js {
    add_header Cache-Control 'no-cache, no-store, must-revalidate';
    add_header Pragma 'no-cache';
}
location = /flutter_bootstrap.js {
    add_header Cache-Control 'no-cache, no-store, must-revalidate';
    add_header Pragma 'no-cache';
}
location = /main.dart.js {
    add_header Cache-Control 'no-cache, no-store, must-revalidate';
    add_header Pragma 'no-cache';
}
location = /version.json {
    add_header Cache-Control 'no-cache, no-store, must-revalidate';
    add_header Pragma 'no-cache';
}
