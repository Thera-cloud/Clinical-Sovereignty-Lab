# Included from the probe locations. $edge_probe_token is set by the host-only
# file /etc/nginx/snippets/edge-probe-token.conf. A backend miss still returns 404.

rewrite ^ /api/edge-probe break;
proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Edge-Probe-Token $edge_probe_token;
proxy_set_header X-Original-URI $request_uri;
proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
proxy_pass_request_body off;
proxy_set_header Content-Length "";
proxy_connect_timeout 1s;
proxy_read_timeout 2s;
proxy_intercept_errors on;
error_page 502 504 = @probe_closed;
