# Clone → GREEN over VPC for paths the clone cannot serve.
# GREEN nginx :443 listens on 10.120.0.2; backend :8000 is localhost-only.
# QUANTUM-CRYSTAL-ARCH
location /api/studio {
    proxy_pass https://10.120.0.2;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name api.sovereignsanctuary.net;
    proxy_ssl_verify off;
    proxy_set_header Host api.sovereignsanctuary.net;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120;
    proxy_send_timeout 120;
    proxy_connect_timeout 10;
    include /etc/nginx/snippets/api-cors-proxy-headers.conf;
}

location /api/ln-observer {
    proxy_pass https://10.120.0.2;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name api.sovereignsanctuary.net;
    proxy_ssl_verify off;
    proxy_set_header Host api.sovereignsanctuary.net;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    include /etc/nginx/snippets/api-cors-proxy-headers.conf;
}

