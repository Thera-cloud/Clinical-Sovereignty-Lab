# GREEN host nginx — public LiveKit health. Never probe ORANGE public IP.
# Proxy FastAPI status until LIVEKIT_INTERNAL_URL is live on 10.13.13.5:7880.
# QUANTUM-CRYSTAL-ARCH

location = /health/livekit {
    proxy_pass http://127.0.0.1:8000/api/studio/livekit/health;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache";
}
