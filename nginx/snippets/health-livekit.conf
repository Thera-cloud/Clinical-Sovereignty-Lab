# GREEN host nginx — LiveKit health + WSS to ORANGE WG.
# Never probe ORANGE public :11434. QUANTUM-CRYSTAL-ARCH

location = /health/livekit {
    proxy_pass http://127.0.0.1:8000/api/studio/livekit/health;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache";
}

# Browser signaling. Pin Cloudflare LB /livekit to primary (clone has no WG).
location /livekit/ {
    proxy_pass http://10.13.13.5:7880/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /livekit {
    return 301 /livekit/;
}
