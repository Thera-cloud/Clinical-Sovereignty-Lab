# Coach Integrations / STUDIO uploads — persist-first, but keep a long
# read timeout so a leftover sync STT path cannot 504 the coach UI.
# Include inside the api.sovereignsanctuary.net server block, before location /.
# QUANTUM-CRYSTAL-ARCH

location /api/coach/integrations/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180;
    proxy_send_timeout 180;
    include /etc/nginx/snippets/api-cors-proxy-headers.conf;
}
