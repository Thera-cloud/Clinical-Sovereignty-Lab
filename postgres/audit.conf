# PostgreSQL Audit Logging Configuration
# Loaded via ALTER SYSTEM or included from postgresql.conf

# Log all data-modifying statements (INSERT, UPDATE, DELETE, DDL)
log_statement = 'mod'

# Log who ran each query (user, database, app name)
log_line_prefix = '%t [%u@%d] [%a] [%p] '

# Log all connections/disconnections for session tracking
log_connections = on
log_disconnections = on

# Log slow queries (>500ms) for performance auditing
log_min_duration_statement = 500

# Log all DDL statements regardless of duration
log_duration = off

# Ensure CSV log format for structured parsing
logging_collector = on
log_destination = 'stderr'

# Log checkpoints for durability auditing
log_checkpoints = on

# Log lock waits >100ms
log_lock_waits = on
deadlock_timeout = 1s
